# Which test scripts still need to run, decided by what has changed since the last passing run.
#
# what-changed reports; scripts/test-everything-parallel.sh reads that report, runs the affected
# scripts, and records a new baseline only when they all pass. See docs/git-hooks.md.
#
# Every target name here is passed straight to scripts/test-everything-parallel.sh as a script name,
# so they must match the script names in package.json exactly.

# Paths that fall under every target: anything that changes how every suite runs.
#
# bun.lock is here because installed dependencies live in node_modules, which is gitignored and
# therefore never hashed. The lockfile is the only tracked evidence that they changed.
always:
  - package.json
  - bun.lock
  - mise.toml
  - what-changed.yaml
  - scripts
  - .githooks

# Extensions left out of the file list entirely, so a documentation-only change runs nothing.
ignore:
  - .md
  - .txt
  - .log

targets:
  - name: compile
    paths:
      - packages
      - apps

  - name: test
    paths:
      - packages
      - apps

  - name: test:cli
    paths:
      - apps/cli
      - packages

  - name: test:cli:encrypted
    paths:
      - apps/cli
      - packages

  - name: test:cli:lan-share
    paths:
      - apps/cli
      - packages

  - name: test:cli:sync
    paths:
      - apps/cli
      - packages

  - name: test:cli:write-lock
    paths:
      - apps/cli
      - packages

  - name: test:cli:hash-cache
    paths:
      - apps/cli
      - packages

  # The smoke tests of the Zig port of psi (apps/cli-zig and the packages-zig ports): copies of the
  # TypeScript smoke suites with the ported commands run in the Zig CLI.
  - name: test:cli:zig
    paths:
      - apps/cli
      - apps/cli-zig
      - packages
      - packages-zig

  - name: test:cli:encrypted:zig
    paths:
      - apps/cli
      - apps/cli-zig
      - packages
      - packages-zig

  - name: test:cli:sync:zig
    paths:
      - apps/cli
      - apps/cli-zig
      - packages
      - packages-zig

  - name: test:cli:write-lock:zig
    paths:
      - apps/cli
      - apps/cli-zig
      - packages
      - packages-zig

  - name: test:cli:lan-share:zig
    paths:
      - apps/cli
      - apps/cli-zig
      - packages
      - packages-zig

  - name: test:cli:hash-cache:zig
    paths:
      - apps/cli
      - apps/cli-zig
      - packages
      - packages-zig

  - name: test:electron
    paths:
      - apps/desktop
      - apps/desktop-frontend
      - packages

  # The suite itself is a script at the repository root, so it has to be named as a path of its own.
  # Nothing under packages or apps matches it, which is how a change to it went five days without
  # running anything.
  - name: test:lan-share:cli-desktop
    paths:
      - cli-desktop-lan-share-smoke-tests.sh
      - apps/cli
      - apps/desktop
      - apps/desktop-frontend
      - packages

  # The mobile test harness's own tests: the run lock, the work queue and worker pool, and the
  # timeout helper. They drive shell, not the app, so they need no device and run on every platform.
  - name: test:harness
    paths:
      - apps/smoke-tests

  # The mobile suites need a toolchain that only exists on one platform: an Android emulator for
  # these two, Xcode for the two below. Listing platforms keeps them out of the report entirely on
  # the other one, so the runner is never asked for a script it cannot run.
  - name: test:and
    paths:
      - apps/android-frontend
      - apps/smoke-tests
      - packages
    platforms:
      - linux

  - name: test:and:unit
    paths:
      - apps/android-frontend
      - apps/smoke-tests
      - packages
    platforms:
      - linux

  - name: test:ios
    paths:
      - apps/ios-frontend
      - apps/smoke-tests
      - packages
    platforms:
      - darwin

  - name: test:ios:unit
    paths:
      - apps/ios-frontend
      - apps/smoke-tests
      - packages
    platforms:
      - darwin

  # The Ziggy example: a small app built on Ziggy, run on the host and on each phone platform. A change anywhere in
  # Ziggy or the example runs these, so Ziggy can never change without the example's suite seeing it.
  - name: test:ziggy-example
    paths:
      - apps/ziggy-example
      - packages-zig/ziggy-core
      - packages-zig/ziggy-example-core
      - packages-zig/ziggy-shell-linux
      - packages-zig/ziggy-shell-windows
      - packages-swift
      - packages-android
      - packages/ziggy-bridge

  - name: test:ziggy-example:and
    paths:
      - apps/ziggy-example
      - packages-zig/ziggy-core
      - packages-zig/ziggy-example-core
      - packages-android
      - packages/ziggy-bridge
    platforms:
      - linux

  - name: test:ziggy-example:ios
    paths:
      - apps/ziggy-example
      - packages-zig/ziggy-core
      - packages-zig/ziggy-example-core
      - packages-swift
      - packages/ziggy-bridge
    platforms:
      - darwin

  # The Zig side of the Ziggy example, kept apart from the TypeScript so that a change to one does not wait on the other:
  # building Ziggy's core and the example's core, and cross-building them for every other platform, and the Zig unit tests.
  - name: compile:zig
    paths:
      - apps/ziggy-example
      - packages-zig/ziggy-core
      - packages-zig/ziggy-example-core
      - packages-zig/ziggy-shell-linux
      - packages-zig/ziggy-shell-windows

  - name: test:zig
    paths:
      - apps/ziggy-example
      - packages-zig/ziggy-core
      - packages-zig/ziggy-example-core
      - packages-zig/ziggy-shell-linux
      - packages-zig/ziggy-shell-windows
