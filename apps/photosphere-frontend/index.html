<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' ziggy-app://app https://ziggy-app.invalid; script-src 'self' ziggy-app://app https://ziggy-app.invalid 'unsafe-inline'; style-src 'self' ziggy-app://app https://ziggy-app.invalid 'unsafe-inline'; img-src 'self' ziggy-app://app https://ziggy-app.invalid data: blob: http://localhost:* http://127.0.0.1:* https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; media-src 'self' ziggy-app://app https://ziggy-app.invalid http://localhost:* http://127.0.0.1:*; font-src 'self' ziggy-app://app https://ziggy-app.invalid; connect-src 'self' ziggy-app://app https://ziggy-app.invalid ws://localhost:* http://localhost:* http://127.0.0.1:* https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://nominatim.openstreetmap.org;">
<script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var theme = params.get('theme') || 'system';
        var colorScheme = theme;
        if (theme === 'system') {
          colorScheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-joy-color-scheme', colorScheme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
