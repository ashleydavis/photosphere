// Photosphere's Android project: the app, and Ziggy's Android native app, which is a Gradle build of its own that this one
// includes. Gradle builds the native app from the Ziggy checkout and puts it in place of the dependency
// dev.ziggy:ziggy-native-android that app/build.gradle declares.
rootProject.name = 'photosphere-android'

include ':app'
includeBuild('../../../../../ziggy/packages/ziggy/native/android') {
    name = 'ziggy-native-android'
}
