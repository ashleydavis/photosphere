// Photosphere's Android project: the app, which takes Ziggy's Android native app from the checkout of Ziggy's repository beside this
// one. Gradle builds the native app from that checkout in place of the dependency `dev.ziggy:ziggy-native-android` that
// app/build.gradle names.
rootProject.name = 'photosphere-android'

include ':app'
includeBuild('../../../../../ziggy/packages/ziggy/native/android') {
    name = 'ziggy-native-android'
}
