// Photosphere's Android project: the app, which takes Ziggy's Android native app from the local checkout of Ziggy beside this
// repository. Gradle builds it from the checkout in place of the dependency `dev.ziggy:ziggy-native-android` that app/build.gradle
// names, whatever version that is.
rootProject.name = 'photosphere-android'

include ':app'
includeBuild('../../../../../ziggy/packages/ziggy/native/android') {
    name = 'ziggy-native-android'
}
