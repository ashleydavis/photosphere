// The root build file. The SDK levels and library versions come from variables.gradle beside it, and the NDK version is set
// here, so every module of this project builds against the same levels and the same NDK.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // The Android Gradle Plugin. It needs Gradle 8.7 (see the wrapper) and JDK 17.
        classpath 'com.android.tools.build:gradle:8.6.0'
    }
}

apply from: "variables.gradle"

// The NDK the Zig library is linked against and Gradle strips it with. apps/photosphere/scripts/android-common.sh reads this
// line to find the same NDK, so it stays a single quoted string.
ext.ndkVersion = "25.1.8937393"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
