# The tests on macOS arm64, on every push and on demand, made to report as fast as possible. test-macos.yml says what runs.
name: Test macOS arm64

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

# A newer push to the same branch supersedes a run still going, so only the latest commit's results are waited for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test-macos.yml
    with:
      runner: macos-latest
      platform: macos-arm64
      target: aarch64-macos.11.0
      # The runner has 3 cores. Three at once took 7.4 minutes and four 8.8 in an early run, but that run's first scenario spent minutes
      # stalled, so those figures measured the stall as much as the parallelism. Four again now that the stall is gone.
      app-parallel: "4"
