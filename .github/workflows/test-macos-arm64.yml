# The tests on macOS arm64, on every push and on demand. They run every test Release macOS arm64 runs, minus packaging and
# publishing, over the same libraries and the same builds: each third-party library (the AWS SDK for C, zlib-ng, ImageMagick and
# FFmpeg) has its own job that builds and stores it, side by side, and then app-build builds the app and cli-build builds the CLI
# over those. The later jobs restore what those built: app-smoke-tests runs the app build, cli-smoke-tests runs the CLI,
# zig-unit-tests runs the Zig unit tests and the TypeScript jobs compile and test the TypeScript.
name: Test macOS arm64

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.6"
  # Each platform has a workflow of its own, so a failure on one shows at a glance and holds up no other platform's release.
  # Its release tags are <RELEASE_PLATFORM>-v1.2.3, and its GitHub release is zig-<that tag>.
  RELEASE_PLATFORM: "macos-arm64"
  RELEASE_PLATFORM_NAME: "macOS arm64"

on:
  # Every push is tested. A release is made by its own workflow, when its tag is pushed or when it is started by hand.
  push:
    branches:
      - "**"

  workflow_dispatch:

jobs:
  # Resolves the release tag once, before anything is built, because it can create and push a tag. Its outputs, the tag and
  # whether this run is a release, are read by app-build, cli-build, package and create-release, so the two builds run side by side.
  prepare-tag:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      is-release: ${{ steps.resolve.outputs.is-release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          RELEASE_INPUT="${{ inputs.release }}"
          PREFIX="${RELEASE_PLATFORM}-v"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "update-latest" ]; then
            TAG=$(git tag --list "${PREFIX}*.*.*" --sort=-version:refname | head -1)
            if [ -z "$TAG" ]; then
              echo "No existing ${PREFIX}*.*.* tag to update"
              exit 1
            fi
            git tag -f "$TAG"
            git push --force origin "$TAG"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "new-patch" ]; then
            LATEST=$(git tag --list "${PREFIX}*.*.*" --sort=-version:refname | head -1)
            if [ -z "$LATEST" ]; then
              LATEST="${PREFIX}0.0.0"
            fi
            MAJOR=$(echo "${LATEST#"$PREFIX"}" | cut -d. -f1)
            MINOR=$(echo "${LATEST#"$PREFIX"}" | cut -d. -f2)
            PATCH=$(echo "${LATEST#"$PREFIX"}" | cut -d. -f3)
            TAG="${PREFIX}${MAJOR}.${MINOR}.$((PATCH + 1))"
            git tag "$TAG"
            git push origin "$TAG"
            IS_RELEASE="true"
          else
            TAG=""
            IS_RELEASE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is-release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Resolved tag: '$TAG' (is-release: $IS_RELEASE)"

  # The third-party libraries, each built once by its own action and stored as an artifact, so a library an earlier run has already built is
  # restored rather than compiled again. Each is built for the macOS 11.0 the app targets, which the CLI's native build links too.
  # Every job that runs the Zig build restores them from those artifacts with the third-party-libraries action.
  build-aws-sdk:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the AWS SDK for C
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: macos-arm64
          build-args: -Dtarget=aarch64-macos.11.0

  build-zlib-ng:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build zlib-ng
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: macos-arm64
          build-args: -Dtarget=aarch64-macos.11.0

  build-imagemagick:
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ImageMagick
        uses: ./.github/actions/build-imagemagick
        with:
          platform: macos-arm64
          build-args: -Dtarget=aarch64-macos.11.0

  build-ffmpeg:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FFmpeg
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: macos-arm64
          build-args: -Dtarget=aarch64-macos.11.0


  # Restores the third-party libraries the library jobs built and builds the Photosphere App for macOS arm64 by the same build
  # script a developer runs. The version comes from the release tag: macos-arm64-v1.2.3 is 1.2.3 and a nightly is
  # dev-nightly.<timestamp>. The library jobs build them for the macOS 11.0 the app targets, which the CLI's native build links too,
  # and this job restores them from their artifacts. The app, the Zig build cache
  # and the libraries are saved under photosphere-app-macos-arm64-<commit>-<run>, which app-smoke-tests and package restore.
  app-build:
    timeout-minutes: 120
    needs: [prepare-tag, build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: macos-arm64
          build-args: -Dtarget=aarch64-macos.11.0

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#"${RELEASE_PLATFORM}-v"}"
            VERSION="$(bash ./scripts/set-build-config.sh --tag "$VERSION" --commit "${{ github.sha }}")"
          else
            VERSION="$(bash ./scripts/set-build-config.sh --commit "${{ github.sha }}")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # The app build's Zig build cache, restored from the latest run that saved one for this platform, so the build
      # compiles only what changed instead of the whole app. Saved again after the build, as the CLI build does.
      - name: Restore the app build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-app-build-macos-arm64-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-app-build-macos-arm64-

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # The app is built into out/app, laid out as apps/photosphere-smoke-tests/run.md describes, which is where the smoke tests take
      # it from. Only the app is saved, not the rest of Xcode's derived data.
      - name: Build
        shell: bash
        # The release build, with the page minified, so the smoke tests run what ships and the package job packages this build
        # rather than compiling the app again.
        run: bun run --filter=ziggy build:macos -- --configuration Release --minify --native-dir "$PWD/out/app/native" --build-dir "$PWD/out/app/xcode"

      - name: Save the app build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-app-build-macos-arm64-${{ github.sha }}

      - name: Save the Photosphere App build
        uses: actions/cache/save@v4
        with:
          path: |
            out/app/xcode/Build/Products/Release/Photosphere.app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-macos-arm64-${{ github.sha }}-${{ github.run_id }}

  cli-build:
    # Restores the third-party libraries the library jobs built and builds the Zig CLI for macOS arm64 on a runner of that platform. Nothing here
    # cross-compiles, so a build that works is a build that runs on the platform it names. It needs app-build only for the
    # release tag the CLI's version is stamped from.
    #
    # The binary, the Zig build cache and the libraries are saved under photosphere-cli-macos-arm64-<commit>-<run>, which
    # cli-smoke-tests and create-release restore, so the binary is built once and used by both.
    timeout-minutes: 60
    needs: [prepare-tag, build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # `zig build` keeps one HTTP client for its whole run. It fetches the eager packages, compiles and runs
      # the build script, then fetches the lazy packages the script asked for, reusing the keep-alive
      # connections it pooled during the first fetch. By then the server has closed them, and Zig 0.16's
      # client takes a pooled connection without checking it is still open and does not retry, so the lazy
      # s2n-tls download failed with "build.zig.zon:64:20: error: invalid HTTP response:
      # HttpConnectionClosing" in the jobs whose package cache missed. --fetch=all fetches every package,
      # lazy ones included, in one pass and exits before the build script runs, so no download waits behind it.
      - name: Fetch every package Zig needs, lazy ones included, in one pass
        working-directory: .
        run: zig build --fetch=all

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: macos-arm64
          build-args: -Dtarget=aarch64-macos.11.0

      # Stamps the release's version and commit into the CLI's config before it is compiled, the same way app-build does for
      # the app. Without it the released CLI says it is version "dev".
      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#"${RELEASE_PLATFORM}-v"}"
            bash ./scripts/set-build-config.sh --tag "$VERSION" --commit "${{ github.sha }}"
          else
            bash ./scripts/set-build-config.sh --commit "${{ github.sha }}"
          fi

      - name: Build the Zig CLI natively for macOS arm64
        working-directory: .
        run: zig build -Dcpu=baseline --prefix apps/cli-zig/bin/arm64/mac --prefix-exe-dir .

      - name: Check the binary was produced
        working-directory: ./apps/cli-zig
        run: |
          ls -la bin/arm64/mac/psi
          file bin/arm64/mac/psi

      # The binary is renamed to say which CLI it is, because the TypeScript CLI is also called psi and
      # unpacking both releases into one directory would otherwise overwrite one with the other.
      - name: Collect the Zig CLI binary
        shell: bash
        run: |
          mkdir -p out
          chmod +x apps/cli-zig/bin/arm64/mac/psi
          cp apps/cli-zig/bin/arm64/mac/psi out/photosphere-cli-zig-macos-arm64
          ls -la out

      - name: Save the Zig CLI build
        uses: actions/cache/save@v4
        with:
          path: |
            out
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-cli-macos-arm64-${{ github.sha }}-${{ github.run_id }}

      - name: Save the Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}

  cli-smoke-tests:
    # The Zig CLI smoke suites, because the byte-identical output (gzip OS byte, paths, file times) differs between
    # platforms. The unit tests are in the Zig CI workflow, so a failure in one is not reported as a failure of the other.
    # The binary is not built here: cli-build builds it and this job restores it from the cache, so the Zig CLI is
    # compiled once and both this job and the release use it.
    # Setup takes about 5 minutes and the smoke suites about 15.
    timeout-minutes: 75
    needs: [cli-build]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig
      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install
      - name: Install media processing tools (macOS)
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe
      - name: Show the disk space the Zig builds use (each package that builds the AWS SDK for C has its own zig-pkg and .zig-cache)
        if: always()
        shell: bash
        run: |
          df -h .
          du -sh packages/*/zig-pkg packages/*/.zig-cache apps/*/zig-pkg apps/*/.zig-cache 2>/dev/null || true
      # The smoke suites run the built binary rather than `bun run start`, at the path their common.sh reads. The suites also
      # run the Zig build of the CLI, which links the libraries cli-build saved with the binary, over the Zig build cache saved
      # with them.
      - name: Restore the Zig CLI build
        uses: actions/cache/restore@v4
        with:
          path: |
            out
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-cli-macos-arm64-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Put the Zig CLI where the smoke suites look for it
        shell: bash
        run: |
          mkdir -p zig-out/bin
          cp out/photosphere-cli-zig-macos-arm64 zig-out/bin/psi
          # The smoke suites fail with exit 126 (found but not executable) without the executable bit.
          chmod +x zig-out/bin/psi
          ls -la zig-out/bin
      - name: Run the Zig CLI smoke tests
        timeout-minutes: 30
        working-directory: ./apps/cli-zig
        shell: bash
        # The suites run the psi cli-build built, put in place above, rather than building another.
        run: PHOTOSPHERE_SMOKE_PSI="$PWD/../../zig-out/bin/psi" ./smoke-tests-zig.sh
      - name: Test the Zig version command
        working-directory: ./apps/cli-zig
        shell: bash
        run: |
          echo "Testing version command after building..."
          ../../zig-out/bin/psi version

      # Scenario 86 (multi-device) of this suite sat out its 10-minute limit on macOS x64 after its last step had passed, and the job
      # kept nothing but the printed output, which did not say what it was waiting for. A failed test keeps its directory, which holds
      # its full log and the CLI's own logs.
      - name: Collect the logs of failed CLI smoke tests
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-smoke-logs"
          if [ -d "${TMPDIR:-/tmp}/photosphere-tests" ]; then
              cp -R "${TMPDIR:-/tmp}/photosphere-tests" "$RUNNER_TEMP/cli-smoke-logs/"
          fi

      - name: Upload the logs of failed CLI smoke tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-logs-macos-arm64
          path: ${{ runner.temp }}/cli-smoke-logs
          retention-days: 5

  app-smoke-tests:
    # The Photosphere App's smoke tests on macOS, in a real window on the runner's own display, on the app app-build built,
    # which PHOTOSPHERE_SMOKE_BUILD names. The CLI that makes the scenarios' fixtures is the one cli-build built.
    timeout-minutes: 75
    needs: [app-build, cli-build]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The scenarios build their database fixtures with the CLI from source, which needs ImageMagick and ffmpeg.
      - name: Install media processing tools (macOS)
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Restore the Photosphere App build
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app/xcode/Build/Products/Release/Photosphere.app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-macos-arm64-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      # The psi the scenarios run as the other side of a LAN share is the one cli-build built, so the smoke runner does not
      # build it again. The paths are the ones cli-build saves, since the cache only matches a restore that lists the same.
      - name: Restore the Zig CLI build
        uses: actions/cache/restore@v4
        with:
          path: |
            out
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-cli-macos-arm64-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Run the Photosphere App smoke tests
        timeout-minutes: 60
        shell: bash
        run: |
          # cli-smoke-tests runs this same restored psi only after giving it the executable bit (exit 126 without it), so this does too.
          chmod +x out/photosphere-cli-zig-macos-arm64
          PHOTOSPHERE_SMOKE_BUILD="$PWD/out/app" PHOTOSPHERE_SMOKE_PSI="$PWD/out/photosphere-cli-zig-macos-arm64" bun run test:ziggy

      # The import scenarios timed out on arm64 with the app's log ending at the moment the import started, and the job kept nothing
      # else, so there was no way to tell a crash from a hang. A failed scenario keeps its directory, which holds the app's log and the
      # core's own log, and macOS writes a crash report for a process that crashed.
      - name: Collect the logs of failed scenarios and any crash reports
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-smoke-logs/crash-reports"
          if [ -d "${TMPDIR%/}/photosphere-tests" ]; then
              cp -R "${TMPDIR%/}/photosphere-tests" "$RUNNER_TEMP/app-smoke-logs/"
          fi
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
              cp -R "$HOME/Library/Logs/DiagnosticReports/." "$RUNNER_TEMP/app-smoke-logs/crash-reports/"
          fi
          ls -R "$RUNNER_TEMP/app-smoke-logs/crash-reports"

      - name: Upload the logs of failed scenarios and any crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs-macos-arm64
          path: ${{ runner.temp }}/app-smoke-logs
          retention-days: 5

  # Compiles the TypeScript, which is the only check of its types: the unit tests run it without checking them.
  typescript-compile:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # bun run compile records a what-changed baseline when it succeeds.
      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Compile TypeScript
        timeout-minutes: 12
        run: bun run compile

  # The TypeScript unit tests.
  typescript-unit-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run unit tests
        timeout-minutes: 12
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

  # The unit tests of the Zig CLI and of every Zig package, on this workflow's runner, over the libraries the library jobs built for it
  # and the Zig build cache cli-build saved.
  zig-unit-tests:
    timeout-minutes: 50
    needs: [build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg, cli-build]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools (macOS)
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      # The libraries for the runner, which the tests build for, restored from their artifacts.
      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: macos-arm64
          # The same build-args as the library jobs, so the key matches theirs: with none the key differed, nothing was
          # restored and the libraries were built from source here, 13 to 15 minutes a run. The library directory is named by
          # architecture and OS only, so the tests find these 11.0-target libraries where they look for the native ones.
          build-args: -Dtarget=aarch64-macos.11.0

      # Zig skips any compile step whose inputs are unchanged and already in .zig-cache. Without this the test binaries and psi are
      # compiled from nothing every run, which is most of this job's time. The key changes with any Zig source, and the newest
      # earlier cache is restored when there is no exact match, so only the binaries a change touches are compiled again.
      # The next step lays cli-build's cache over it.
      - name: Cache Zig's build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      # The Zig build cache cli-build saved, laid over the test build's own, so Zig reuses any compile step the two builds have in
      # common.
      - name: Restore the CLI build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # The getImageDetails format test reads images from test/formats, which are made on the machine rather than committed.
      - name: Make the format test images
        shell: bash
        run: bash scripts/make-format-test-images.sh

      # Built for any CPU of the architecture, so the compile steps match the restored build caches whatever CPU the runner has.
      - name: Run the Zig unit tests
        timeout-minutes: 40
        shell: bash
        run: zig build test -Dcpu=baseline --summary all --test-timeout 20m
