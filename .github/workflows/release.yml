  # Android native (JVM) unit tests, split into their own job so they run independently of the slow
  # emulator smoke job. No emulator needed.
  android-unit-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # AGP 8 requires JDK 17 (the Android build fails on the JDK 21 the runner defaults to).
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ImageMagick/ffmpeg are needed by the CLI that builds the per-test database fixtures.
      - name: Install media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg
          verify: magick|convert ffmpeg ffprobe

      # The native ImageMagick build (run_magick shim via CMake) and scripts/fetch-mobile-media-tools.sh
      # both require this exact NDK, which the android-frontend sync (run by test:and:unit) pulls in.
      - name: Install Android NDK
        uses: ./.github/actions/retry-install
        with:
          run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" > /dev/null

      # Engine-pool dispatcher, subtask routing, picker/path helpers, host functions.
      # Gradle re-downloads its distribution and every dependency on a clean runner, and it runs
      # inside the test step rather than as a step of its own, so its cost is hidden inside that
      # step's total. Keyed on the Gradle build files and the wrapper properties, which is what
      # decides the distribution and the dependency set; restore-keys lets a near-miss still reuse
      # most of it, which is the normal way to cache Gradle.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android-frontend/android/**/*.gradle*', 'apps/android-frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Run Android native unit tests
        timeout-minutes: 20
        run: bun run test:and:unit

  # iOS native (XCTest) unit tests, split into their own job so they run independently of the slow
  # simulator smoke job.
  ios-unit-tests:
    timeout-minutes: 30
    runs-on: macos-14
    steps:
      - name: Checkout code
