name: Release

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

on:
  push:
    branches:
      - "*"
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release:
        description: "Release action. none = nightly build. update-latest = move the latest v*.*.* tag to this commit and re-release it. new-patch = create the next patch tag (e.g. v0.0.8 -> v0.0.9) and release it."
        type: choice
        options:
          - none
          - update-latest
          - new-patch
        default: none

jobs:
  prepare-tag:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      is-release: ${{ steps.resolve.outputs.is-release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          RELEASE_INPUT="${{ inputs.release }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "update-latest" ]; then
            TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
            if [ -z "$TAG" ]; then
              echo "No existing v*.*.* tag to update"
              exit 1
            fi
            git tag -f "$TAG"
            git push --force origin "$TAG"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "new-patch" ]; then
            LATEST=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
            if [ -z "$LATEST" ]; then
              LATEST="v0.0.0"
            fi
            MAJOR=$(echo "${LATEST#v}" | cut -d. -f1)
            MINOR=$(echo "${LATEST#v}" | cut -d. -f2)
            PATCH=$(echo "${LATEST#v}" | cut -d. -f3)
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            git tag "$TAG"
            git push origin "$TAG"
            IS_RELEASE="true"
          else
            TAG=""
            IS_RELEASE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is-release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Resolved tag: '$TAG' (is-release: $IS_RELEASE)"

  unit-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run unit tests
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

  perf-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run performance benchmarks
        run: bun run perf

  compile:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Compile TypeScript
        run: bun run compile

  write-lock-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: |
            echo "Installing ImageMagick, ffmpeg, and tree via apt..."
            sudo apt update
            sudo apt install -y imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Run write lock smoke tests
        working-directory: ./apps/cli
        run: |
          mkdir -p write-lock-test-logs
          ./write-lock-smoke-test.sh 2>&1 | tee write-lock-test-logs/write-lock-tests-output.log
          WRITE_LOCK_EXIT_CODE=${PIPESTATUS[0]}
          echo "Write lock tests exit code: $WRITE_LOCK_EXIT_CODE"
          echo "Write lock tests exit code: $WRITE_LOCK_EXIT_CODE" >> write-lock-test-logs/write-lock-tests-output.log
          exit $WRITE_LOCK_EXIT_CODE

  # The mobile harness's own tests: the run lock, the work queue and worker pool, and the timeout
  # helper. None of them need a device, so they run here in seconds rather than inside the mobile
  # smoke jobs. runner.test.sh and timeout.test.sh were not run anywhere before, which is how a
  # runner fault that only shows up on macOS reached a release run and hung it for 90 minutes.
  mobile-harness-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Android lock tests
        working-directory: ./apps/smoke-tests
        run: bash ./android-lock.test.sh

      - name: Run test runner tests
        working-directory: ./apps/smoke-tests
        run: bash ./runner.test.sh

      - name: Run timeout helper tests
        working-directory: ./apps/smoke-tests
        run: bash ./timeout.test.sh

  hash-cache-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run hash cache concurrency smoke tests
        working-directory: ./apps/cli
        run: |
          mkdir -p hash-cache-test-logs
          ./hash-cache-smoke-test.sh 2>&1 | tee hash-cache-test-logs/hash-cache-tests-output.log
          HASH_CACHE_EXIT_CODE=${PIPESTATUS[0]}
          echo "Hash cache tests exit code: $HASH_CACHE_EXIT_CODE"
          echo "Hash cache tests exit code: $HASH_CACHE_EXIT_CODE" >> hash-cache-test-logs/hash-cache-tests-output.log
          exit $HASH_CACHE_EXIT_CODE

  sync-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: |
            echo "Installing ImageMagick, ffmpeg, and tree via apt..."
            sudo apt update
            sudo apt install -y imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Run sync smoke tests
        working-directory: ./apps/cli
        run: |
          ./sync-smoke-test.sh

  smoke-test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: |
            echo "Installing ImageMagick, ffmpeg, and tree via apt..."
            sudo apt update
            sudo apt install -y imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Install keychain tools (Linux)
        uses: ./.github/actions/retry-install
        with:
          run: sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
          verify: secret-tool dbus-run-session

      - name: Start keyring daemon (Linux)
        run: |
          eval $(dbus-launch --sh-syntax)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          eval $(gnome-keyring-daemon --unlock --components=secrets <<< "ci-test-password")
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> $GITHUB_ENV

      - name: Run smoke tests
        working-directory: ./apps/cli
        run: |
          mkdir -p smoke-test-logs
          ./smoke-tests.sh 2>&1 | tee smoke-test-logs/smoke-tests-output.log
          SMOKE_TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "Smoke tests exit code: $SMOKE_TEST_EXIT_CODE"
          echo "Smoke tests exit code: $SMOKE_TEST_EXIT_CODE" >> smoke-test-logs/smoke-tests-output.log
          exit $SMOKE_TEST_EXIT_CODE

  smoke-test-encrypted:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: |
            echo "Installing ImageMagick, ffmpeg, and tree via apt..."
            sudo apt update
            sudo apt install -y imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Run encrypted smoke tests
        working-directory: ./apps/cli
        run: |
          mkdir -p smoke-test-logs
          ./smoke-tests-encrypted.sh all 2>&1 | tee smoke-test-logs/smoke-tests-encrypted-output.log
          ENCRYPTED_EXIT_CODE=${PIPESTATUS[0]}
          echo "Encrypted smoke tests exit code: $ENCRYPTED_EXIT_CODE"
          echo "Encrypted smoke tests exit code: $ENCRYPTED_EXIT_CODE" >> smoke-test-logs/smoke-tests-encrypted-output.log
          exit $ENCRYPTED_EXIT_CODE

  lan-share-smoke-test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run LAN share smoke tests
        working-directory: ./apps/cli
        run: |
          mkdir -p smoke-test-logs
          ./smoke-tests-lan-share.sh 2>&1 | tee smoke-test-logs/lan-share-tests-output.log
          LAN_SHARE_EXIT_CODE=${PIPESTATUS[0]}
          echo "LAN share smoke tests exit code: $LAN_SHARE_EXIT_CODE"
          echo "LAN share smoke tests exit code: $LAN_SHARE_EXIT_CODE" >> smoke-test-logs/lan-share-tests-output.log
          exit $LAN_SHARE_EXIT_CODE

  build-linux:
    timeout-minutes: 20
    needs: prepare-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set config
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#v}"
            IS_NIGHTLY="false"
          else
            TIMESTAMP=$(date -u +"%Y%m%dT%H%M%S")
            VERSION="dev-nightly.$TIMESTAMP"
            IS_NIGHTLY="true"
          fi
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_HASH="${{ github.sha }}"
          {
            echo '// Version is set by the CI build process. "dev" is used for local development.'
            echo 'export const version = "'"$VERSION"'";'
            echo ""
            echo "// Build metadata is set by the CI build process."
            echo "export const buildMetadata = {"
            echo '    commitHash: "'"$COMMIT_HASH"'",'
            echo '    buildDate: "'"$BUILD_DATE"'",'
            echo "    isNightly: $IS_NIGHTLY,"
            echo "};"
          } > packages/config/src/index.ts
          echo "Config set to:"
          cat packages/config/src/index.ts

      - name: Verify runner architecture
        run: |
          echo "Architecture: $(uname -m)"
          echo "Processor: $(uname -p)"
          lscpu | grep Architecture

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: |
            echo "Installing ImageMagick, ffmpeg, and tree via apt..."
            sudo apt update
            sudo apt install -y imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe
          
      - name: Verify media tool versions
        run: |
          echo "=== Media Tool Versions ==="
          echo ""
          echo "ImageMagick (convert):"
          convert --version | head -1
          echo ""
          echo "ImageMagick (identify):"
          identify --version | head -1
          echo ""
          echo "ffmpeg:"
          ffmpeg -version | head -1
          echo ""
          echo "ffprobe:"
          ffprobe -version | head -1
          echo ""
          
      - name: Build Linux executable
        working-directory: ./apps/cli
        run: |
          bun run build-linux
          chmod +x bin/x64/linux/psi
          
      - name: Build mk CLI executable
        working-directory: ./apps/mk-cli
        run: |
          bun run build-linux
          chmod +x bin/x64/linux/mk
          
      - name: Build bdb CLI executable
        working-directory: ./apps/bdb-cli
        run: |
          bun run build-linux
          chmod +x bin/x64/linux/bdb
          
      - name: Test version command
        working-directory: ./apps/cli
        run: |
          echo "Testing version command after building..."
          ./bin/x64/linux/psi version

      - name: Run smoke tests
        working-directory: ./apps/cli
        run: |
          mkdir -p smoke-test-logs
          ./smoke-tests.sh --binary 2>&1 | tee smoke-test-logs/smoke-tests-output.log
          SMOKE_TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "Smoke tests exit code: $SMOKE_TEST_EXIT_CODE"
          echo "Smoke tests exit code: $SMOKE_TEST_EXIT_CODE" >> smoke-test-logs/smoke-tests-output.log
          exit $SMOKE_TEST_EXIT_CODE

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-cli-linux-x64
          path: ./apps/cli/bin/x64/linux/psi

  build-windows:
    timeout-minutes: 20
    needs: prepare-tag
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#v}"
            IS_NIGHTLY="false"
          else
            TIMESTAMP=$(date -u +"%Y%m%dT%H%M%S")
            VERSION="dev-nightly.$TIMESTAMP"
            IS_NIGHTLY="true"
          fi
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_HASH="${{ github.sha }}"
          {
            echo '// Version is set by the CI build process. "dev" is used for local development.'
            echo 'export const version = "'"$VERSION"'";'
            echo ""
            echo "// Build metadata is set by the CI build process."
            echo "export const buildMetadata = {"
            echo '    commitHash: "'"$COMMIT_HASH"'",'
            echo '    buildDate: "'"$BUILD_DATE"'",'
            echo "    isNightly: $IS_NIGHTLY,"
            echo "};"
          } > packages/config/src/index.ts
          echo "Config set to:"
          cat packages/config/src/index.ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: |
            echo "Installing ImageMagick, ffmpeg, and tree via Chocolatey..."
            choco install imagemagick ffmpeg tree -y
          verify: magick|convert ffmpeg ffprobe

      - name: Verify media tool versions
        run: |
          echo "=== Media Tool Versions ==="
          echo ""
          echo "ImageMagick (magick):"
          magick --version | Select-Object -First 1
          echo ""
          echo "ImageMagick (convert):"
          magick convert --version | Select-Object -First 1
          echo ""
          echo "ffmpeg:"
          ffmpeg -version 2>&1 | Select-Object -First 1
          echo ""
          echo "ffprobe:"
          ffprobe -version 2>&1 | Select-Object -First 1
          echo ""

      - name: Build Windows executable
        working-directory: ./apps/cli
        run: |
          bun run build-win
          
      - name: Build mk CLI executable
        working-directory: ./apps/mk-cli
        run: |
          bun run build-win
          
      - name: Build bdb CLI executable
        working-directory: ./apps/bdb-cli
        run: |
          bun run build-win
          
      - name: Test version command
        working-directory: ./apps/cli
        run: |
          echo "Testing version command after building..."
          ./bin/x64/win/psi.exe version

      - name: Run smoke tests
        working-directory: ./apps/cli
        shell: bash
        run: |
          mkdir -p smoke-test-logs
          ./smoke-tests.sh --binary 2>&1 | tee smoke-test-logs/smoke-tests-output.log
          SMOKE_TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "Smoke tests exit code: $SMOKE_TEST_EXIT_CODE"
          echo "Smoke tests exit code: $SMOKE_TEST_EXIT_CODE" >> smoke-test-logs/smoke-tests-output.log
          exit $SMOKE_TEST_EXIT_CODE

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-cli-windows-x64
          path: ./apps/cli/bin/x64/win/psi.exe

  build-windows-baseline:
    timeout-minutes: 20
    needs: prepare-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#v}"
            IS_NIGHTLY="false"
          else
            TIMESTAMP=$(date -u +"%Y%m%dT%H%M%S")
            VERSION="dev-nightly.$TIMESTAMP"
            IS_NIGHTLY="true"
          fi
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_HASH="${{ github.sha }}"
          {
            echo '// Version is set by the CI build process. "dev" is used for local development.'
            echo 'export const version = "'"$VERSION"'";'
            echo ""
            echo "// Build metadata is set by the CI build process."
            echo "export const buildMetadata = {"
            echo '    commitHash: "'"$COMMIT_HASH"'",'
            echo '    buildDate: "'"$BUILD_DATE"'",'
            echo "    isNightly: $IS_NIGHTLY,"
            echo "};"
          } > packages/config/src/index.ts
          echo "Config set to:"
          cat packages/config/src/index.ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Build Windows executable
        working-directory: ./apps/cli
