  android-smoke-tests:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # AGP 8 requires JDK 17 (the Android build fails on the JDK 21 the runner defaults to).
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ImageMagick/ffmpeg are needed by the CLI that builds the per-test database fixtures.
      - name: Install media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg
          verify: magick|convert ffmpeg ffprobe

      # The native ImageMagick build (run_magick shim via CMake) and scripts/fetch-mobile-media-tools.sh
      # both require this exact NDK, which bun run test:and pulls in via bun run sync.
      - name: Install Android NDK
        uses: ./.github/actions/retry-install
        with:
          run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" > /dev/null

      # Allow the hardware-accelerated emulator to use KVM on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator-runner boots an AVD, then runs the suite against it (run.sh detects the booted
      # device and builds/installs the app via Gradle/adb).
      #
      # PHOTOSPHERE_NO_LAN_BRIDGE declares that this run has no host LAN bridge. The emulator-runner
      # boots a plain user-mode NAT emulator and attaches no tap device, so the 192.168.55.x segment
      # that host-to-device LAN sharing needs cannot exist here. The two tests that need it
      # (26-receive-database, 27-receive-secret) therefore skip with a logged SKIP line instead of
      # failing, and the run only requires the emulator to be started. Everything else, including the
      # device-to-device share tests and 28-host-emulator-comms (which works over NAT via 10.0.2.2),
      # still runs. Those two paths are covered locally with `bun run emu:and:up`.
      # Shares the key, and so the cache entry, with the other Android jobs. See the note on this
      # step in android-unit-tests for why Gradle is worth caching.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android-frontend/android/**/*.gradle*', 'apps/android-frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Run Android smoke tests
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PHOTOSPHERE_NO_LAN_BRIDGE: "1"
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          # ONE LINE, and it has to stay one line. This action splits `script:` on newlines and runs
          # each line as its own `sh -c`, so a multi-line script shares no variables between lines and
          # each line's exit status dies with it. The four lines that used to be inlined here could
          # therefore never fail the job however many smoke tests failed. Running the suite and
          # keeping the logcat now lives in the script below, where it is one shell and can be read.
          script: bash ./scripts/android-smoke-tests-ci.sh

      # The runner prints only the last 30 lines of a failing test's app log, which is enough to see
      # that something failed and not enough to see why. Everything the run wrote is kept here so a
      # failure that cannot be reproduced off the runner can still be read afterwards.
      - name: Keep the smoke test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-test-logs
          path: /tmp/photosphere-tests/
          retention-days: 7
          if-no-files-found: warn

  ios-smoke-tests:
    # Higher than the other mobile jobs because `bun run test:ios` resolves the FFmpegKit Swift
    # Package on a clean checkout and, whenever the ImageMagick cache below misses, builds
    # ImageMagick from source as well.
    #
    # 125 rather than the 90 it was, because 90 could not hold a cache miss on a slow runner and so
    # killed a run that was going to pass. Run 33439567066, the first run on a new branch, which is
    # the case that always misses the cache: the step started at 21:06:49, the ImageMagick build ran
    # from 21:08:06 to 22:01:54 (55 minutes, not the 37 this comment used to quote), the frontend
    # build took another 14, and xcodebuild was still going when the step's cap ended it at 22:22:08
    # with the tests never reached. A warm cache does the whole job in 15 to 27 minutes and is
    # untouched by this.
    timeout-minutes: 125
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # ImageMagick/ffmpeg are needed by the CLI that builds the per-test database fixtures.
      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg
          verify: magick|convert ffmpeg ffprobe

      # ImageMagick has no prebuilt iOS release to download, so scripts/fetch-mobile-media-tools.sh
      # compiles it from source into this git-ignored directory, once for the device slice and once
      # for the simulator. It is the longest thing in the job by a wide margin and its cost swings
      # wildly with the runner: in one run this took 37 minutes here while the same build took 2.5
      # minutes in ios-unit-tests. Everything the build produces is decided by build-imagemagick.sh,
      # which pins the versions and the source URLs, so hashing that one file is a complete key.
      #
      # A partial restore is safe: the fetch script only skips the build when both slices' libraries
      # are present, and rebuilds from scratch otherwise.
      - name: Cache iOS ImageMagick build
        uses: actions/cache@v4
        with:
          path: apps/ios-frontend/ios/App/vendor/im
          key: ${{ runner.os }}-ios-imagemagick-${{ hashFiles('apps/ios-frontend/ios/build-imagemagick.sh') }}

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      # run.sh boots an iOS simulator and builds/installs the app via xcrun/xcodebuild.
      #
      # 110 rather than something closer to how long this usually takes, because when the ImageMagick
      # cache misses this step builds ImageMagick from source, and that build alone has taken 55
      # minutes on a slow runner. A cap sized on a cache hit kills a cache miss that was going to
      # succeed: 40 did exactly that to the stories-ios job on run 31369570348, 40 minutes after it
      # started "Building iOS ImageMagick from source", and 75 did it again to this step on run
      # 33439567066, where the build took 55 minutes and the frontend build another 14. The job's own
      # budget is 125.
      - name: Run iOS smoke tests
        timeout-minutes: 110
        run: bun run test:ios

  build-desktop:
    timeout-minutes: 60
    needs: prepare-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            files: |
              apps/desktop/release/*.deb
              apps/desktop/release/*.zip
          - os: windows-latest
            files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
          - os: macos-15-intel
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: macos-latest
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#v}"
            IS_NIGHTLY="false"
            DESKTOP_PACKAGE_VERSION="$VERSION"
          else
            TIMESTAMP=$(date -u +"%Y%m%dT%H%M%S")
            VERSION="dev-nightly.$TIMESTAMP"
            IS_NIGHTLY="true"
            # electron-builder requires semver in package.json; keep dev-nightly.* in config only.
            DESKTOP_PACKAGE_VERSION="0.0.0-nightly.$TIMESTAMP"
          fi
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_HASH="${{ github.sha }}"
          {
            echo '// Version is set by the CI build process. "dev" is used for local development.'
            echo 'export const version = "'"$VERSION"'";'
            echo ""
            echo "// Build metadata is set by the CI build process."
            echo "export const buildMetadata = {"
            echo '    commitHash: "'"$COMMIT_HASH"'",'
            echo '    buildDate: "'"$BUILD_DATE"'",'
            echo "    isNightly: $IS_NIGHTLY,"
            echo "};"
          } > packages/config/src/index.ts
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DESKTOP_PACKAGE_VERSION=$DESKTOP_PACKAGE_VERSION" >> $GITHUB_ENV
          echo "Config set to:"
          cat packages/config/src/index.ts

      - name: Set desktop package.json version (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          jq ".version = \"${{ env.DESKTOP_PACKAGE_VERSION }}\"" apps/desktop/package.json > apps/desktop/package.tmp.json && mv apps/desktop/package.tmp.json apps/desktop/package.json
          echo "Desktop package.json version set to: ${{ env.DESKTOP_PACKAGE_VERSION }} (app config version: ${{ env.VERSION }})"

      - name: Set desktop package.json version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $json = Get-Content apps/desktop/package.json | ConvertFrom-Json
          $json.version = "${{ env.DESKTOP_PACKAGE_VERSION }}"
          $json | ConvertTo-Json -Depth 10 | Set-Content apps/desktop/package.json
          Write-Host "Desktop package.json version set to: ${{ env.DESKTOP_PACKAGE_VERSION }} (app config version: ${{ env.VERSION }})"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # electron-builder downloads the Electron binary for the target platform, plus its own helper
      # binaries, every time it runs, and the build step costs between 107 and 156 seconds in each of
      # the four matrix legs. Those downloads are the part of it worth keeping. The paths differ per
      # platform and this job is a matrix over all of them, so every location is listed here; a path
      # that does not exist on a given runner is ignored rather than being an error.
      #
      # bun.lock pins the Electron version, so hashing it invalidates the cache exactly when the
      # downloaded binaries would change.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      # Capped because this is where the windows-latest leg hung for the full 60 minute job timeout on
      # run 31365606896, and a job killed by its own timeout has its log discarded by GitHub rather
      # than written, so that hang left nothing to read. The build itself costs between 107 and 156
      # seconds across the four matrix legs (see the cache note below), so 20 minutes is far more than
      # it can legitimately need.
      #
      # The cap keeps the log but still loses the run, which it did again on run 33458818750, the
      # fourth sighting of WINDOWS-ELECTRON-BUILD-HANGS-ON-NPM-LIST. The script caps each attempt at
      # seven minutes and retries a stall once, and passes a genuine build failure straight through on
      # the first attempt. This cap stays as the outer limit.
      - name: Build Electron app
        if: runner.os != 'macOS'
        timeout-minutes: 20
        shell: bash
        run: bash ./scripts/build-electron-retry-on-stall.sh

      # macOS packages a DMG, and building one means mounting a volume, laying the app out on it and
      # ejecting it again. Run 31921700592 failed build-desktop (macos-15-intel) on that eject:
      # "dmgbuild.core.DMGError: Unable to detach device cleanly: hdiutil: couldn't eject "disk2" -
      # Resource busy". Nothing in this repository is on that stack, dmgbuild had already made its own
      # five detach attempts over about twenty seconds, and electron-builder does not expose the
      # --detach-retries flag that would raise that number, so there is nothing here to fix and no
      # knob to turn. Whatever held the volume open is not named by the error and was gone before the
      # step ended, so the build is attempted a second time instead. A build that is genuinely broken
      # fails both attempts and still reports; the cap is doubled because two attempts fit under it.
      - name: Build Electron app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 40
        shell: bash
        run: |
          if ! bun run build; then
              echo "Packaging failed on the first attempt. Trying once more."
              bun run build
          fi

      - name: Show release directory contents
        run: |
          echo "Release directory structure:"
          ls apps/desktop/release

      - name: Install smoke-test dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: xvfb imagemagick ffmpeg
          verify: xvfb-run magick|convert ffmpeg ffprobe

      - name: Install smoke-test dependencies (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg
          verify: magick|convert ffmpeg ffprobe

      # ffmpeg comes from a pinned GitHub release, not Chocolatey. See the action for why.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-ffmpeg-windows

      - name: Install smoke-test dependencies (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/retry-install
        with:
          run: choco install -y imagemagick
          verify: magick|convert

      # Both steps are capped well under the job's 60 minutes, and the cap is the only reason a hang
      # here is ever diagnosable. When a JOB hits its timeout GitHub hard-kills it and writes no log
      # blob at all, so the run leaves nothing to read: the API returns 404 for that job's logs. When
      # a STEP hits its timeout the step fails normally and its log is kept. The windows-latest leg
      # hung to the full 60 minutes in 4 of the last 20 runs (31268180860, 31297733992, 31303296280,
      # 31350774149) and every one of them threw away the evidence, which is why the cause is still
      # unknown. A healthy run of this job is 15 to 20 minutes end to end including the build, so 25
      # minutes on the smoke tests alone is generous.
      - name: Run Electron smoke tests against binary (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 25
        working-directory: ./apps/desktop
        run: xvfb-run -a ./smoke-tests.sh --binary --sequential

      - name: Run Electron smoke tests against binary (Not Linux)
        if: runner.os != 'Linux'
        timeout-minutes: 25
        working-directory: ./apps/desktop
        shell: bash
        run: ./smoke-tests.sh --binary --sequential

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-desktop-${{ matrix.os }}-build
          path: ${{ matrix.files }}
          if-no-files-found: warn
          retention-days: 2

  create-release:
    timeout-minutes: 20
    needs: [prepare-tag, compile, unit-tests, perf-tests, build-linux, build-windows, build-windows-baseline, build-macos-x64, build-macos-arm64, build-desktop, smoke-test-encrypted, write-lock-tests, mobile-harness-tests, hash-cache-tests, sync-tests, lan-share-smoke-test, cli-desktop-lan-share-smoke-tests, android-unit-tests, ios-unit-tests, android-smoke-tests, ios-smoke-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: photosphere-cli-linux-x64
          path: ./artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: photosphere-cli-windows-x64
          path: ./artifacts/windows

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: photosphere-cli-windows-x64-baseline
          path: ./artifacts/windows-baseline

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: photosphere-cli-macos-x64
          path: ./artifacts/macos-x64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: photosphere-cli-macos-arm64
          path: ./artifacts/macos-arm64

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: photosphere-desktop-*-build
          path: ./artifacts/desktop
          merge-multiple: true

      - name: Create compressed archives
        run: |
          cd ./artifacts/linux && chmod +x psi && tar -czf ../photosphere-cli-linux-x64.tar.gz psi && cd ../..
          cd ./artifacts/windows && zip ../photosphere-cli-windows-x64.zip psi.exe && cd ../..
          cd ./artifacts/windows-baseline && zip ../photosphere-cli-windows-x64-baseline.zip psi.exe && cd ../..
          cd ./artifacts/macos-x64 && chmod +x psi && tar -czf ../photosphere-cli-macos-x64.tar.gz psi && cd ../..
          cd ./artifacts/macos-arm64 && chmod +x psi && tar -czf ../photosphere-cli-macos-arm64.tar.gz psi && cd ../..

      - name: Generate release notes
        id: release-notes
        run: |
          # Get the latest non-nightly tag (excluding current tag if this is a tagged build)
          if [ "${{ needs.prepare-tag.outputs.is-release }}" == "true" ]; then
            # For tagged releases, get commits since the previous tag (excluding current and nightly tags)
            PREVIOUS_TAG=$(git tag --list --sort=-version:refname | grep -v "^${{ needs.prepare-tag.outputs.tag }}$" | grep -v "^nightly$" | head -1)
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Generating release notes for tagged release since previous tag: $PREVIOUS_TAG"
              COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
            else
              echo "No previous tag found, using all commits for tagged release"
              COMMIT_RANGE=""
            fi
          else
            # For nightly builds, get commits since the last non-nightly tag
            LAST_TAG=$(git tag --list --sort=-version:refname | grep -v "^nightly$" | head -1)
            if [ -n "$LAST_TAG" ]; then
              echo "Generating release notes for nightly build since last tag: $LAST_TAG"
              COMMIT_RANGE="${LAST_TAG}..HEAD"
            else
              echo "No previous tag found, using all commits for nightly build"
              COMMIT_RANGE=""
            fi
          fi
          
          # Get commits that start with "cli:" and process them
          if [ -n "$COMMIT_RANGE" ]; then
            RAW_COMMITS=$(git log --oneline --no-merges "$COMMIT_RANGE" --format="%s" --grep="^cli:")
          else
            RAW_COMMITS=$(git log --oneline --no-merges --format="%s" --grep="^cli:")
          fi
          
          # Process commits: filter for "cli:" prefix, remove prefix, trim whitespace, and format as bullet points
          RELEASE_NOTES=""
          if [ -n "$RAW_COMMITS" ]; then
            RELEASE_NOTES=$(echo "$RAW_COMMITS" | while IFS= read -r commit; do
              if [[ $commit == cli:* ]]; then
                # Remove "cli:" prefix and trim leading/trailing whitespace
                cleaned=$(echo "${commit#cli:}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                if [ -n "$cleaned" ]; then
                  echo "- $cleaned"
                fi
              fi
            done)
          fi
          
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="- No CLI-related commits found"
          fi
          
          # Save release notes to output and file
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Generated release notes:"
          echo "$RELEASE_NOTES"

      - name: Delete existing nightly release
        if: needs.prepare-tag.outputs.is-release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-tag.outputs.is-release == 'true' && needs.prepare-tag.outputs.tag || 'nightly' }}
          name: ${{ needs.prepare-tag.outputs.is-release == 'true' && format('Photosphere {0}', needs.prepare-tag.outputs.tag) || 'Photosphere Nightly' }}
          draft: false
          prerelease: ${{ needs.prepare-tag.outputs.is-release != 'true' }}
          files: |
            ./artifacts/photosphere-cli-linux-x64.tar.gz
            ./artifacts/photosphere-cli-windows-x64.zip
            ./artifacts/photosphere-cli-windows-x64-baseline.zip
            ./artifacts/photosphere-cli-macos-x64.tar.gz
            ./artifacts/photosphere-cli-macos-arm64.tar.gz
            ./artifacts/desktop/**/*
          body: |
            ${{ needs.prepare-tag.outputs.is-release == 'true' && format('Photosphere release {0}', needs.prepare-tag.outputs.tag) || format('Photosphere nightly build - {0}', github.sha) }}

            ${{ needs.prepare-tag.outputs.is-release != 'true' && '⚠️ **This is a nightly build and may be unstable**' || '' }}
            ${{ needs.prepare-tag.outputs.is-release != 'true' && format('Built from commit: {0}', github.sha) || '' }}

            ## What's Changed
            ${{ steps.release-notes.outputs.RELEASE_NOTES }}

            ## CLI Download
            - **Linux**: `photosphere-cli-linux-x64.tar.gz`
            - **Windows modern**: `photosphere-cli-windows-x64.zip` (for modern processors, try this one first)
            - **Windows baseline**: `photosphere-cli-windows-x64-baseline.zip` (for older processors, try this one next)
            - **macOS (Intel)**: `photosphere-cli-macos-x64.tar.gz`
            - **macOS (Apple Silicon)**: `photosphere-cli-macos-arm64.tar.gz`

            ## CLI Installation
            1. Download the appropriate file for your platform
            2. Extract the archive
            3. Make the binary executable (Linux/macOS): `chmod +x psi`
            4. Move to your PATH or run directly

            ## Desktop Download
            - **Linux**: `.deb` package or `.zip`
            - **Windows**: `.exe` installer or `.zip`
            - **macOS**: `.dmg` disk image or `.zip`

            ## Bundled tools and licences
            The mobile apps bundle in-process builds of ImageMagick (ImageMagick licence, an Apache-2.0-style licence) and ffmpeg (LGPL-2.1+), along with ImageMagick's libjpeg, libpng, and zlib delegates. The desktop and CLI builds use ImageMagick and ffmpeg installed on the host system. Full attribution and licences are in [THIRD-PARTY-NOTICES.md](https://github.com/ashleydavis/photosphere/blob/main/THIRD-PARTY-NOTICES.md).