name: Release

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.5"

on:
  push:
    branches:
      - "*"
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release:
        description: "Release action. none = nightly build. update-latest = move the latest v*.*.* tag to this commit and re-release it. new-patch = create the next patch tag (e.g. v0.0.8 -> v0.0.9) and release it."
        type: choice
        options:
          - none
          - update-latest
          - new-patch
        default: none

jobs:
  prepare-tag:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      is-release: ${{ steps.resolve.outputs.is-release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          RELEASE_INPUT="${{ inputs.release }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "update-latest" ]; then
            TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
            if [ -z "$TAG" ]; then
              echo "No existing v*.*.* tag to update"
              exit 1
            fi
            git tag -f "$TAG"
            git push --force origin "$TAG"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "new-patch" ]; then
            LATEST=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
            if [ -z "$LATEST" ]; then
              LATEST="v0.0.0"
            fi
            MAJOR=$(echo "${LATEST#v}" | cut -d. -f1)
            MINOR=$(echo "${LATEST#v}" | cut -d. -f2)
            PATCH=$(echo "${LATEST#v}" | cut -d. -f3)
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            git tag "$TAG"
            git push origin "$TAG"
            IS_RELEASE="true"
          else
            TAG=""
            IS_RELEASE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is-release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Resolved tag: '$TAG' (is-release: $IS_RELEASE)"

  unit-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run unit tests
        timeout-minutes: 12
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

  perf-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run performance benchmarks
        timeout-minutes: 12
        run: bun run perf

  compile:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Compile TypeScript
        timeout-minutes: 12
        run: bun run compile

  write-lock-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Run write lock smoke tests
        timeout-minutes: 12
        working-directory: ./apps/cli
        run: |
          mkdir -p write-lock-test-logs
          ./write-lock-smoke-test.sh 2>&1 | tee write-lock-test-logs/write-lock-tests-output.log
          WRITE_LOCK_EXIT_CODE=${PIPESTATUS[0]}
          echo "Write lock tests exit code: $WRITE_LOCK_EXIT_CODE"
          echo "Write lock tests exit code: $WRITE_LOCK_EXIT_CODE" >> write-lock-test-logs/write-lock-tests-output.log
          exit $WRITE_LOCK_EXIT_CODE

  # The mobile harness's own tests: the run lock, the work queue and worker pool, and the timeout
  # helper. None of them need a device, so they run here in seconds rather than inside the mobile
  # smoke jobs. runner.test.sh and timeout.test.sh were not run anywhere before, which is how a
  # runner fault that only shows up on macOS reached a release run and hung it for 90 minutes.
  mobile-harness-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Android lock tests
        timeout-minutes: 5
        working-directory: ./apps/smoke-tests
        run: bash ./android-lock.test.sh

      - name: Run test runner tests
        timeout-minutes: 5
        working-directory: ./apps/smoke-tests
        run: bash ./runner.test.sh

      - name: Run timeout helper tests
        timeout-minutes: 5
        working-directory: ./apps/smoke-tests
        run: bash ./timeout.test.sh

  hash-cache-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run hash cache concurrency smoke tests
        timeout-minutes: 12
        working-directory: ./apps/cli
        run: |
          mkdir -p hash-cache-test-logs
          ./hash-cache-smoke-test.sh 2>&1 | tee hash-cache-test-logs/hash-cache-tests-output.log
          HASH_CACHE_EXIT_CODE=${PIPESTATUS[0]}
          echo "Hash cache tests exit code: $HASH_CACHE_EXIT_CODE"
          echo "Hash cache tests exit code: $HASH_CACHE_EXIT_CODE" >> hash-cache-test-logs/hash-cache-tests-output.log
          exit $HASH_CACHE_EXIT_CODE

  sync-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Run sync smoke tests
        timeout-minutes: 12
        working-directory: ./apps/cli
        run: |
          ./sync-smoke-test.sh

  smoke-test-encrypted:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Run encrypted smoke tests
        timeout-minutes: 12
        working-directory: ./apps/cli
        run: |
          mkdir -p smoke-test-logs
          ./smoke-tests-encrypted.sh all 2>&1 | tee smoke-test-logs/smoke-tests-encrypted-output.log
          ENCRYPTED_EXIT_CODE=${PIPESTATUS[0]}
          echo "Encrypted smoke tests exit code: $ENCRYPTED_EXIT_CODE"
          echo "Encrypted smoke tests exit code: $ENCRYPTED_EXIT_CODE" >> smoke-test-logs/smoke-tests-encrypted-output.log
          exit $ENCRYPTED_EXIT_CODE

  lan-share-smoke-test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run LAN share smoke tests
        timeout-minutes: 12
        working-directory: ./apps/cli
        run: |
          mkdir -p smoke-test-logs
          ./smoke-tests-lan-share.sh 2>&1 | tee smoke-test-logs/lan-share-tests-output.log
          LAN_SHARE_EXIT_CODE=${PIPESTATUS[0]}
          echo "LAN share smoke tests exit code: $LAN_SHARE_EXIT_CODE"
          echo "LAN share smoke tests exit code: $LAN_SHARE_EXIT_CODE" >> smoke-test-logs/lan-share-tests-output.log
          exit $LAN_SHARE_EXIT_CODE

  build-linux:
    timeout-minutes: 20
    needs: prepare-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set config
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#v}"
            IS_NIGHTLY="false"
          else
            TIMESTAMP=$(date -u +"%Y%m%dT%H%M%S")
            VERSION="dev-nightly.$TIMESTAMP"
            IS_NIGHTLY="true"
          fi
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_HASH="${{ github.sha }}"
          {
            echo '// Version is set by the CI build process. "dev" is used for local development.'
            echo 'export const version = "'"$VERSION"'";'
            echo ""
            echo "// Build metadata is set by the CI build process."
            echo "export const buildMetadata = {"
            echo '    commitHash: "'"$COMMIT_HASH"'",'
            echo '    buildDate: "'"$BUILD_DATE"'",'
            echo "    isNightly: $IS_NIGHTLY,"
            echo "};"
          } > packages/config/src/index.ts
          echo "Config set to:"
          cat packages/config/src/index.ts

      - name: Verify runner architecture
        run: |
          echo "Architecture: $(uname -m)"
          echo "Processor: $(uname -p)"
          lscpu | grep Architecture

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe
          
      - name: Verify media tool versions
        run: |
          echo "=== Media Tool Versions ==="
          echo ""
          echo "ImageMagick (convert):"
          convert --version | head -1
          echo ""
          echo "ImageMagick (identify):"
          identify --version | head -1
          echo ""
          echo "ffmpeg:"
          ffmpeg -version | head -1
          echo ""
          echo "ffprobe:"
          ffprobe -version | head -1
          echo ""
          
      # The smoke suite builds psi, mk and bdb itself (build_cli_binaries in apps/cli/smoke-tests.sh),
      # so this job no longer builds them beforehand only for the suite to build them again seconds
      # later. The chmod that went with each build was doing nothing: bun writes its compiled output
      # rwxr-xr-x already. The version check runs after the suite, so nothing has executed an
      # executable that is about to be overwritten, which is what broke build-windows in run
      # 31911942161.
      - name: Run smoke tests
        timeout-minutes: 14
        working-directory: ./apps/cli
        run: |
          mkdir -p smoke-test-logs
          ./smoke-tests.sh --binary 2>&1 | tee smoke-test-logs/smoke-tests-output.log
          SMOKE_TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "Smoke tests exit code: $SMOKE_TEST_EXIT_CODE"
          echo "Smoke tests exit code: $SMOKE_TEST_EXIT_CODE" >> smoke-test-logs/smoke-tests-output.log
          exit $SMOKE_TEST_EXIT_CODE

      - name: Test version command
        working-directory: ./apps/cli
        run: |
          echo "Testing version command after building..."
          ./bin/x64/linux/psi version

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-cli-linux-x64
          path: ./apps/cli/bin/x64/linux/psi

  build-windows:
    # 30 rather than 20, matching electron-smoke-tests and the unit-test jobs. This job builds three
    # executables and then runs the whole CLI smoke suite, which has grown from 65 tests to 79. Its
    # last two runs took 19m41s and 18m27s, so it was within twenty seconds of its limit, and the
    # next one was killed at 20m11s having reported nothing. A job cancelled on its timeout says less
    # than one that finishes and lists what failed.
    timeout-minutes: 30
    needs: prepare-tag
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#v}"
            IS_NIGHTLY="false"
          else
            TIMESTAMP=$(date -u +"%Y%m%dT%H%M%S")
            VERSION="dev-nightly.$TIMESTAMP"
            IS_NIGHTLY="true"
          fi
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_HASH="${{ github.sha }}"
          {
            echo '// Version is set by the CI build process. "dev" is used for local development.'
            echo 'export const version = "'"$VERSION"'";'
            echo ""
            echo "// Build metadata is set by the CI build process."
            echo "export const buildMetadata = {"
            echo '    commitHash: "'"$COMMIT_HASH"'",'
            echo '    buildDate: "'"$BUILD_DATE"'",'
            echo "    isNightly: $IS_NIGHTLY,"
            echo "};"
          } > packages/config/src/index.ts
          echo "Config set to:"
          cat packages/config/src/index.ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # ffmpeg comes from a pinned GitHub release, not Chocolatey. See the action for why.
      - name: Install ffmpeg
        uses: ./.github/actions/install-ffmpeg-windows

      # Only imagemagick, and only because the runner image already has it, so Chocolatey answers from
      # what is installed rather than fetching. Anything it has to fetch is currently refused: ffmpeg
      # moved to a GitHub release above for that reason, and tree went the same way immediately after,
      # failing five attempts with "the package was not found with the source(s) listed".
      #
      # tree is not installed at all now. The smoke tests' show_tree already falls back to ls when it
      # is missing, and Windows ships a tree of its own in cmd, so nothing needed the Chocolatey one.
      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: |
            echo "Installing ImageMagick via Chocolatey..."
            choco install imagemagick -y
          verify: magick|convert

      - name: Verify media tool versions
        run: |
          echo "=== Media Tool Versions ==="
          echo ""
          echo "ImageMagick (magick):"
          magick --version | Select-Object -First 1
          echo ""
          echo "ImageMagick (convert):"
          magick convert --version | Select-Object -First 1
          echo ""
          echo "ffmpeg:"
          ffmpeg -version 2>&1 | Select-Object -First 1
          echo ""
          echo "ffprobe:"
          ffprobe -version 2>&1 | Select-Object -First 1
          echo ""

      # The smoke suite builds psi, mk and bdb itself (build_cli_binaries in apps/cli/smoke-tests.sh),
      # so this job does not build them beforehand and does not run psi until after that build. It
      # used to do both: build the three executables, run psi.exe to check the version command, and
      # then have the smoke suite overwrite the same three files a second later. Windows refuses a
      # rename onto a file anything still holds open, and run 31911942161 failed on exactly that:
      # "failed to move executable to D:\a\photosphere\photosphere\apps\cli\bin\x64\win\psi.exe:
      # EPERM", 1.6 seconds after the version step had executed that file. Building each executable
      # once, with nothing having run it, leaves nothing holding it open to refuse the move.
      # PHOTOSPHERE_SUITE_TIMEOUT is 18 minutes here rather than the 25 the library defaults to,
      # because on this job the default is above both caps below it and so can never be the first
      # thing to act. That is what happened on run 33450001083, the third sighting of the CLI suite
      # hanging on Windows: the step ran 32 minutes, GitHub's own 24 minute step cap did not end it,
      # the job cap did, and GitHub discards the log of a job it kills, so the hang left nothing to
      # read for the third time running. The suite's own ceiling is the only one of the three that
      # has ever been seen to work, and it needs to fire while there is still time for its report and
      # its kill to take effect. 18 is clear of the 15 minute healthy run and well short of both caps.
      - name: Run smoke tests
        timeout-minutes: 24
        working-directory: ./apps/cli
        shell: bash
        env:
          PHOTOSPHERE_SUITE_TIMEOUT: 1080
        run: |
          mkdir -p smoke-test-logs
          ./smoke-tests.sh --binary 2>&1 | tee smoke-test-logs/smoke-tests-output.log
          SMOKE_TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "Smoke tests exit code: $SMOKE_TEST_EXIT_CODE"
          echo "Smoke tests exit code: $SMOKE_TEST_EXIT_CODE" >> smoke-test-logs/smoke-tests-output.log
          exit $SMOKE_TEST_EXIT_CODE

      - name: Test version command
        working-directory: ./apps/cli
        run: |
          echo "Testing version command after building..."
          ./bin/x64/win/psi.exe version

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-cli-windows-x64
          path: ./apps/cli/bin/x64/win/psi.exe

  build-windows-baseline:
    timeout-minutes: 20
    needs: prepare-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#v}"
            IS_NIGHTLY="false"
          else
            TIMESTAMP=$(date -u +"%Y%m%dT%H%M%S")
            VERSION="dev-nightly.$TIMESTAMP"
            IS_NIGHTLY="true"
          fi
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_HASH="${{ github.sha }}"
          {
            echo '// Version is set by the CI build process. "dev" is used for local development.'
            echo 'export const version = "'"$VERSION"'";'
            echo ""
            echo "// Build metadata is set by the CI build process."
            echo "export const buildMetadata = {"
            echo '    commitHash: "'"$COMMIT_HASH"'",'
            echo '    buildDate: "'"$BUILD_DATE"'",'
            echo "    isNightly: $IS_NIGHTLY,"
            echo "};"
          } > packages/config/src/index.ts
          echo "Config set to:"
          cat packages/config/src/index.ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Build Windows executable
        working-directory: ./apps/cli
        run: |
          bun run build-win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-cli-windows-x64-baseline
          path: ./apps/cli/bin/x64/win/psi.exe

  build-macos-x64:
    # 30 rather than 20, the same headroom build-windows has. This is the slowest of the build jobs
    # by a wide margin: its recent runs took 13m36s, 14m24s, 14m26s and 17m09s, and then one took
    # 20m19s and was killed on the limit having produced nothing. The others on this workflow finish
    # in six to ten minutes, so nothing else needs this. macos-15-intel is the scarce runner class
    # here and its pace varies more than the work does.
    timeout-minutes: 30
    needs: prepare-tag
    runs-on: macos-15-intel # x64 architecture
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set config
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#v}"
            IS_NIGHTLY="false"
          else
            TIMESTAMP=$(date -u +"%Y%m%dT%H%M%S")
            VERSION="dev-nightly.$TIMESTAMP"
            IS_NIGHTLY="true"
          fi
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_HASH="${{ github.sha }}"
          {
            echo '// Version is set by the CI build process. "dev" is used for local development.'
            echo 'export const version = "'"$VERSION"'";'
            echo ""
            echo "// Build metadata is set by the CI build process."
            echo "export const buildMetadata = {"
            echo '    commitHash: "'"$COMMIT_HASH"'",'
            echo '    buildDate: "'"$BUILD_DATE"'",'
            echo "    isNightly: $IS_NIGHTLY,"
            echo "};"
          } > packages/config/src/index.ts
          echo "Config set to:"
          cat packages/config/src/index.ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Verify runner architecture
        run: |
          echo "Architecture: $(uname -m)"
          echo "Processor: $(uname -p)"
          echo "OS Version: $(sw_vers)"

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: |
            echo "Installing ImageMagick, ffmpeg, and tree via Homebrew..."
            brew install imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Verify media tool versions
        run: |
          echo "=== Media Tool Versions ==="
          echo ""
          echo "ImageMagick (magick):"
          magick --version | head -1 || echo "magick command not found"
          echo ""
          echo "ImageMagick (convert):"
          convert --version | head -1 || echo "convert command not found"
          echo ""
          echo "ffmpeg:"
          ffmpeg -version | head -1
          echo ""
          echo "ffprobe:"
          ffprobe -version | head -1
          echo ""

      # The smoke suite builds psi, mk and bdb itself (build_cli_binaries in apps/cli/smoke-tests.sh),
      # so this job no longer builds them beforehand only for the suite to build them again seconds
      # later. The chmod that went with each build was doing nothing: bun writes its compiled output
      # rwxr-xr-x already. The version check runs after the suite, so nothing has executed an
      # executable that is about to be overwritten, which is what broke build-windows in run
      # 31911942161.
      - name: Run smoke tests
        timeout-minutes: 24
        working-directory: ./apps/cli
        run: |
          mkdir -p smoke-test-logs
          ./smoke-tests.sh --binary 2>&1 | tee smoke-test-logs/smoke-tests-output.log
          SMOKE_TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "Smoke tests exit code: $SMOKE_TEST_EXIT_CODE"
          echo "Smoke tests exit code: $SMOKE_TEST_EXIT_CODE" >> smoke-test-logs/smoke-tests-output.log
          exit $SMOKE_TEST_EXIT_CODE

      - name: Test built version command
        working-directory: ./apps/cli
        run: |
          echo "Testing version command after building..."
          ./bin/x64/mac/psi version

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-cli-macos-x64
          path: ./apps/cli/bin/x64/mac/psi

