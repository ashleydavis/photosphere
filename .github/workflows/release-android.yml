# The Photosphere App for Android, built once and then tested, packaged and released. prepare-tag resolves the release tag, and
# each third-party library (the AWS SDK for C, zlib-ng, ImageMagick and FFmpeg) has its own job that builds and caches it, all side
# by side. Then app-build builds the app's debug-type APK over those libraries and saves it in the cache under a key of its own for
# this run. The later jobs restore that instead of building: app-smoke-tests runs the APK and package packages the release APKs
# over the restored Zig build cache. zig-unit-tests runs the Zig unit tests on Linux over the Linux libraries and the TypeScript jobs compile and test the TypeScript. create-release, once every
# other job has passed, publishes the package.
name: Release Android

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.6"
  # Each platform has a workflow of its own, so a failure on one shows at a glance and holds up no other platform's release.
  # Its release tags are <RELEASE_PLATFORM>-v1.2.3, and its GitHub release is zig-<that tag>.
  RELEASE_PLATFORM: "android"
  RELEASE_PLATFORM_NAME: "Android"

on:
  # TODO: Turn the push and pull request triggers back on once every Zig release workflow passes. Until then each one is run manually.
  push:
    branches:
      - "*"
  #   tags:
  #     - 'android-v*.*.*'

  # pull_request:
  #   branches:
  #     - main

  workflow_dispatch:
    inputs:
      release:
        description: "Release action. none = nightly build. update-latest = move the latest android-v*.*.* tag to this commit and re-release it. new-patch = create the next patch tag (e.g. android-v0.0.8 -> android-v0.0.9) and release it."
        type: choice
        options:
          - none
          - update-latest
          - new-patch
        default: none

jobs:
  # Resolves the release tag once, before anything is built, because it can create and push a tag. Its outputs, the tag and
  # whether this run is a release, are read by app-build, cli-build, package and create-release, so the two builds run side by side.
  prepare-tag:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      is-release: ${{ steps.resolve.outputs.is-release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          RELEASE_INPUT="${{ inputs.release }}"
          PREFIX="${RELEASE_PLATFORM}-v"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "update-latest" ]; then
            TAG=$(git tag --list "${PREFIX}*.*.*" --sort=-version:refname | head -1)
            if [ -z "$TAG" ]; then
              echo "No existing ${PREFIX}*.*.* tag to update"
              exit 1
            fi
            git tag -f "$TAG"
            git push --force origin "$TAG"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "new-patch" ]; then
            LATEST=$(git tag --list "${PREFIX}*.*.*" --sort=-version:refname | head -1)
            if [ -z "$LATEST" ]; then
              LATEST="${PREFIX}0.0.0"
            fi
            MAJOR=$(echo "${LATEST#"$PREFIX"}" | cut -d. -f1)
            MINOR=$(echo "${LATEST#"$PREFIX"}" | cut -d. -f2)
            PATCH=$(echo "${LATEST#"$PREFIX"}" | cut -d. -f3)
            TAG="${PREFIX}${MAJOR}.${MINOR}.$((PATCH + 1))"
            git tag "$TAG"
            git push origin "$TAG"
            IS_RELEASE="true"
          else
            TAG=""
            IS_RELEASE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is-release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Resolved tag: '$TAG' (is-release: $IS_RELEASE)"

  # The third-party libraries, each built once by its own action and cached, so a library an earlier run (or another workflow) has
  # already built is restored rather than compiled again. Each is built for both Android architectures the app ships, and for the
  # runner, which the CLI that makes the smoke tests' fixtures builds for. Every job that runs the Zig build restores them from that
  # cache with the third-party-libraries action.
  build-aws-sdk:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      - name: Build the AWS SDK for C for the runner
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: linux-x64

      - name: Build the AWS SDK for C for Android x86_64
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: android
          build-args: -Dtarget=x86_64-linux-android --libc ../../tmp/android-libc/x86_64.txt

      - name: Build the AWS SDK for C for Android arm64
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: android
          build-args: -Dtarget=aarch64-linux-android --libc ../../tmp/android-libc/arm64.txt

  build-zlib-ng:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      - name: Build zlib-ng for the runner
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: linux-x64

      - name: Build zlib-ng for Android x86_64
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: android
          build-args: -Dtarget=x86_64-linux-android --libc ../../tmp/android-libc/x86_64.txt

      - name: Build zlib-ng for Android arm64
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: android
          build-args: -Dtarget=aarch64-linux-android --libc ../../tmp/android-libc/arm64.txt

  build-imagemagick:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      - name: Build ImageMagick for the runner
        uses: ./.github/actions/build-imagemagick
        with:
          platform: linux-x64

      - name: Build ImageMagick for Android x86_64
        uses: ./.github/actions/build-imagemagick
        with:
          platform: android
          build-args: -Dtarget=x86_64-linux-android --libc ../../tmp/android-libc/x86_64.txt

      - name: Build ImageMagick for Android arm64
        uses: ./.github/actions/build-imagemagick
        with:
          platform: android
          build-args: -Dtarget=aarch64-linux-android --libc ../../tmp/android-libc/arm64.txt

  build-ffmpeg:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      - name: Build FFmpeg for the runner
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: linux-x64

      - name: Build FFmpeg for Android x86_64
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: android
          build-args: -Dtarget=x86_64-linux-android --libc ../../tmp/android-libc/x86_64.txt

      - name: Build FFmpeg for Android arm64
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: android
          build-args: -Dtarget=aarch64-linux-android --libc ../../tmp/android-libc/arm64.txt

  # Restores the third-party libraries the library jobs built and builds the Photosphere App for Android by the same build script
  # a developer runs: a debug-type APK of the release library for both Android architectures, which is what the smoke tests need,
  # because their scenarios seed and read the app's data through run-as. The version comes from the release tag: android-v1.2.3 is
  # 1.2.3 and a nightly is dev-nightly.<timestamp>. The library jobs build each library for both Android architectures the app ships, and for the
  # runner, which the CLI that makes the smoke tests' fixtures builds for, and this job restores them from
  # their caches. The APK, the Zig build cache and the libraries are saved
  # under photosphere-app-android-<commit>-<run>, which app-smoke-tests and package restore.
  app-build:
    timeout-minutes: 150
    needs: [prepare-tag, build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      - name: Restore the third-party libraries for the runner
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      - name: Restore the third-party libraries for Android x86_64
        uses: ./.github/actions/third-party-libraries
        with:
          platform: android
          build-args: -Dtarget=x86_64-linux-android --libc ../../tmp/android-libc/x86_64.txt

      - name: Restore the third-party libraries for Android arm64
        uses: ./.github/actions/third-party-libraries
        with:
          platform: android
          build-args: -Dtarget=aarch64-linux-android --libc ../../tmp/android-libc/arm64.txt

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#"${RELEASE_PLATFORM}-v"}"
            VERSION="$(bash ./scripts/set-build-config.sh --tag "$VERSION" --commit "${{ github.sha }}")"
          else
            VERSION="$(bash ./scripts/set-build-config.sh --commit "${{ github.sha }}")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # The APK is copied to out/app/photosphere.apk, laid out as apps/photosphere-smoke-tests/run.md describes, which is where the
      # smoke tests take it from.
      - name: Build (Android)
        shell: bash
        run: bun run --filter=ziggy build:android -- --output-dir "$PWD/out/app"

      - name: Save the Photosphere App build
        uses: actions/cache/save@v4
        with:
          path: |
            out/app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-android-${{ github.sha }}-${{ github.run_id }}

  app-smoke-tests:
    # The Photosphere App's smoke tests on an Android emulator. The emulator has no host LAN bridge, so PHOTOSPHERE_NO_LAN_BRIDGE
    # makes the scenarios that need one skip with a logged SKIP line.
    #
    # The app is the debug-type APK app-build built, which PHOTOSPHERE_SMOKE_BUILD names: the scenarios seed and read the app's data
    # through run-as, which needs a debuggable APK, and the release APK is not one. The CLI that makes the scenarios' fixtures is
    # built over app-build's Zig build cache and libraries, restored below.
    timeout-minutes: 90
    needs: [app-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The scenarios build their database fixtures with the CLI from source, which needs ImageMagick and ffmpeg.
      - name: Install media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg
          verify: magick|convert ffmpeg ffprobe

      # The runner comes with NDKs the app does not use, and with them, the NDK it does and the system image installed, too little
      # disk is left for the emulator's userdata partition: it stops at once with "Not enough space to create userdata partition".
      - name: Uninstall the NDKs the app does not use (Android)
        run: |
          unused=()
          for ndk_dir in "$ANDROID_HOME"/ndk/*; do
              if [ -d "$ndk_dir" ] && [ "$(basename "$ndk_dir")" != "25.1.8937393" ]; then
                  unused+=("ndk;$(basename "$ndk_dir")")
              fi
          done
          if [ "${#unused[@]}" -gt 0 ]; then
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --uninstall "${unused[@]}"
          fi
          df -h /

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      # The CLI that makes the scenarios' fixtures is built for the runner, and the app for the emulator. app-build saved the
      # libraries for both.
      - name: Restore the Photosphere App build
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-android-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      # Allow the hardware-accelerated emulator to use KVM on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator runner below downloads this system image once, with no retry, and a download can arrive corrupt:
      # an Android smoke job failed with "Error on ZipFile unknown archive" while it prepared the Google APIs Intel x86_64
      # Atom System Image, before any test ran. Installing it here, retried, leaves the runner an image that is already
      # installed. The licence step ends in "|| true" because `yes` is killed when sdkmanager stops reading, which
      # fails a pipeline under pipefail. sdkmanager is called by its full path because a plain step does not have it on PATH
      # ("sdkmanager: command not found", exit 127).
      - name: Install the Android system image
        uses: ./.github/actions/retry-install
        with:
          run: |
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-35;google_apis;x86_64'

      - name: Run the Photosphere App Android smoke tests
        timeout-minutes: 75
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PHOTOSPHERE_NO_LAN_BRIDGE: "1"
          PHOTOSPHERE_SMOKE_BUILD: ${{ github.workspace }}/out/app
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # Emulator 36.6.11, the build the local emulator scripts pin (EMULATOR_BUILD in apps/android-frontend/scripts/emulator-config.sh,
          # which says why): the newest emulator never gives back the memory of an app it has stopped, and this suite starts the app
          # many times.
          emulator-build: 15507667
          # One line: the action runs each line of `script:` as its own shell, so only a single line's exit status reaches the job.
          script: bun run test:ziggy:and

  # Compiles the TypeScript, which is the only check of its types: the unit tests run it without checking them.
  typescript-compile:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # bun run compile records a what-changed baseline when it succeeds.
      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Compile TypeScript
        timeout-minutes: 12
        run: bun run compile

  # The TypeScript unit tests.
  typescript-unit-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run unit tests
        timeout-minutes: 12
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

  # The unit tests of the Zig CLI and of every Zig package, on this workflow's runner, over the libraries the library jobs built for it
  # and the Zig build cache app-build saved.
  zig-unit-tests:
    timeout-minutes: 50
    needs: [build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg, app-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      # The libraries for the runner, which the tests build for, restored from the cache.
      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      # Zig skips any compile step whose inputs are unchanged and already in .zig-cache. Without this the test binaries and psi are
      # compiled from nothing every run, which is most of this job's time. The key changes with any Zig source, and the newest
      # earlier cache is restored when there is no exact match, so only the binaries a change touches are compiled again.
      # The next step lays app-build's cache over it.
      - name: Cache Zig's build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', '**/*.zig', '**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      # The build app-build saved, with its Zig build cache and libraries, laid over the test build's own cache, so Zig reuses any
      # compile step the two builds have in common. The paths are the ones app-build saved, which a restore has to name exactly.
      - name: Restore the app build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-android-${{ github.sha }}-${{ github.run_id }}

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # Built for any CPU of the architecture, so the compile steps match the restored build caches whatever CPU the runner has.
      - name: Run the Zig unit tests
        timeout-minutes: 40
        shell: bash
        run: zig build test -Dcpu=baseline --summary all --test-timeout 20m

  # Packages the Photosphere App for Android, unsigned, by the same package script a developer runs: a release APK per
  # architecture, over the Zig build cache and the libraries app-build saved, so the Zig build starts warm. It stamps the version
  # the way app-build does. The Android version code, which has to rise with every build that replaces another, is the build time
  # in minutes since the epoch. The packages are built and not run: running them needs an emulator, which the smoke test job and
  # the local test runs provide. They are saved under photosphere-package-android-<commit>-<run>, which create-release restores.
  # It runs beside the smoke tests.
  package:
    timeout-minutes: 120
    needs: [prepare-tag, app-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      - name: Restore the Photosphere App build
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-android-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#"${RELEASE_PLATFORM}-v"}"
            VERSION="$(bash ./scripts/set-build-config.sh --tag "$VERSION" --commit "${{ github.sha }}")"
          else
            VERSION="$(bash ./scripts/set-build-config.sh --commit "${{ github.sha }}")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Package (Android)
        shell: bash
        run: bun run --filter=ziggy package:android -- --version-name "$VERSION" --version-code "$(( $(date +%s) / 60 ))" --output-dir "$PWD/out/package"

      - name: Save the Photosphere App package
        uses: actions/cache/save@v4
        with:
          path: out/package
          key: photosphere-package-android-${{ github.sha }}-${{ github.run_id }}

  # Publishes the packages the package job made, restored from the cache under its key, once every other job has passed. A restore
  # matches only a save of the same paths, so it restores the whole save.
  create-release:
    timeout-minutes: 20
    needs: [prepare-tag, app-build, app-smoke-tests, package, typescript-compile, typescript-unit-tests, zig-unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the Photosphere App package
        uses: actions/cache/restore@v4
        with:
          path: out/package
          key: photosphere-package-android-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Put the Photosphere App packages where the release steps read them
        shell: bash
        run: |
          mkdir -p ./artifacts/app
          cp out/package/*.apk ./artifacts/app/
          ls -la ./artifacts/app

      - name: Generate release notes
        id: release-notes
        run: |
          # The CLI commits made since the last release tag, as bullets. The same script produces the
          # notes for the Android tester builds, so a release and a tester build never describe the
          # same commits differently. The tag being built is excluded so a tagged release measures
          # from the tag before it; for a nightly the tag is empty and nothing is excluded.
          RELEASE_NOTES=$(bash ./scripts/release-notes.sh \
            --prefix cli \
            --exclude-tag "${{ needs.prepare-tag.outputs.tag }}" \
            --tag-pattern "${RELEASE_PLATFORM}-v*.*.*" \
            --empty-message "- No CLI-related commits found")

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Generated release notes:"
          echo "$RELEASE_NOTES"

      - name: Delete existing nightly release
        if: needs.prepare-tag.outputs.is-release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${RELEASE_PLATFORM}-nightly" --yes --cleanup-tag || true
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-tag.outputs.is-release == 'true' && needs.prepare-tag.outputs.tag || format('{0}-nightly', env.RELEASE_PLATFORM) }}
          # The zig- tag does not exist yet, so the release creates it. Without this it would be created on the default branch rather than on the commit that was built.
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare-tag.outputs.is-release == 'true' && format('Photosphere {0} {1}', env.RELEASE_PLATFORM_NAME, needs.prepare-tag.outputs.tag) || format('Photosphere {0} Nightly', env.RELEASE_PLATFORM_NAME) }}
          draft: false
          prerelease: ${{ needs.prepare-tag.outputs.is-release != 'true' }}
          files: |
            ./artifacts/app/*
          body: |
            ${{ needs.prepare-tag.outputs.is-release == 'true' && format('Photosphere {0} release {1}', env.RELEASE_PLATFORM_NAME, needs.prepare-tag.outputs.tag) || format('Photosphere {0} nightly build - {1}', env.RELEASE_PLATFORM_NAME, github.sha) }}

            ${{ needs.prepare-tag.outputs.is-release != 'true' && '⚠️ **This is a nightly build and may be unstable**' || '' }}
            ${{ needs.prepare-tag.outputs.is-release != 'true' && format('Built from commit: {0}', github.sha) || '' }}

            ## What's Changed
            ${{ steps.release-notes.outputs.RELEASE_NOTES }}

            ## Download
            - **Android**: `.apk`

            ## Bundled tools and licences
            The mobile apps bundle in-process builds of ImageMagick (ImageMagick licence, an Apache-2.0-style licence) and FFmpeg (LGPL-2.1+), along with ImageMagick's libjpeg, libpng, libwebp and zlib delegates. Full attribution and licences are in [THIRD-PARTY-NOTICES.md](https://github.com/ashleydavis/photosphere/blob/main/THIRD-PARTY-NOTICES.md).
