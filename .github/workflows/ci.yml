# CI for every push, on Linux only. Each third-party library (the AWS SDK for C, zlib-ng, ImageMagick and FFmpeg) has its own job that
# builds it for Linux and caches it under the key the release workflows use too. app-build-linux builds the Photosphere App and
# cli-build-linux the Zig CLI over those libraries, zig-unit-tests-linux runs the Zig unit tests over them and the TypeScript jobs compile
# and test the TypeScript. CI packages nothing and builds for no other platform: the release workflows do both.
name: CI

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.6"

on:
  push:
    branches:
      - "*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  # Builds the AWS SDK for C for Linux, for app-build-linux, cli-build-linux and zig-unit-tests-linux to
  # restore. The library's build action caches it, so a later run, or a release workflow, restores it rather than building it again.
  build-aws-sdk-linux:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the AWS SDK for C
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: linux-x64

  # Builds zlib-ng for Linux, for app-build-linux, cli-build-linux and zig-unit-tests-linux to
  # restore. The library's build action caches it, so a later run, or a release workflow, restores it rather than building it again.
  build-zlib-ng-linux:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build zlib-ng
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: linux-x64

  # Builds ImageMagick for Linux, for app-build-linux, cli-build-linux and zig-unit-tests-linux to
  # restore. The library's build action caches it, so a later run, or a release workflow, restores it rather than building it again.
  build-imagemagick-linux:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ImageMagick
        uses: ./.github/actions/build-imagemagick
        with:
          platform: linux-x64

  # Builds FFmpeg for Linux, for app-build-linux, cli-build-linux and zig-unit-tests-linux to
  # restore. The library's build action caches it, so a later run, or a release workflow, restores it rather than building it again.
  build-ffmpeg-linux:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FFmpeg
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: linux-x64

  # Builds the Photosphere App for Linux, by the same build script a developer runs, over the Linux third-party libraries the
  # library jobs built, which it restores. CI never packages the app: the release workflows do.
  app-build-linux:
    timeout-minutes: 150
    needs: [build-aws-sdk-linux, build-zlib-ng-linux, build-imagemagick-linux, build-ffmpeg-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The Linux native app links the runtime libraries by file name, so no development packages are needed. WebKitGTK plays
      # video through GStreamer, so the packaged app depends on those plugins.
      - name: Install the build and packaging tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 libgdk-pixbuf-2.0-0 gstreamer1.0-plugins-good gstreamer1.0-libav zip
          verify: zip

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      # The app is built into out/app, laid out as apps/photosphere-smoke-tests/run.md describes.
      - name: Build
        shell: bash
        run: |
          build_dir="$PWD/out/app"
          bun run --filter=ziggy build:linux -- --prefix "$build_dir"

  # Builds the Zig CLI for Linux over the Linux third-party libraries the library jobs built, which it restores.
  cli-build-linux:
    timeout-minutes: 60
    needs: [build-aws-sdk-linux, build-zlib-ng-linux, build-imagemagick-linux, build-ffmpeg-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      # `zig build` keeps one HTTP client for its whole run. It fetches the eager packages, compiles and runs
      # the build script, then fetches the lazy packages the script asked for, reusing the keep-alive
      # connections it pooled during the first fetch. By then the server has closed them, and Zig 0.16's
      # client takes a pooled connection without checking it is still open and does not retry, so a lazy
      # download fails with "invalid HTTP response: HttpConnectionClosing" whenever the package cache missed.
      # --fetch=all fetches every package, lazy ones included, in one pass and exits before the build script
      # runs, so no download waits behind it.
      - name: Fetch every package Zig needs, lazy ones included, in one pass
        run: zig build --fetch=all

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      # Built for any CPU of the architecture, the same way the release workflows build the CLI.
      - name: Build the Zig CLI
        run: zig build -Dcpu=baseline --prefix out/cli --prefix-exe-dir .

      # Saved for zig-unit-tests-linux, which lays it over its own build cache.
      - name: Save the Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}

  # Compiles the TypeScript, which is the only check of its types: the unit tests run it without checking them.
  typescript-compile:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # bun run compile records a what-changed baseline when it succeeds.
      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Compile TypeScript
        timeout-minutes: 12
        run: bun run compile

  # The TypeScript unit tests.
  typescript-unit-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run unit tests
        timeout-minutes: 12
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

  # The unit tests of the Zig CLI and of every Zig package.
  zig-unit-tests-linux:
    timeout-minutes: 50
    needs: [build-aws-sdk-linux, build-zlib-ng-linux, build-imagemagick-linux, build-ffmpeg-linux, cli-build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      # The libraries the build jobs built, restored from the cache for the Zig build to link.
      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      # Zig skips any compile step whose inputs are unchanged and already in .zig-cache. Without this the test binaries and psi are
      # compiled from nothing every run, which is most of this job's time. The key changes with any Zig source, and the newest
      # earlier cache is restored when there is no exact match, so only the binaries a change touches are compiled again.
      # The next step lays the Linux CLI build's cache over it.
      - name: Cache Zig's build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', '**/*.zig', '**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      # The Zig build cache the Linux CLI build of this commit saved, laid over the test build's own, so Zig reuses any compile step
      # the two builds have in common. Nothing is restored when no Linux CLI build of this commit has saved one.
      - name: Restore the Linux CLI build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # Built for any x86-64 CPU. Built for the runner's own, which differs from run to run, every compile step missed the build cache
      # restored above, so each run compiled everything again.
      - name: Run the Zig unit tests
        timeout-minutes: 40
        shell: bash
        run: zig build test -Dcpu=baseline --summary all --test-timeout 20m
