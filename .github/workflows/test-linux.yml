# The tests on Linux, on every push and on demand, made to report as fast as possible. build builds the Photosphere App and the Zig CLI
# once, in Debug because it compiles fastest, and uploads both. The app smoke tests are split across runners, each running one shard
# of the scenarios on that build, beside the CLI smoke tests and the Zig unit tests. The TypeScript is compiled and tested here only,
# because it is the same on every platform. Nothing is packaged or released: the release workflows do that, on a tag or on demand.
name: Test Linux

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.6"

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

# A newer push to the same branch supersedes a run still going, so only the latest commit's results are waited for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the app and the CLI in Debug and uploads them as one tar, which keeps the executable bits an artifact would lose. It is the
  # only job that may build a third-party library, when no stored artifact has it, so two jobs never upload the same library at once.
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # The Linux native app links the runtime libraries by file name, so no development packages are needed.
      - name: Install the app's runtime libraries
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 libgdk-pixbuf-2.0-0
          verify: ""

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      - name: Restore the Debug build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-build-

      - name: Build the app
        shell: bash
        run: bun run --filter=ziggy build:linux -- --prefix "$PWD/out/app" --optimize Debug

      - name: Build the Zig CLI
        shell: bash
        run: zig build -Dcpu=baseline -Doptimize=Debug --prefix out/psi

      - name: Save the Debug build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-build-${{ github.sha }}

      - name: Pack the build
        shell: bash
        run: tar -cf "$RUNNER_TEMP/build.tar" out/app out/psi

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: test-build-linux
          path: ${{ runner.temp }}/build.tar
          retention-days: 1
          compression-level: 1

  # One shard of the app smoke tests per runner, under xvfb.
  app-smoke-tests:
    timeout-minutes: 30
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # The app's runtime libraries, xvfb, which lib/linux.sh runs the app under, and the media tools the scenarios' fixtures need.
      - name: Install the runtime libraries, xvfb and media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 libgdk-pixbuf-2.0-0 gstreamer1.0-plugins-good gstreamer1.0-libav xvfb imagemagick ffmpeg
          verify: xvfb-run magick|convert ffmpeg ffprobe

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: test-build-linux
          path: ${{ runner.temp }}

      - name: Unpack the build
        shell: bash
        run: tar -xf "$RUNNER_TEMP/build.tar"

      - name: Run shard ${{ matrix.shard }} of the Photosphere App smoke tests
        timeout-minutes: 25
        shell: bash
        env:
          PHOTOSPHERE_SMOKE_SHARD: ${{ matrix.shard }}/4
          # Three at once on the runner's four cores, so four shards take the time six took two at a time, on two fewer runners under
          # the account's limit of 20 jobs at once, which the Windows shards were queueing on.
          PHOTOSPHERE_TEST_PARALLEL: "3"
        run: PHOTOSPHERE_SMOKE_BUILD="$PWD/out/app" PHOTOSPHERE_SMOKE_PSI="$PWD/out/psi/bin/psi" bun run test:ziggy

      - name: Collect the logs of failed scenarios
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-smoke-logs"
          if [ -d "${TMPDIR:-/tmp}/photosphere-tests" ]; then
              cp -R "${TMPDIR:-/tmp}/photosphere-tests" "$RUNNER_TEMP/app-smoke-logs/"
          fi

      - name: Upload the logs of failed scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs-linux-${{ matrix.shard }}
          path: ${{ runner.temp }}/app-smoke-logs
          retention-days: 5

  cli-smoke-tests:
    timeout-minutes: 40
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Install media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      # Scenario 75 runs `zig build test-integration`, which links the libraries.
      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      - name: Restore the Zig unit tests' build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: test-build-linux
          path: ${{ runner.temp }}

      - name: Unpack the build
        shell: bash
        run: tar -xf "$RUNNER_TEMP/build.tar"

      - name: Run the Zig CLI smoke tests
        timeout-minutes: 30
        working-directory: ./apps/cli-zig
        shell: bash
        run: PHOTOSPHERE_SMOKE_PSI="$PWD/../../out/psi/bin/psi" ./smoke-tests-zig.sh

      - name: Collect the logs of failed CLI smoke tests
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-smoke-logs"
          if [ -d "${TMPDIR:-/tmp}/photosphere-tests" ]; then
              cp -R "${TMPDIR:-/tmp}/photosphere-tests" "$RUNNER_TEMP/cli-smoke-logs/"
          fi

      - name: Upload the logs of failed CLI smoke tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-logs-linux
          path: ${{ runner.temp }}/cli-smoke-logs
          retention-days: 5

  # The unit tests of the Zig CLI and of every Zig package. After build only so that build is the one job that may build a library.
  zig-unit-tests:
    timeout-minutes: 40
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No Bun or Node.js: the Zig tests use neither.
      - name: Setup Zig and jq (versions from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Install media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      - name: Cache Zig's build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      # The getImageDetails format test reads images from test/formats, which are made on the machine rather than committed.
      - name: Make the format test images
        shell: bash
        run: bash scripts/make-format-test-images.sh

      - name: Run the Zig unit tests
        timeout-minutes: 30
        shell: bash
        run: zig build test -Dcpu=baseline --summary all --test-timeout 20m

  # Compiles the TypeScript, which is the only check of its types (the unit tests run it without checking them), and runs its unit tests.
  typescript:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # bun run compile records a what-changed baseline when it succeeds.
      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Compile TypeScript
        timeout-minutes: 12
        run: bun run compile

      # In the compile's job rather than one of their own, to keep a runner free under the account's limit of 20 jobs at once, and
      # run whether or not the compile passed, so one push reports both.
      - name: Run the TypeScript unit tests
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh
