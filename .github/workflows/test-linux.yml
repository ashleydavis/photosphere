# The tests on Linux, on every push and on demand. They run every test Release Linux runs, minus packaging and publishing, over the
# same libraries and the same builds: each third-party library (the AWS SDK for C, zlib-ng, ImageMagick and FFmpeg) has its own job
# that builds and stores it, side by side, and then app-build builds the app and cli-build builds the CLI over those. The later jobs
# restore what those built: app-smoke-tests runs the app build, cli-smoke-tests runs the CLI, zig-unit-tests runs the Zig unit tests
# and the TypeScript jobs compile and test the TypeScript.
name: Test Linux

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.6"

on:
  # Every push is tested. A release is made by its own workflow, when its tag is pushed or when it is started by hand.
  push:
    branches:
      - "**"

  workflow_dispatch:

jobs:

  # The third-party libraries, each built once by its own action and stored as an artifact under the same keys the release
  # workflows use, so a library either kind of workflow has already built is restored rather than compiled again. Every job that
  # runs the Zig build restores them from those artifacts with the third-party-libraries action.
  build-aws-sdk:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the AWS SDK for C
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: linux-x64

  build-zlib-ng:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build zlib-ng
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: linux-x64

  build-imagemagick:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ImageMagick
        uses: ./.github/actions/build-imagemagick
        with:
          platform: linux-x64

  build-ffmpeg:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FFmpeg
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: linux-x64

  # Restores the third-party libraries the library jobs built and builds the Photosphere App for Linux by the same build script a
  # developer runs, unstamped. Each library job stores its library, so this job restores it. The build, the Zig build cache and the
  # libraries are saved under photosphere-app-linux-<commit>-<run>, which app-smoke-tests restores.
  app-build:
    timeout-minutes: 120
    needs: [build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      # The Linux native app links the runtime libraries by file name, so no development packages are needed. WebKitGTK plays
      # video through GStreamer, so the app needs those plugins.
      - name: Install the app's runtime libraries (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 libgdk-pixbuf-2.0-0 gstreamer1.0-plugins-good gstreamer1.0-libav
          verify: ""

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      # The finished app, keyed on everything it is built from, so a commit that changes only the tests pays no build. An exact
      # match only, so nothing is restored for a commit whose Zig code, page, libraries or native sources differ. Worked out once
      # here and used to restore and to save alike: computing it in both places gave two keys, because hashFiles is not stable
      # across a build.
      - name: Work out the built-app cache key
        id: built-key
        shell: bash
        run: echo "key=${{ runner.os }}-${{ runner.arch }}-test-built-app-linux-${{ hashFiles('mise.toml', 'packages-zig/**/src/**', 'packages-zig/**/build.zig', 'packages-zig/*.zig', 'apps/cli-zig/src/**', 'apps/cli-zig/build.zig', 'build.zig', 'build.zig.zon', 'third-party/*/build.zig.zon', 'apps/photosphere-frontend/src/**', 'packages/**/src/**', 'apps/photosphere/native/linux/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the built app
        id: built
        uses: actions/cache/restore@v4
        with:
          path: out/app
          key: ${{ steps.built-key.outputs.key }}

      # The app build's Zig build cache, restored from the latest run that saved one for this platform, so the build
      # compiles only what changed instead of the whole app. Saved again after the build, as the CLI build does.
      - name: Restore the app build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-app-build-linux-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-app-build-linux-

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # The app is built into out/app, laid out as apps/photosphere-smoke-tests/run.md describes, which is where the smoke tests take
      # it from.
      - name: Build
        if: steps.built.outputs.cache-hit != 'true'
        shell: bash
        # The release build, minified and stripped, so the smoke tests run what ships
        # rather than compiling the app again.
        run: bun run --filter=ziggy build:linux -- --prefix "$PWD/out/app" --minify --strip

      - name: Save the built app
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/app
          key: ${{ steps.built-key.outputs.key }}

      - name: Save the app build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-app-build-linux-${{ github.sha }}

      - name: Save the Photosphere App build
        uses: actions/cache/save@v4
        with:
          path: |
            out/app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-linux-${{ github.sha }}-${{ github.run_id }}

  cli-build:
    # Restores the third-party libraries the library jobs built and builds the Zig CLI for Linux x64 on a runner of that platform.
    # Nothing here cross-compiles, so a build that works is a build that runs on the platform it names.
    #
    # This is the only job that builds the Zig CLI: the binary, the Zig build cache and the libraries are saved under
    # photosphere-cli-linux-<commit>-<run>, which cli-smoke-tests restores, so the binary is built once and used by both.
    timeout-minutes: 60
    needs: [build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # `zig build` keeps one HTTP client for its whole run. It fetches the eager packages, compiles and runs
      # the build script, then fetches the lazy packages the script asked for, reusing the keep-alive
      # connections it pooled during the first fetch. By then the server has closed them, and Zig 0.16's
      # client takes a pooled connection without checking it is still open and does not retry, so a lazy
      # download fails with "invalid HTTP response: HttpConnectionClosing" whenever the package cache missed.
      # --fetch=all fetches every package, lazy ones included, in one pass and exits before the build script
      # runs, so no download waits behind it.
      - name: Fetch every package Zig needs, lazy ones included, in one pass
        working-directory: .
        run: zig build --fetch=all

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      - name: Build the Zig CLI natively for Linux x64
        working-directory: .
        run: zig build -Dcpu=baseline --prefix apps/cli-zig/bin/x64/linux --prefix-exe-dir .

      - name: Check the binary was produced
        working-directory: ./apps/cli-zig
        run: |
          ls -la bin/x64/linux/psi
          file bin/x64/linux/psi

      # The binary is renamed to say which CLI it is, because the TypeScript CLI is also called psi and
      # unpacking both releases into one directory would otherwise overwrite one with the other.
      - name: Collect the Zig CLI binary
        shell: bash
        run: |
          mkdir -p out
          chmod +x apps/cli-zig/bin/x64/linux/psi
          cp apps/cli-zig/bin/x64/linux/psi out/photosphere-cli-zig-linux-x64
          ls -la out

      - name: Save the Zig CLI build
        uses: actions/cache/save@v4
        with:
          path: |
            out
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-cli-linux-${{ github.sha }}-${{ github.run_id }}

      - name: Save the Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}

  cli-smoke-tests:
    # The Zig CLI smoke suites, because the byte-identical output (gzip OS byte, paths, file times) differs
    # between platforms. The unit tests are in the Zig CI workflow, so a failure in one is not
    # reported as a failure of the other.
    # The binary is not built here: cli-build builds it and this job restores it from the cache, so the Zig CLI
    # is compiled once and both this job and the release use it.
    # Setup takes about 5 minutes and the smoke suites about 15.
    timeout-minutes: 75
    needs: [cli-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig
      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install
      - name: Install media processing tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe
      - name: Show the disk space the Zig builds use (each package that builds the AWS SDK for C has its own zig-pkg and .zig-cache)
        if: always()
        shell: bash
        run: |
          df -h .
          du -sh packages/*/zig-pkg packages/*/.zig-cache apps/*/zig-pkg apps/*/.zig-cache 2>/dev/null || true
      # The smoke suites run the built binary rather than `bun run start`, at the path their common.sh reads. The suites also
      # run the Zig build of the CLI, which links the libraries cli-build saved with the binary, over the Zig build cache saved
      # with them.
      - name: Restore the Zig CLI build
        uses: actions/cache/restore@v4
        with:
          path: |
            out
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-cli-linux-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Put the Zig CLI where the smoke suites look for it
        shell: bash
        run: |
          mkdir -p zig-out/bin
          cp out/photosphere-cli-zig-linux-x64 zig-out/bin/psi
          # The smoke suites fail with exit 126 (found but not executable) without the executable bit.
          chmod +x zig-out/bin/psi
          ls -la zig-out/bin
      - name: Run the Zig CLI smoke tests
        timeout-minutes: 30
        working-directory: ./apps/cli-zig
        shell: bash
        # The suites run the psi cli-build built, put in place above, rather than building another.
        run: PHOTOSPHERE_SMOKE_PSI="$PWD/../../zig-out/bin/psi" ./smoke-tests-zig.sh
      - name: Test the Zig version command
        working-directory: ./apps/cli-zig
        shell: bash
        run: |
          echo "Testing version command after building..."
          ../../zig-out/bin/psi version

      # Scenario 86 (multi-device) of this suite sat out its 10-minute limit on macOS x64 after its last step had passed, and the job
      # kept nothing but the printed output, which did not say what it was waiting for. A failed test keeps its directory, which holds
      # its full log and the CLI's own logs.
      - name: Collect the logs of failed CLI smoke tests
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-smoke-logs"
          if [ -d "${TMPDIR:-/tmp}/photosphere-tests" ]; then
              cp -R "${TMPDIR:-/tmp}/photosphere-tests" "$RUNNER_TEMP/cli-smoke-logs/"
          fi

      - name: Upload the logs of failed CLI smoke tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-logs-linux
          path: ${{ runner.temp }}/cli-smoke-logs
          retention-days: 5

  app-smoke-tests:
    # The Photosphere App's smoke tests on Linux, run under xvfb, on the app app-build built, which PHOTOSPHERE_SMOKE_BUILD names.
    # The CLI that makes the scenarios' fixtures is the one cli-build built.
    timeout-minutes: 75
    needs: [app-build, cli-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The app's runtime libraries (as in app-build), and xvfb, which lib/linux.sh runs the app under.
      # The scenarios build their database fixtures with the CLI from source, which needs ImageMagick and ffmpeg.
      - name: Install the runtime libraries, xvfb and media processing tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 libgdk-pixbuf-2.0-0 gstreamer1.0-plugins-good gstreamer1.0-libav xvfb imagemagick ffmpeg
          verify: xvfb-run magick|convert ffmpeg ffprobe

      - name: Restore the Photosphere App build
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-linux-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      # The psi the scenarios run as the other side of a LAN share is the one cli-build built, so the smoke runner does not
      # build it again. The paths are the ones cli-build saves, since the cache only matches a restore that lists the same.
      - name: Restore the Zig CLI build
        uses: actions/cache/restore@v4
        with:
          path: |
            out
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-cli-linux-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Run the Photosphere App smoke tests
        timeout-minutes: 60
        shell: bash
        run: |
          # cli-smoke-tests runs this same restored psi only after giving it the executable bit (exit 126 without it), so this does too.
          chmod +x out/photosphere-cli-zig-linux-x64
          PHOTOSPHERE_SMOKE_BUILD="$PWD/out/app" PHOTOSPHERE_SMOKE_PSI="$PWD/out/photosphere-cli-zig-linux-x64" bun run test:ziggy

      # A failed scenario keeps its directory, which holds the app's log, its output and the core's own log. Without this upload a
      # failure that did not happen again left nothing to diagnose it from once the runner had gone.
      - name: Collect the logs of failed scenarios
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-smoke-logs"
          if [ -d "${TMPDIR:-/tmp}/photosphere-tests" ]; then
              cp -R "${TMPDIR:-/tmp}/photosphere-tests" "$RUNNER_TEMP/app-smoke-logs/"
          fi

      - name: Upload the logs of failed scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs-linux
          path: ${{ runner.temp }}/app-smoke-logs
          retention-days: 5

  # Compiles the TypeScript, which is the only check of its types: the unit tests run it without checking them.
  typescript-compile:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # bun run compile records a what-changed baseline when it succeeds.
      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Compile TypeScript
        timeout-minutes: 12
        run: bun run compile

  # The TypeScript unit tests.
  typescript-unit-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run unit tests
        timeout-minutes: 12
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

  # The unit tests of the Zig CLI and of every Zig package.
  zig-unit-tests:
    timeout-minutes: 50
    needs: [build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg, cli-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      # The libraries the build jobs built, restored from their artifacts for the Zig build to link.
      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      # Zig skips any compile step whose inputs are unchanged and already in .zig-cache. Without this the test binaries and psi are
      # compiled from nothing every run, which is most of this job's time. The key changes with any Zig source, and the newest
      # earlier cache is restored when there is no exact match, so only the binaries a change touches are compiled again.
      # The next step lays the Linux CLI build's cache over it.
      - name: Cache Zig's build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      # The Zig build cache the Linux CLI build of this commit saved, laid over the test build's own, so Zig reuses any compile step
      # the two builds have in common. Nothing is restored when no Linux CLI build of this commit has saved one.
      - name: Restore the Linux CLI build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # The getImageDetails format test reads images from test/formats, which are made on the machine rather than committed.
      - name: Make the format test images
        shell: bash
        run: bash scripts/make-format-test-images.sh

      # Built for any x86-64 CPU. Built for the runner's own, which differs from run to run, every compile step missed the build cache
      # restored above, so each run compiled everything again.
      - name: Run the Zig unit tests
        timeout-minutes: 40
        shell: bash
        run: zig build test -Dcpu=baseline --summary all --test-timeout 20m

  # Writes every job's and every step's timing to the run's summary page, so a run can be read without opening each job. The figures
  # are each job's and step's own start to finish: time spent queued for a runner is not in them, which is what makes two runs
  # comparable.
  report:
    if: always()
    needs: [build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg, app-build, cli-build, cli-smoke-tests, app-smoke-tests, typescript-compile, typescript-unit-tests, zig-unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the timings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --paginate > "$RUNNER_TEMP/jobs.json"
          {
            echo "## Job timings"
            echo ""
            echo "Each job's and each step's own start to finish. Queueing is not included."
            echo ""
            echo "| Job | Result | Time |"
            echo "|---|---|---|"
            jq -r '.jobs[] | select(.name != "report") | select(.started_at != null)
              | ((.completed_at|fromdateiso8601) - (.started_at|fromdateiso8601)) as $d
              | "| \(.name) | \(.conclusion) | \($d/60|floor)m \($d%60)s |"' "$RUNNER_TEMP/jobs.json"
            jq -r '.jobs[] | select(.name != "report") | select(.started_at != null)
              | "\n### \(.name)\n\n| Step | Result | Time |\n|---|---|---|\n"
                + ([.steps[] | select(.started_at != null)
                    | ((.completed_at|fromdateiso8601) - (.started_at|fromdateiso8601)) as $d
                    | "| \(.name) | \(.conclusion) | \($d/60|floor)m \($d%60)s |"] | join("\n"))' "$RUNNER_TEMP/jobs.json"
          } >> "$GITHUB_STEP_SUMMARY"
