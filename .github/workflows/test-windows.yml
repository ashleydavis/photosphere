# The tests on Windows, on every push and on demand, made to report as fast as possible. build builds the Photosphere App and the Zig
# CLI once, in Debug because it compiles fastest, and uploads both. The app smoke tests are split across runners, each running one
# shard of the scenarios on that build, beside the CLI smoke tests and the Zig unit tests. Nothing is packaged or released: the release
# workflow does that, on a tag or on demand.
name: Test Windows

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.6"

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

# A newer push to the same branch supersedes a run still going, so only the latest commit's results are waited for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the app (for the MSVC ABI) and the CLI (for the runner, x86_64-windows-gnu) in Debug and uploads them as one tar. It is the
  # only job that may build a third-party library, when no stored artifact has it, so two jobs never upload the same library at once.
  build:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Fetch the WebView2 SDK and the WiX Toolset
        shell: bash
        run: bun run --filter=ziggy setup

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: windows-x64

      - name: Restore the third-party libraries for the MSVC ABI
        uses: ./.github/actions/third-party-libraries
        with:
          platform: windows-x64
          build-args: -Dtarget=x86_64-windows-msvc

      - name: Set config
        shell: bash
        run: bash ./scripts/set-build-config.sh --commit "${{ github.sha }}"

      - name: Restore the Debug build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-build-

      # The prefix is given in the drive-letter form, because the build script hands it to zig.
      - name: Build the app
        shell: bash
        run: bun run --filter=ziggy build:windows -- --prefix "$(cygpath -m "$PWD/out/app")" --optimize Debug

      - name: Build the Zig CLI
        shell: bash
        run: zig build -Dcpu=baseline -Doptimize=Debug --prefix out/psi

      - name: Save the Debug build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-build-${{ github.sha }}

      # A relative path, because Git Bash's tar reads the drive letter of an absolute one as a remote host ("Cannot connect to D:").
      - name: Pack the build
        shell: bash
        run: tar -cf build.tar out/app out/psi

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: test-build-windows
          path: build.tar
          retention-days: 1
          compression-level: 1

  # One shard of the app smoke tests per runner.
  app-smoke-tests:
    timeout-minutes: 30
    needs: [build]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # The scenarios build their database fixtures with the CLI, which needs ImageMagick and ffmpeg.
      - name: Install ffmpeg
        uses: ./.github/actions/install-ffmpeg-windows

      - name: Install ImageMagick
        uses: ./.github/actions/retry-install
        with:
          run: choco install imagemagick -y
          verify: magick|convert

      - name: Fetch the WebView2 SDK and the WiX Toolset
        shell: bash
        run: bun run --filter=ziggy setup

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: test-build-windows
          path: .

      - name: Unpack the build
        shell: bash
        run: tar -xf build.tar

      # The paths are given in the drive-letter form, which both Git Bash and the native Windows programs the runner starts accept.
      - name: Run shard ${{ matrix.shard }} of the Photosphere App smoke tests
        timeout-minutes: 25
        shell: bash
        env:
          PHOTOSPHERE_SMOKE_SHARD: ${{ matrix.shard }}/4
        run: PHOTOSPHERE_SMOKE_BUILD="$(cygpath -m "$PWD/out/app")" PHOTOSPHERE_SMOKE_PSI="$(cygpath -m "$PWD/out/psi/bin/psi.exe")" bun run test:ziggy

      - name: Collect the logs of failed scenarios
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-smoke-logs"
          if [ -d "${TMPDIR:-/tmp}/photosphere-tests" ]; then
              cp -R "${TMPDIR:-/tmp}/photosphere-tests" "$RUNNER_TEMP/app-smoke-logs/"
          fi

      - name: Upload the logs of failed scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs-windows-${{ matrix.shard }}
          path: ${{ runner.temp }}/app-smoke-logs
          retention-days: 5

  cli-smoke-tests:
    timeout-minutes: 40
    needs: [build]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Install ffmpeg
        uses: ./.github/actions/install-ffmpeg-windows

      - name: Install ImageMagick
        uses: ./.github/actions/retry-install
        with:
          run: choco install imagemagick -y
          verify: magick|convert

      # Scenario 75 runs `zig build test-integration`, which links the libraries.
      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: windows-x64

      - name: Restore the Zig unit tests' build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: test-build-windows
          path: .

      - name: Unpack the build
        shell: bash
        run: tar -xf build.tar

      # In the drive-letter form, as the suite holds every path on Windows (see scripts/lib/test-lib.sh).
      - name: Run the Zig CLI smoke tests
        timeout-minutes: 30
        working-directory: ./apps/cli-zig
        shell: bash
        run: PHOTOSPHERE_SMOKE_PSI="$(cygpath -m "$PWD/../../out/psi/bin/psi.exe")" ./smoke-tests-zig.sh

      - name: Collect the logs of failed CLI smoke tests
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-smoke-logs"
          if [ -d "${TMPDIR:-/tmp}/photosphere-tests" ]; then
              cp -R "${TMPDIR:-/tmp}/photosphere-tests" "$RUNNER_TEMP/cli-smoke-logs/"
          fi

      - name: Upload the logs of failed CLI smoke tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-logs-windows
          path: ${{ runner.temp }}/cli-smoke-logs
          retention-days: 5

  # The unit tests of the Zig CLI and of every Zig package. After build only so that build is the one job that may build a library.
  zig-unit-tests:
    timeout-minutes: 40
    needs: [build]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Install ffmpeg
        uses: ./.github/actions/install-ffmpeg-windows

      - name: Install ImageMagick
        uses: ./.github/actions/retry-install
        with:
          run: choco install imagemagick -y
          verify: magick|convert

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: windows-x64

      - name: Cache Zig's build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      # The getImageDetails format test reads images from test/formats, which are made on the machine rather than committed.
      - name: Make the format test images
        shell: bash
        run: bash scripts/make-format-test-images.sh

      - name: Run the Zig unit tests
        timeout-minutes: 30
        shell: bash
        run: zig build test -Dcpu=baseline --summary all --test-timeout 20m
