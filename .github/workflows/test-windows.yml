# The tests on Windows, on every push and on demand, made to report as fast as possible. They run every test Release Windows runs, on
# builds in Debug, which compiles fastest, and unstamped: what ships is tested by the release workflow. app-build builds the Photosphere
# App and cli-build builds the Zig CLI, side by side, and the app smoke tests are split across runners, each running one shard of the
# scenarios on that app and CLI. The CLI smoke tests build their own CLI and the Zig unit tests start at once, so neither waits for a build.
#
# Each job restores the third-party libraries it links, and builds and stores any that no stored artifact has. When a library changes,
# more than one job builds it and stores it, which costs that one run time but keeps every other run from waiting on a job of its own.
name: Test Windows

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.6"

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

# A newer push to the same branch supersedes a run still going, so only the latest commit's results are waited for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app, for the MSVC ABI, which links the libraries built for it.
  app-build:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig and jq (versions from mise.toml)
        uses: ./.github/actions/setup-zig

      - name: Fetch the WebView2 SDK and the WiX Toolset
        shell: bash
        run: bun run --filter=ziggy setup

      - name: Restore the third-party libraries for the MSVC ABI
        uses: ./.github/actions/third-party-libraries
        with:
          platform: windows-x64
          build-args: -Dtarget=x86_64-windows-msvc

      # Worked out once here and used to restore and to save alike: computing it in both places gave two keys, because hashFiles is
      # not stable across a build. The build took 5.1 minutes when it ran, and every smoke shard waits for it.
      - name: Work out the app cache key
        id: app-key
        shell: bash
        run: echo "key=${{ runner.os }}-${{ runner.arch }}-test-built-app-${{ hashFiles('mise.toml', 'packages-zig/**/src/**', 'packages-zig/**/build.zig', 'packages-zig/*.zig', 'apps/cli-zig/src/**', 'apps/cli-zig/build.zig', 'build.zig', 'build.zig.zon', 'third-party/*/build.zig.zon', 'apps/photosphere-frontend/src/**', 'packages/**/src/**', 'apps/photosphere/native/windows/**', 'apps/photosphere/scripts/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the built app
        id: app-built
        uses: actions/cache/restore@v4
        with:
          path: out/app
          key: ${{ steps.app-key.outputs.key }}

      - name: Restore the app build's Zig build cache
        if: steps.app-built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-app-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-app-build-

      # The prefix is given in the drive-letter form, because the build script hands it to zig.
      - name: Build the app
        if: steps.app-built.outputs.cache-hit != 'true'
        shell: bash
        run: bun run --filter=ziggy build:windows -- --prefix "$(cygpath -m "$PWD/out/app")" --optimize Debug

      - name: Save the built app
        if: steps.app-built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/app
          key: ${{ steps.app-key.outputs.key }}

      - name: Save the app build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-app-build-${{ github.sha }}

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: test-app-windows
          path: out/app
          retention-days: 1
          compression-level: 1

  # The Zig CLI for the runner (x86_64-windows-gnu), which the app smoke tests' scenarios run.
  cli-build:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig and jq (versions from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: windows-x64

      - name: Restore the CLI build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-cli-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-cli-build-

      - name: Build the Zig CLI
        shell: bash
        run: zig build -Dcpu=baseline -Doptimize=Debug --prefix out/psi

      - name: Save the CLI build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-cli-build-${{ github.sha }}

      - name: Upload the Zig CLI
        uses: actions/upload-artifact@v4
        with:
          name: test-psi-windows
          path: out/psi
          retention-days: 1
          compression-level: 1

  # One shard of the app smoke tests per runner.
  app-smoke-tests:
    timeout-minutes: 30
    needs: [app-build, cli-build]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig and jq (versions from mise.toml)
        uses: ./.github/actions/setup-zig-tools

      # The scenarios build their database fixtures with the CLI, which needs ImageMagick and ffmpeg.
      - name: Install ffmpeg
        uses: ./.github/actions/install-ffmpeg-windows

      - name: Install ImageMagick
        uses: ./.github/actions/retry-install
        with:
          run: choco install imagemagick -y
          verify: magick|convert

      # Retried: it downloads the WebView2 SDK, and one shard's download failed with a 502 from the server in a passing run's set.
      - name: Fetch the WebView2 SDK and the WiX Toolset
        uses: ./.github/actions/retry-install
        with:
          run: bun run --filter=ziggy setup

      - name: Download the app
        uses: actions/download-artifact@v4
        with:
          name: test-app-windows
          path: out/app

      - name: Download the Zig CLI
        uses: actions/download-artifact@v4
        with:
          name: test-psi-windows
          path: out/psi

      # The paths are given in the drive-letter form, which both Git Bash and the native Windows programs the runner starts accept.
      - name: Run shard ${{ matrix.shard }} of the Photosphere App smoke tests
        timeout-minutes: 12
        shell: bash
        env:
          PHOTOSPHERE_SMOKE_SHARD: ${{ matrix.shard }}/8
        run: PHOTOSPHERE_SMOKE_BUILD="$(cygpath -m "$PWD/out/app")" PHOTOSPHERE_SMOKE_PSI="$(cygpath -m "$PWD/out/psi/bin/psi.exe")" bun run test:ziggy

      - name: Collect the logs of failed scenarios
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-smoke-logs"
          if [ -d "${TMPDIR:-/tmp}/photosphere-tests" ]; then
              cp -R "${TMPDIR:-/tmp}/photosphere-tests" "$RUNNER_TEMP/app-smoke-logs/"
          fi

      - name: Upload the logs of failed scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs-windows-${{ matrix.shard }}
          path: ${{ runner.temp }}/app-smoke-logs
          retention-days: 5

  # Builds its own CLI rather than waiting for cli-build, which takes about as long as the wait would.
  cli-smoke-tests:
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Node.js as the release workflow's CLI smoke job has it, so this job runs what that one runs.
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      # This job builds psi for its own smoke tests, so it resolves the packages Zig needs.
      - name: Setup Zig and jq (versions from mise.toml)
        uses: ./.github/actions/setup-zig

      - name: Install ffmpeg
        uses: ./.github/actions/install-ffmpeg-windows

      - name: Install ImageMagick
        uses: ./.github/actions/retry-install
        with:
          run: choco install imagemagick -y
          verify: magick|convert

      # Scenario 75 runs `zig build test-integration`, which links the libraries.
      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: windows-x64

      # The unit tests' cache for scenario 75's `zig build test-integration`, with the CLI build's laid over it.
      - name: Restore the Zig unit tests' build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-packages-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-packages-

      - name: Restore the CLI build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-cli-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-debug-cli-build-

      # Built here rather than waiting for cli-build, which takes about as long as the wait would.
      - name: Build the Zig CLI
        shell: bash
        run: zig build -Dcpu=baseline -Doptimize=Debug --prefix out/psi

      # In the drive-letter form, as the suite holds every path on Windows (see scripts/lib/test-lib.sh).
      - name: Run the Zig CLI smoke tests
        timeout-minutes: 30
        working-directory: ./apps/cli-zig
        shell: bash
        run: PHOTOSPHERE_SMOKE_PSI="$(cygpath -m "$PWD/../../out/psi/bin/psi.exe")" ./smoke-tests-zig.sh

      - name: Test the Zig version command
        shell: bash
        run: out/psi/bin/psi.exe version

      - name: Collect the logs of failed CLI smoke tests
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-smoke-logs"
          if [ -d "${TMPDIR:-/tmp}/photosphere-tests" ]; then
              cp -R "${TMPDIR:-/tmp}/photosphere-tests" "$RUNNER_TEMP/cli-smoke-logs/"
          fi

      - name: Upload the logs of failed CLI smoke tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-logs-windows
          path: ${{ runner.temp }}/cli-smoke-logs
          retention-days: 5

  # The unit tests of every Zig package and the tests of the Zig CLI, the two halves of `zig build test`, one a runner: each compiles a
  # test program of its own, and one after the other the two compiles and runs took 13.7 minutes, the longest job of the workflow.
  zig-unit-tests:
    timeout-minutes: 40
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        part: [packages, cli]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No Bun or Node.js: the Zig tests use neither, and restoring the Bun cache alone took a minute here.
      - name: Setup Zig and jq (versions from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Install ffmpeg
        uses: ./.github/actions/install-ffmpeg-windows

      - name: Install ImageMagick
        uses: ./.github/actions/retry-install
        with:
          run: choco install imagemagick -y
          verify: magick|convert

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: windows-x64

      - name: Cache Zig's build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-${{ matrix.part }}-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-${{ matrix.part }}-

      # The getImageDetails format test reads images from test/formats, which are made on the machine rather than committed.
      - name: Make the format test images
        shell: bash
        run: bash scripts/make-format-test-images.sh

      - name: Run the Zig tests (${{ matrix.part }})
        timeout-minutes: 30
        shell: bash
        run: zig build test-${{ matrix.part }} -Dcpu=baseline --summary all --test-timeout 20m
