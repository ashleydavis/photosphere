name: Ziggy example

# Builds, tests and packages the Ziggy example on every platform. It is a workflow of its own and has nothing to do with the
# release: it creates no tag and no release, and uploads its packages as artifacts of the run.

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.5"

on:
  push:
    branches:
      - "*"
    paths:
      - "apps/ziggy-example/**"
      - "packages/ziggy/**"
      - ".github/workflows/ziggy-example.yml"

  pull_request:
    branches:
      - main
    paths:
      - "apps/ziggy-example/**"
      - "packages/ziggy/**"
      - ".github/workflows/ziggy-example.yml"

  workflow_dispatch:

jobs:
  ziggy-example-zig-build:
    # Builds Ziggy's Zig code and the example's, and cross-builds them for every other platform, on each platform. This
    # follows build-zig-linux-x64 and its siblings in release.yml, and is a job of its own so a change to Ziggy cannot reach
    # one platform without the example being built for all of them.
    # Setup takes about 5 minutes and a cold build up to 20.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Build and cross-build the Zig code
        shell: bash
        run: bun run compile:zig

  ziggy-example-zig-unit-tests:
    # The unit tests of Ziggy's Zig code and of the example's, on each platform, because the behaviour of a test that runs
    # against the system web view differs between them. A job of its own, as zig-unit-tests is in release.yml, so a red unit
    # test is not reported as a red build or a red smoke test. The desktop platforms run the tests on the runner. Android runs
    # the test programs on an emulator and iOS on a simulator, because a program built for a phone cannot run on the runner.
    # Setup takes about 5 minutes and a cold unit test build up to 25.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      # The Linux shell links GTK and WebKitGTK by their runtime library files, and its build stops with "error:
      # RuntimeLibraryMissing" when they are not installed. The ubuntu-latest run of the unit tests failed with that error
      # because nothing here installed them.
      - name: Install the web view's runtime libraries (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run the Zig unit tests
        if: matrix.platform == 'linux' || matrix.platform == 'macos' || matrix.platform == 'windows'
        shell: bash
        run: bun run test:zig

      # The Android scripts need JDK 17, as in the android jobs of release.yml, and the NDK those jobs install.
      - name: Setup JDK 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK (Android)
        if: matrix.platform == 'android'
        uses: ./.github/actions/retry-install
        with:
          run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" > /dev/null

      - name: Enable KVM (Android)
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The script is one line, because this action runs each line of `script:` in a shell of its own, as the note on the
      # Android smoke test job in release.yml says. PHOTOSPHERE_ANDROID_DEVICES names the emulator, because the script only
      # picks an emulator of the repository's pool, a plugged-in device, or the one named here.
      - name: Run the Zig unit tests on an emulator (Android)
        if: matrix.platform == 'android'
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PHOTOSPHERE_ANDROID_DEVICES: emulator-5554
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bun run --filter=ziggy-example test:zig:android

      # The script runs the programs on a booted simulator and fails when none is, so one is booted here.
      - name: Boot an iOS simulator (iOS)
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          udid="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Run the Zig unit tests on a simulator (iOS)
        if: matrix.platform == 'ios'
        run: bun run --filter=ziggy-example test:zig:ios

  ziggy-example-smoke-tests:
    # The example's smoke tests on each desktop platform, as zig-smoke-tests is in release.yml: Linux on a virtual
    # display, Windows with the WebView2 SDK, and MacOS on the runner's own display.
    # Setup takes about 5 minutes and a cold run of the smoke tests up to 30.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Install the web view's runtime libraries and the display tools (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 gstreamer1.0-plugins-good gstreamer1.0-libav xvfb x11-utils zip
          verify: xvfb-run xwininfo zip

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Fetch the WebView2 SDK and the WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bun run --filter=ziggy-example setup

      - name: Run the smoke tests
        # Windows runs of this step have twice ended with "The hosted runner lost communication with the server" after
        # about 50 minutes (runs 37479157077 and 37488241174), and GitHub keeps no log for a job it loses, so nothing
        # shows where the step was. A passing run takes about 10 minutes. A step that hits its own timeout fails
        # normally and keeps its log, so a hang shows up in the log instead of vanishing with the runner.
        timeout-minutes: 30
        shell: bash
        run: bun run test:ziggy-example

  ziggy-example-package:
    # Packages the example for every platform, as build-linux, build-windows, build-macos-arm64 and the mobile builds do in
    # release.yml, and uploads the packages as artifacts of the run. The iOS archive is built without signing, and the
    # Android APKs with the SDK and NDK. Both are built and not run: running them needs a simulator or an emulator.
    # Setup takes about 5 minutes and a cold package build up to 40.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: ios
            os: macos-latest
          - platform: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Install the packaging tools (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 zip
          verify: zip

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Fetch the WebView2 SDK and the WiX Toolset (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: bun run --filter=ziggy-example setup

      - name: Set up the Android SDK and NDK (Android)
        if: matrix.platform == 'android'
        run: bun run --filter=ziggy-example setup

      - name: Package
        shell: bash
        run: bun run package:ziggy-example:${{ matrix.platform }}

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: ziggy-example-${{ matrix.platform }}
          path: apps/ziggy-example/out/${{ matrix.platform }}/*
