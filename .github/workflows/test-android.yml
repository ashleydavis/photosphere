# The tests on Android, on every push and on demand. They run every test Release Android runs, minus packaging and publishing: each
# third-party library (the AWS SDK for C, zlib-ng, ImageMagick and FFmpeg) has its own job that builds and stores it, side by side,
# then app-build builds the app's APK over those libraries, app-smoke-tests runs it, zig-unit-tests runs the Zig unit tests and the
# TypeScript jobs compile and test the TypeScript.
name: Test Android

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.6"

on:
  # Every push is tested. A release is made by its own workflow, when its tag is pushed or when it is started by hand.
  push:
    branches:
      - "**"

  workflow_dispatch:

jobs:

  # The third-party libraries, each built once by its own action and stored as an artifact, so a library an earlier run (or another workflow) has
  # already built is restored rather than compiled again. Each is built for both Android architectures the app ships, and for the
  # runner, which the CLI that makes the smoke tests' fixtures builds for. Every job that runs the Zig build restores them from those
  # artifacts with the third-party-libraries action.
  build-aws-sdk:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      - name: Build the AWS SDK for C for the runner
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: linux-x64

      - name: Build the AWS SDK for C for Android x86_64
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: android
          build-args: -Dtarget=x86_64-linux-android --libc ../../tmp/android-libc/x86_64.txt

      - name: Build the AWS SDK for C for Android arm64
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: android
          build-args: -Dtarget=aarch64-linux-android --libc ../../tmp/android-libc/arm64.txt

  build-zlib-ng:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      - name: Build zlib-ng for the runner
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: linux-x64

      - name: Build zlib-ng for Android x86_64
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: android
          build-args: -Dtarget=x86_64-linux-android --libc ../../tmp/android-libc/x86_64.txt

      - name: Build zlib-ng for Android arm64
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: android
          build-args: -Dtarget=aarch64-linux-android --libc ../../tmp/android-libc/arm64.txt

  build-imagemagick:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      - name: Build ImageMagick for the runner
        uses: ./.github/actions/build-imagemagick
        with:
          platform: linux-x64

      - name: Build ImageMagick for Android x86_64
        uses: ./.github/actions/build-imagemagick
        with:
          platform: android
          build-args: -Dtarget=x86_64-linux-android --libc ../../tmp/android-libc/x86_64.txt

      - name: Build ImageMagick for Android arm64
        uses: ./.github/actions/build-imagemagick
        with:
          platform: android
          build-args: -Dtarget=aarch64-linux-android --libc ../../tmp/android-libc/arm64.txt

  build-ffmpeg:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      - name: Build FFmpeg for the runner
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: linux-x64

      - name: Build FFmpeg for Android x86_64
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: android
          build-args: -Dtarget=x86_64-linux-android --libc ../../tmp/android-libc/x86_64.txt

      - name: Build FFmpeg for Android arm64
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: android
          build-args: -Dtarget=aarch64-linux-android --libc ../../tmp/android-libc/arm64.txt

  # Restores the third-party libraries the library jobs built and builds the Photosphere App for Android by the same build script
  # a developer runs: a debug-type APK of the release library for both Android architectures, which is what the smoke tests need,
  # because their scenarios seed and read the app's data through run-as.
  # The library jobs build each library for both Android architectures the app ships, and for the
  # runner, which the CLI that makes the smoke tests' fixtures builds for, and this job restores them from
  # their artifacts. The APK, the Zig build cache and the libraries are saved
  # under photosphere-app-android-<commit>-<run>, which app-smoke-tests restores.
  app-build:
    timeout-minutes: 150
    needs: [build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      - name: Restore the third-party libraries for the runner
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      - name: Restore the third-party libraries for Android x86_64
        uses: ./.github/actions/third-party-libraries
        with:
          platform: android
          build-args: -Dtarget=x86_64-linux-android --libc ../../tmp/android-libc/x86_64.txt

      - name: Restore the third-party libraries for Android arm64
        uses: ./.github/actions/third-party-libraries
        with:
          platform: android
          build-args: -Dtarget=aarch64-linux-android --libc ../../tmp/android-libc/arm64.txt

      # The finished app, keyed on everything it is built from, so a commit that changes only the tests pays no build. An exact
      # match only, so nothing is restored for a commit whose Zig code, page, libraries or native sources differ. Worked out once
      # here and used to restore and to save alike: computing it in both places gave two keys, because hashFiles is not stable
      # across a build.
      - name: Work out the built-app cache key
        id: built-key
        shell: bash
        run: echo "key=${{ runner.os }}-${{ runner.arch }}-test-built-app-android-${{ hashFiles('mise.toml', 'packages-zig/**/src/**', 'packages-zig/**/build.zig', 'packages-zig/*.zig', 'apps/cli-zig/src/**', 'apps/cli-zig/build.zig', 'build.zig', 'build.zig.zon', 'third-party/*/build.zig.zon', 'apps/photosphere-frontend/src/**', 'packages/**/src/**', 'apps/photosphere/native/android/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the built app
        id: built
        uses: actions/cache/restore@v4
        with:
          path: out/app
          key: ${{ steps.built-key.outputs.key }}

      # The app build's Zig build cache, restored from the latest run that saved one for this platform, so the build
      # compiles only what changed instead of the whole app. Saved again after the build, as the CLI build does.
      - name: Restore the app build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-app-build-android-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-app-build-android-

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # The APK is copied to out/app/photosphere.apk, laid out as apps/photosphere-smoke-tests/run.md describes, which is where the
      # smoke tests take it from.
      - name: Build (Android)
        if: steps.built.outputs.cache-hit != 'true'
        shell: bash
        # The page is minified as the release's is, so the release APKs are made from the Zig libraries built here rather
        # than compiling them again.
        run: bun run --filter=ziggy build:android -- --minify --output-dir "$PWD/out/app"

      - name: Save the built app
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/app
          key: ${{ steps.built-key.outputs.key }}

      - name: Save the app build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-app-build-android-${{ github.sha }}

      - name: Save the Photosphere App build
        uses: actions/cache/save@v4
        with:
          path: |
            out/app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-android-${{ github.sha }}-${{ github.run_id }}

  app-smoke-tests:
    # The Photosphere App's smoke tests on an Android emulator. The emulator has no host LAN bridge, so PHOTOSPHERE_NO_LAN_BRIDGE
    # makes the scenarios that need one skip with a logged SKIP line.
    #
    # The app is the debug-type APK app-build built, which PHOTOSPHERE_SMOKE_BUILD names: the scenarios seed and read the app's data
    # through run-as, which needs a debuggable APK, and the release APK is not one. The CLI that makes the scenarios' fixtures is
    # built over app-build's Zig build cache and libraries, restored below.
    timeout-minutes: 90
    needs: [app-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The scenarios build their database fixtures with the CLI from source, which needs ImageMagick and ffmpeg.
      - name: Install media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg
          verify: magick|convert ffmpeg ffprobe

      # The runner comes with NDKs the app does not use, and with them, the NDK it does and the system image installed, too little
      # disk is left for the emulator's userdata partition: it stops at once with "Not enough space to create userdata partition".
      - name: Uninstall the NDKs the app does not use (Android)
        run: |
          unused=()
          for ndk_dir in "$ANDROID_HOME"/ndk/*; do
              if [ -d "$ndk_dir" ] && [ "$(basename "$ndk_dir")" != "25.1.8937393" ]; then
                  unused+=("ndk;$(basename "$ndk_dir")")
              fi
          done
          if [ "${#unused[@]}" -gt 0 ]; then
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --uninstall "${unused[@]}"
          fi
          df -h /

      - name: Set up the Android C library
        uses: ./.github/actions/android-libc

      # The CLI that makes the scenarios' fixtures is built for the runner, and the app for the emulator. app-build saved the
      # libraries for both.
      - name: Restore the Photosphere App build
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-android-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      # Allow the hardware-accelerated emulator to use KVM on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator runner below downloads this system image once, with no retry, and a download can arrive corrupt:
      # an Android smoke job failed with "Error on ZipFile unknown archive" while it prepared the Google APIs Intel x86_64
      # Atom System Image, before any test ran. Installing it here, retried, leaves the runner an image that is already
      # installed. The licence step ends in "|| true" because `yes` is killed when sdkmanager stops reading, which
      # fails a pipeline under pipefail. sdkmanager is called by its full path because a plain step does not have it on PATH
      # ("sdkmanager: command not found", exit 127).
      - name: Install the Android system image
        uses: ./.github/actions/retry-install
        with:
          run: |
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-35;google_apis;x86_64'

      - name: Run the Photosphere App Android smoke tests
        timeout-minutes: 75
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PHOTOSPHERE_NO_LAN_BRIDGE: "1"
          PHOTOSPHERE_SMOKE_BUILD: ${{ github.workspace }}/out/app
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # The image's default userdata partition is 7.4 GB, more than some runners have free, and the emulator then fails to start.
          # A local emulator in daily use holds 1.9 GB of data.
          disk-size: 4096M
          # Emulator 36.6.11, the build the local emulator scripts pin (EMULATOR_BUILD in scripts/android/emulator-config.sh,
          # which says why): the newest emulator never gives back the memory of an app it has stopped, and this suite starts the app
          # many times.
          emulator-build: 15507667
          # The action's default options with `-gpu swangle_indirect` in place of its `-gpu swiftshader_indirect`, which is what the
          # local pool's emulators use (scripts/android/emulator.sh). Under swiftshader_indirect the emulator crashes when Chromium on
          # the guest plays video: scenario 21-import-video opens a video, and the emulator vanished during it ("device
          # 'emulator-5554' not found"), failing every scenario after it.
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          # One line: the action runs each line of `script:` as its own shell, so only a single line's exit status reaches the job.
          script: bun run test:ziggy:and

      # A failed scenario keeps its directory, which holds the app's log, the device's log and the core's own log. Without this upload
      # a failure that did not happen again left nothing to diagnose it from once the runner had gone.
      - name: Collect the logs of failed scenarios
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-smoke-logs"
          if [ -d "${TMPDIR:-/tmp}/photosphere-tests" ]; then
              cp -R "${TMPDIR:-/tmp}/photosphere-tests" "$RUNNER_TEMP/app-smoke-logs/"
          fi

      - name: Upload the logs of failed scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs-android
          path: ${{ runner.temp }}/app-smoke-logs
          retention-days: 5

  # Compiles the TypeScript, which is the only check of its types: the unit tests run it without checking them.
  typescript-compile:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # bun run compile records a what-changed baseline when it succeeds.
      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Compile TypeScript
        timeout-minutes: 12
        run: bun run compile

  # The TypeScript unit tests.
  typescript-unit-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run unit tests
        timeout-minutes: 12
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

  # The unit tests of the Zig CLI and of every Zig package, on this workflow's runner, over the libraries the library jobs built for it
  # and the Zig build cache app-build saved.
  zig-unit-tests:
    timeout-minutes: 50
    needs: [build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg, app-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      # The libraries for the runner, which the tests build for, restored from their artifacts.
      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      # Zig skips any compile step whose inputs are unchanged and already in .zig-cache. Without this the test binaries and psi are
      # compiled from nothing every run, which is most of this job's time. The key changes with any Zig source, and the newest
      # earlier cache is restored when there is no exact match, so only the binaries a change touches are compiled again.
      # The next step lays app-build's cache over it.
      - name: Cache Zig's build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      # The build app-build saved, with its Zig build cache and libraries, laid over the test build's own cache, so Zig reuses any
      # compile step the two builds have in common. The paths are the ones app-build saved, which a restore has to name exactly.
      - name: Restore the app build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-android-${{ github.sha }}-${{ github.run_id }}

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # The getImageDetails format test reads images from test/formats, which are made on the machine rather than committed.
      - name: Make the format test images
        shell: bash
        run: bash scripts/make-format-test-images.sh

      # Built for any CPU of the architecture, so the compile steps match the restored build caches whatever CPU the runner has.
      - name: Run the Zig unit tests
        timeout-minutes: 40
        shell: bash
        run: zig build test -Dcpu=baseline --summary all --test-timeout 20m

