# The tests on Android, on every push and on demand, made to report as fast as possible. They test what Release Android tests and build
# what it builds, as it builds it, and publish nothing (Release Android's packaging is switched off). build builds the Photosphere App
# as Release Android does and the Zig CLI for the runner, which makes the scenarios' fixtures, and uploads both. The app smoke tests are
# split across runners, each running one shard of the scenarios on its own emulator. The Zig unit tests are not run here: Release
# Android runs them with the same command on the same Linux runner as Test Linux does.
name: Test Android

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

# A newer push to the same branch supersedes a run still going, so only the latest commit's results are waited for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # Only the NDK and the libc files, not the android-libc action: its SDK setup also installs the emulator and a system image,
      # which this job never runs and which took 2.7 of its 3.4 minutes. The runner's SDK has the platform and build tools Gradle needs.
      - name: Restore the Android NDK
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: ${{ runner.os }}-android-ndk-25.1.8937393

      - name: Install the Android NDK when the cache has none
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/25.1.8937393" ]; then
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;25.1.8937393'
          fi

      - name: Write the libc files
        shell: bash
        run: |
          set -euo pipefail
          source apps/photosphere/scripts/android-common.sh
          mkdir -p tmp/android-libc
          for arch in x86_64 arm64; do
              photosphere_android_write_libc_file "$arch" "tmp/android-libc/$arch.txt" "$(photosphere_android_min_sdk)"
          done

      - name: Restore the third-party libraries for the runner
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      - name: Restore the third-party libraries for Android x86_64
        uses: ./.github/actions/third-party-libraries
        with:
          platform: android
          build-args: -Dtarget=x86_64-linux-android --libc ../../tmp/android-libc/x86_64.txt

      - name: Restore the third-party libraries for Android arm64
        uses: ./.github/actions/third-party-libraries
        with:
          platform: android
          build-args: -Dtarget=aarch64-linux-android --libc ../../tmp/android-libc/arm64.txt

      - name: Set config
        shell: bash
        run: bash ./scripts/set-build-config.sh --commit "${{ github.sha }}"

      - name: Restore the build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-release-build-android-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-release-build-android-

      # As Release Android builds it: the debug-type APK the scenarios need (they seed and read the app's data through run-as) of the
      # ReleaseSafe library for both architectures the app ships, with the page minified. The APK is copied to out/app/photosphere.apk,
      # where the smoke tests take it from.
      - name: Build the app
        shell: bash
        run: bun run --filter=ziggy build:android -- --minify --output-dir "$PWD/out/app"

      - name: Build the Zig CLI
        shell: bash
        run: zig build -Dcpu=baseline --prefix out/psi

      - name: Save the build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-release-build-android-${{ github.sha }}

      - name: Pack the build
        shell: bash
        run: tar -cf "$RUNNER_TEMP/build.tar" out/app/photosphere.apk out/psi

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: test-build-android
          path: ${{ runner.temp }}/build.tar
          retention-days: 1
          compression-level: 1

  # One shard of the app smoke tests per runner, each on its own emulator. The emulator has no host LAN bridge, so
  # PHOTOSPHERE_NO_LAN_BRIDGE makes the scenarios that need one skip with a logged SKIP line.
  app-smoke-tests:
    timeout-minutes: 40
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # The scenarios build their database fixtures with the CLI, which needs ImageMagick and ffmpeg.
      - name: Install media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg
          verify: magick|convert ffmpeg ffprobe

      # The runner comes with NDKs the app does not use, and with them and the system image installed, too little disk is left for
      # the emulator's userdata partition: it stops at once with "Not enough space to create userdata partition".
      - name: Uninstall the NDKs the app does not use
        run: |
          unused=()
          for ndk_dir in "$ANDROID_HOME"/ndk/*; do
              if [ -d "$ndk_dir" ] && [ "$(basename "$ndk_dir")" != "25.1.8937393" ]; then
                  unused+=("ndk;$(basename "$ndk_dir")")
              fi
          done
          if [ "${#unused[@]}" -gt 0 ]; then
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --uninstall "${unused[@]}"
          fi
          df -h /

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: test-build-android
          path: ${{ runner.temp }}

      - name: Unpack the build
        shell: bash
        run: tar -xf "$RUNNER_TEMP/build.tar"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installed here, retried, because the emulator runner downloads it once with no retry and a download can arrive corrupt.
      - name: Install the Android system image
        uses: ./.github/actions/retry-install
        with:
          run: |
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-35;google_apis;x86_64'

      # The emulator options are the release workflow's: emulator 36.6.11 and `-gpu swangle_indirect`, for the reasons it gives.
      - name: Run shard ${{ matrix.shard }} of the Photosphere App Android smoke tests
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PHOTOSPHERE_NO_LAN_BRIDGE: "1"
          PHOTOSPHERE_SMOKE_BUILD: ${{ github.workspace }}/out/app
          PHOTOSPHERE_SMOKE_PSI: ${{ github.workspace }}/out/psi/bin/psi
          PHOTOSPHERE_SMOKE_SHARD: ${{ matrix.shard }}/4
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          emulator-build: 15507667
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          script: bun run test:ziggy:and

      - name: Collect the logs of failed scenarios
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-smoke-logs"
          if [ -d "${TMPDIR:-/tmp}/photosphere-tests" ]; then
              cp -R "${TMPDIR:-/tmp}/photosphere-tests" "$RUNNER_TEMP/app-smoke-logs/"
          fi

      - name: Upload the logs of failed scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs-android-${{ matrix.shard }}
          path: ${{ runner.temp }}/app-smoke-logs
          retention-days: 5
