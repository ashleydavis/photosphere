  package-photosphere:
    # The Photosphere App packaged for each desktop platform, unsigned, by the same package scripts a developer runs. The
    # version comes from the release tag: v1.2.3 is 1.2.3 and a nightly is dev-nightly.<timestamp>.
    # Windows needs the WebView2 SDK and the WiX Toolset, which the setup step fetches. The Zig build restores the AWS SDK for C
    # that build-aws-sdk compiled, so it is not compiled again here.
    timeout-minutes: 75
    needs: [prepare-tag, build-aws-sdk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            package: package:linux
            arguments: ""
          - name: windows
            os: windows-latest
            package: package:windows
            arguments: "x64"
          # Windows, macOS and iOS are not needed yet, and these failed in Release Zig run 39123959376.
          # - name: macos-arm64
          #   os: macos-latest
          #   package: package:macos
          #   arguments: ""
          # - name: macos-x64
          #   os: macos-15-intel
          #   package: package:macos
          #   arguments: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/zig/p' || '~/.cache/zig/p' }}
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The Linux shell links the runtime libraries by file name, so no development packages are needed. WebKitGTK plays video
      # through GStreamer, so the packaged app depends on those plugins.
      - name: Install the build and packaging tools (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 libgdk-pixbuf-2.0-0 gstreamer1.0-plugins-good gstreamer1.0-libav zip
          verify: zip

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Fetch the WebView2 SDK and the WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bun run --filter=ziggy setup

      # The same cache zig-cli-smoke-tests restores, written by build-aws-sdk, so the AWS SDK for C is not compiled from cold.
      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#v}"
            VERSION="$(bash ./scripts/set-build-config.sh --tag "$VERSION" --commit "${{ github.sha }}")"
          else
            VERSION="$(bash ./scripts/set-build-config.sh --commit "${{ github.sha }}")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Package
        shell: bash
        run: bun run --filter=ziggy ${{ matrix.package }} -- ${{ matrix.arguments }} --version "$VERSION"

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-app-${{ matrix.name }}
          path: apps/photosphere/out/${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}/*
          if-no-files-found: error
          retention-days: 2

  package-photosphere-mobile:
    # The Photosphere App packaged for Android and iOS, unsigned, by the same package scripts a developer runs. The version
    # comes from the release tag, as in package-photosphere. The Android version code, which has to rise with every build that
    # replaces another, is the build time in minutes since the epoch. The iOS archive is made by xcodebuild with code signing
    # off, and only its .ipa is attached to the release, because an .xcarchive is a folder. Both are built and not run:
    # running them needs an emulator or a simulator, which the smoke test jobs and the local test runs provide.
    timeout-minutes: 90
    needs: [prepare-tag, build-aws-sdk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            os: ubuntu-latest
            files: "*.apk"
          # Windows, macOS and iOS are not needed yet, and these failed in Release Zig run 39123959376.
          # - name: ios
          #   os: macos-15
          #   files: "*.ipa"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Cache the Android NDK
        if: matrix.name == 'android'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: ${{ runner.os }}-android-ndk-25.1.8937393

      # Retried because the SDK manager downloads from Google and a download can arrive corrupt.
      - name: Set up the Android SDK and NDK (Android)
        if: matrix.name == 'android'
        uses: ./.github/actions/retry-install
        with:
          run: bun run --filter=ziggy setup:android

      - name: Check the iOS toolchain (iOS)
        if: matrix.name == 'ios'
        run: bun run --filter=ziggy setup:ios

      # The same cache zig-cli-smoke-tests restores, written by build-aws-sdk, so the AWS SDK for C is not compiled from cold.
      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#v}"
            VERSION="$(bash ./scripts/set-build-config.sh --tag "$VERSION" --commit "${{ github.sha }}")"
          else
            VERSION="$(bash ./scripts/set-build-config.sh --commit "${{ github.sha }}")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Package (Android)
        if: matrix.name == 'android'
        shell: bash
        run: bun run --filter=ziggy package:android -- --version-name "$VERSION" --version-code "$(( $(date +%s) / 60 ))"

      - name: Package (iOS)
        if: matrix.name == 'ios'
        shell: bash
        run: bun run --filter=ziggy package:ios -- --version "$VERSION"

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-app-${{ matrix.name }}
          path: apps/photosphere/out/${{ matrix.name }}/${{ matrix.files }}
          if-no-files-found: error
          retention-days: 2

  create-release:
    timeout-minutes: 20
    needs: [prepare-tag, unit-tests, build-aws-sdk, build-zig-linux-x64, build-zig-windows-x64, build-zig-macos-arm64, build-zig-macos-x64, zig-unit-tests, zig-cli-smoke-tests, photosphere-desktop-smoke-tests, photosphere-android-smoke-tests, package-photosphere, package-photosphere-mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the Photosphere App packages
        uses: actions/download-artifact@v4
        with:
          pattern: photosphere-app-*
          path: ./artifacts/app
          merge-multiple: true

      - name: Download the Zig CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: photosphere-cli-zig-*
          path: ./artifacts/zig
          merge-multiple: true

      - name: Create compressed archives
        run: |
          # The Zig CLI, one archive per platform, with the binary named after the platform it is for.
          cd ./artifacts/zig
          # Every binary the build jobs upload, listed here: a name that is missing or misspelled fails
          # the step with this message rather than with chmod's, which says nothing about what is wrong.
          for binary in photosphere-cli-zig-linux-x64 photosphere-cli-zig-windows-x64 \
                       photosphere-cli-zig-macos-x64 photosphere-cli-zig-macos-arm64; do
              if [ ! -f "$binary" ]; then
                  echo "::error::The Zig build jobs did not produce $binary. Uploaded: $(ls)"
                  exit 1
              fi
          done
          chmod +x photosphere-cli-zig-linux-x64 photosphere-cli-zig-windows-x64 photosphere-cli-zig-macos-x64 photosphere-cli-zig-macos-arm64
          tar -czf ../photosphere-cli-zig-linux-x64.tar.gz photosphere-cli-zig-linux-x64
          tar -czf ../photosphere-cli-zig-macos-x64.tar.gz photosphere-cli-zig-macos-x64
          tar -czf ../photosphere-cli-zig-macos-arm64.tar.gz photosphere-cli-zig-macos-arm64
          cp photosphere-cli-zig-windows-x64 photosphere-cli-zig-windows-x64.exe
          zip ../photosphere-cli-zig-windows-x64.zip photosphere-cli-zig-windows-x64.exe
          cd ../..

      - name: Generate release notes
        id: release-notes
        run: |
          # The CLI commits made since the last release tag, as bullets. The same script produces the
          # notes for the Android tester builds, so a release and a tester build never describe the
          # same commits differently. The tag being built is excluded so a tagged release measures
          # from the tag before it; for a nightly the tag is empty and nothing is excluded.
          RELEASE_NOTES=$(bash ./scripts/release-notes.sh \
            --prefix cli \
            --exclude-tag "${{ needs.prepare-tag.outputs.tag }}" \
            --empty-message "- No CLI-related commits found")

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Generated release notes:"
          echo "$RELEASE_NOTES"

      - name: Delete existing nightly release
        if: needs.prepare-tag.outputs.is-release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete zig-nightly --yes --cleanup-tag || true
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-tag.outputs.is-release == 'true' && format('zig-{0}', needs.prepare-tag.outputs.tag) || 'zig-nightly' }}
          # The zig- tag does not exist yet, so the release creates it. Without this it would be created on the default branch rather than on the commit that was built.
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare-tag.outputs.is-release == 'true' && format('Photosphere Zig {0}', needs.prepare-tag.outputs.tag) || 'Photosphere Zig Nightly' }}
          draft: false
          prerelease: ${{ needs.prepare-tag.outputs.is-release != 'true' }}
          files: |
            ./artifacts/photosphere-cli-zig-linux-x64.tar.gz
            ./artifacts/photosphere-cli-zig-windows-x64.zip
            ./artifacts/photosphere-cli-zig-macos-x64.tar.gz
            ./artifacts/photosphere-cli-zig-macos-arm64.tar.gz
            ./artifacts/app/*
          body: |
            ${{ needs.prepare-tag.outputs.is-release == 'true' && format('Photosphere Zig release {0}', needs.prepare-tag.outputs.tag) || format('Photosphere Zig nightly build - {0}', github.sha) }}

            ${{ needs.prepare-tag.outputs.is-release != 'true' && '⚠️ **This is a nightly build and may be unstable**' || '' }}
            ${{ needs.prepare-tag.outputs.is-release != 'true' && format('Built from commit: {0}', github.sha) || '' }}

            ## What's Changed
            ${{ steps.release-notes.outputs.RELEASE_NOTES }}

            ## CLI Download
            - **Linux**: `photosphere-cli-zig-linux-x64.tar.gz`
            - **Windows**: `photosphere-cli-zig-windows-x64.zip`
            - **macOS (Intel)**: `photosphere-cli-zig-macos-x64.tar.gz`
            - **macOS (Apple Silicon)**: `photosphere-cli-zig-macos-arm64.tar.gz`

            ## CLI Installation
            1. Download the appropriate file for your platform
            2. Extract the archive
            3. Make the binary executable (Linux/macOS): `chmod +x photosphere-cli-zig-<platform>`
            4. Move to your PATH or run directly

            ## Desktop Download
            - **Linux**: `.deb` package or `.zip`
            - **Windows**: `.exe` installer or `.zip`
            - **macOS**: `.dmg` disk image or `.zip`

            ## Bundled tools and licences
            The mobile apps bundle in-process builds of ImageMagick (ImageMagick licence, an Apache-2.0-style licence) and ffmpeg (LGPL-2.1+), along with ImageMagick's libjpeg, libpng, and zlib delegates. The desktop and CLI builds use ImageMagick and ffmpeg installed on the host system. Full attribution and licences are in [THIRD-PARTY-NOTICES.md](https://github.com/ashleydavis/photosphere/blob/main/THIRD-PARTY-NOTICES.md).
