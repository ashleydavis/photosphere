name: Release Zig

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.5"

on:
  push:
    branches:
      - "*"
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release:
        description: "Release action. none = nightly build. update-latest = move the latest v*.*.* tag to this commit and re-release it. new-patch = create the next patch tag (e.g. v0.0.8 -> v0.0.9) and release it."
        type: choice
        options:
          - none
          - update-latest
          - new-patch
        default: none

jobs:
  prepare-tag:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      is-release: ${{ steps.resolve.outputs.is-release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          RELEASE_INPUT="${{ inputs.release }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "update-latest" ]; then
            TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
            if [ -z "$TAG" ]; then
              echo "No existing v*.*.* tag to update"
              exit 1
            fi
            git tag -f "$TAG"
            git push --force origin "$TAG"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "new-patch" ]; then
            LATEST=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
            if [ -z "$LATEST" ]; then
              LATEST="v0.0.0"
            fi
            MAJOR=$(echo "${LATEST#v}" | cut -d. -f1)
            MINOR=$(echo "${LATEST#v}" | cut -d. -f2)
            PATCH=$(echo "${LATEST#v}" | cut -d. -f3)
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            git tag "$TAG"
            git push origin "$TAG"
            IS_RELEASE="true"
          else
            TAG=""
            IS_RELEASE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is-release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Resolved tag: '$TAG' (is-release: $IS_RELEASE)"

  unit-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run unit tests
        timeout-minutes: 12
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

  build-zig-linux-x64:
    # Builds the Zig CLI for Linux x64 on a runner of that platform, and publishes the binary. Nothing here
    # cross-compiles, so a build that works is a build that runs on the platform it names.
    #
    # This is the only job that builds the Zig CLI: zig-cli-smoke-tests downloads the binary this uploads
    # and create-release publishes it, so the binary is built once and used by both.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/zig/p' || '~/.cache/zig/p' }}
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # See the same step in build-zig-macos-x64 for why the packages are fetched before the build.
      - name: Fetch every package Zig needs, lazy ones included, in one pass
        working-directory: .
        run: zig build --fetch=all

      - name: Build the Zig CLI natively for Linux x64
        working-directory: .
        run: zig build -Dcpu=baseline --prefix apps/cli-zig/bin/x64/linux --prefix-exe-dir .

      - name: Check the binary was produced
        working-directory: ./apps/cli-zig
        run: |
          ls -la bin/x64/linux/psi
          file bin/x64/linux/psi

      # The binary is renamed to say which CLI it is, because the TypeScript CLI is also called psi and
      # unpacking both releases into one directory would otherwise overwrite one with the other.
      - name: Collect the Zig CLI binary
        shell: bash
        run: |
          mkdir -p out
          chmod +x apps/cli-zig/bin/x64/linux/psi
          cp apps/cli-zig/bin/x64/linux/psi out/photosphere-cli-zig-linux-x64
          ls -la out

      - name: Upload the Zig CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-cli-zig-linux-x64
          path: out

      - name: Save the Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}

  build-zig-windows-x64:
    # Builds the Zig CLI for Windows x64 on a runner of that platform, and publishes the binary. Nothing here
    # cross-compiles, so a build that works is a build that runs on the platform it names.
    #
    # This is the only job that builds the Zig CLI: zig-cli-smoke-tests downloads the binary this uploads
    # and create-release publishes it, so the binary is built once and used by both.
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/zig/p' || '~/.cache/zig/p' }}
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # See the same step in build-zig-macos-x64 for why the packages are fetched before the build.
      - name: Fetch every package Zig needs, lazy ones included, in one pass
        working-directory: .
        run: zig build --fetch=all

      - name: Build the Zig CLI natively for Windows x64
        working-directory: .
        run: zig build -Dcpu=baseline --prefix apps/cli-zig/bin/x64/win --prefix-exe-dir .

      - name: Check the binary was produced
        shell: bash
        working-directory: ./apps/cli-zig
        run: |
          ls -la bin/x64/win/psi.exe

      # The binary is renamed to say which CLI it is, because the TypeScript CLI is also called psi and
      # unpacking both releases into one directory would otherwise overwrite one with the other.
      - name: Collect the Zig CLI binary
        shell: bash
        run: |
          mkdir -p out
          chmod +x apps/cli-zig/bin/x64/win/psi.exe
          cp apps/cli-zig/bin/x64/win/psi.exe out/photosphere-cli-zig-windows-x64
          ls -la out

      - name: Upload the Zig CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-cli-zig-windows-x64
          path: out

      - name: Save the Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}

  build-zig-macos-x64:
    # Builds the Zig CLI for macOS x64 on a runner of that platform, and publishes the binary. Nothing here
    # cross-compiles, so a build that works is a build that runs on the platform it names.
    #
    # This is the only job that builds the Zig CLI: zig-cli-smoke-tests downloads the binary this uploads
    # and create-release publishes it, so the binary is built once and used by both.
    timeout-minutes: 40
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # `zig build` keeps one HTTP client for its whole run. It fetches the eager packages, compiles and runs
      # the build script (about a minute on macos-15-intel), then fetches the lazy packages the script asked
      # for, reusing the keep-alive connections it pooled during the first fetch. By then the server has
      # closed them, and Zig 0.16's client takes a pooled connection without checking it is still open and
      # does not retry, so the lazy s2n-tls download failed with "build.zig.zon:64:20: error: invalid HTTP
      # response: HttpConnectionClosing" in build-zig-macos-x64 and build-aws-sdk (macos-15-intel), the jobs
      # whose package cache missed. --fetch=all fetches every package, lazy ones included, in one pass and
      # exits before the build script runs, so no download waits behind it.
      - name: Fetch every package Zig needs, lazy ones included, in one pass
        working-directory: .
        run: zig build --fetch=all

      - name: Build the Zig CLI natively for macOS x64
        working-directory: .
        run: zig build -Dcpu=baseline --prefix apps/cli-zig/bin/x64/mac --prefix-exe-dir .

      - name: Check the binary was produced
        working-directory: ./apps/cli-zig
        run: |
          ls -la bin/x64/mac/psi
          file bin/x64/mac/psi

      # The binary is renamed to say which CLI it is, because the TypeScript CLI is also called psi and
      # unpacking both releases into one directory would otherwise overwrite one with the other.
      - name: Collect the Zig CLI binary
        shell: bash
        run: |
          mkdir -p out
          chmod +x apps/cli-zig/bin/x64/mac/psi
          cp apps/cli-zig/bin/x64/mac/psi out/photosphere-cli-zig-macos-x64
          ls -la out

      - name: Upload the Zig CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-cli-zig-macos-x64
          path: out

      - name: Save the Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}

  build-zig-macos-arm64:
    # Builds the Zig CLI for macOS arm64 on a runner of that platform, and publishes the binary. Nothing here
    # cross-compiles, so a build that works is a build that runs on the platform it names.
    #
    # This is the only job that builds the Zig CLI: zig-cli-smoke-tests downloads the binary this uploads
    # and create-release publishes it, so the binary is built once and used by both.
    timeout-minutes: 40
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # See the same step in build-zig-macos-x64 for why the packages are fetched before the build.
      - name: Fetch every package Zig needs, lazy ones included, in one pass
        working-directory: .
        run: zig build --fetch=all

      - name: Build the Zig CLI natively for macOS arm64
        working-directory: .
        run: zig build -Dcpu=baseline --prefix apps/cli-zig/bin/arm64/mac --prefix-exe-dir .

      - name: Check the binary was produced
        working-directory: ./apps/cli-zig
        run: |
          ls -la bin/arm64/mac/psi
          file bin/arm64/mac/psi

      # The binary is renamed to say which CLI it is, because the TypeScript CLI is also called psi and
      # unpacking both releases into one directory would otherwise overwrite one with the other.
      - name: Collect the Zig CLI binary
        shell: bash
        run: |
          mkdir -p out
          chmod +x apps/cli-zig/bin/arm64/mac/psi
          cp apps/cli-zig/bin/arm64/mac/psi out/photosphere-cli-zig-macos-arm64
          ls -la out

      - name: Upload the Zig CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-cli-zig-macos-arm64
          path: out

      - name: Save the Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}

  build-aws-sdk:
    # Compiles the AWS SDK for C on each platform and caches the result, because several jobs build Zig and
    # every one of them would otherwise compile it from cold: it is the longest single build in this
    # workflow. One job owns it, so the compile happens once per platform per commit and the others
    # restore what this wrote.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/zig/p' || '~/.cache/zig/p' }}
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-

      # See the same step in build-zig-macos-x64 for why the packages are fetched before the build.
      - name: Fetch every package Zig needs, lazy ones included, in one pass
        working-directory: .
        run: zig build --fetch=all

      # The CLI's own build, which compiles the AWS SDK for C and runs nothing. Every job that needs the AWS
      # SDK builds in this same mode, so one cache serves all of them: the Zig cache is keyed by optimisation
      # mode, and the unit tests and the storage integration tests build in this mode too.
      - name: Build the Zig CLI, which compiles the AWS SDK
        working-directory: .
        run: zig build

      - name: Save the Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-${{ github.sha }}

  zig-unit-tests:
    # The unit tests of the Zig CLI and of every Zig package, on each platform, because the
    # behaviour of a test that runs an external tool differs between them. This is a job of its own so
    # a failure in a test is not reported as a failure of a smoke suite, which is what happens when
    # the two share a job: the job is named after the smoke tests and a red unit test looks like a
    # red smoke test.
    # Setup takes about 5 minutes and a cold unit test build, which compiles ImageMagick and FFmpeg too, up to 40 on the Intel Mac.
    timeout-minutes: 50
    needs: [build-aws-sdk]
    strategy:
      fail-fast: false
      matrix:
        # macOS and iOS are not needed yet, and these failed in Release Zig run 39123959376.
        os: [ubuntu-latest, windows-latest]
        # os: [ubuntu-latest, macos-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/zig/p' || '~/.cache/zig/p' }}
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Install media processing tools (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-ffmpeg-windows

      - name: Install media processing tools (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/retry-install
        with:
          run: choco install imagemagick -y
          verify: magick|convert

      # Every run compiled the Zig CLI, every package and the AWS SDK for C from nothing, which took the
      # Windows unit test step past its timeout. Zig's cache is content addressed, so the one from an
      # earlier run holds most of what this run compiles. It is saved at the end of every job.
      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-

      # Every commit adds a new generation of Zig artifacts and nothing removes the old ones, so the
      # cache grew from 2.4 GB (run 674) to 6.1 GB (run 699). Saving only under 6 GB then stopped every
      # save, runs kept restoring an ever staler cache, and once GitHub evicted that last entry run 700
      # built everything cold and passed the step's timeout. A cache this big is moved out of the way
      # instead, so this run builds and saves a fresh one.
      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # See the same step in build-zig-macos-x64 for why the packages are fetched before the build.
      - name: Fetch every package Zig needs, lazy ones included, in one pass
        working-directory: .
        run: zig build --fetch=all

      # With the C libraries cached, a change to a package the others import recompiles the Zig code of
      # nearly every test program, which took 10 to 11 minutes on Windows (runs 685, 697, 699). A cold
      # build also compiles aws-lc, zlib-ng and the rest of the AWS SDK for C first, which took longer
      # than 12 minutes (run 700).
      - name: Run the Zig unit tests
        timeout-minutes: 40
        shell: bash
        run: |
          # The Zig CLI and every Zig package in one build, so each dependency, the AWS SDK for C among
          # them, is compiled once rather than once in each package that uses it.
          zig build test --summary all --test-timeout 20m

      # A key of its own, because the smoke job saves under the plain one and actions/cache/save fails
      # when the key already exists.

  zig-cli-smoke-tests:
    # The Zig CLI smoke suites on each platform, because the byte-identical output (gzip OS byte, paths, file
    # times) differs between them. The unit tests are the zig-unit-tests job above, so a failure in one is not
    # reported as a failure of the other.
    # The binary is not built here: each build-zig job builds the one for its own platform and this job
    # downloads it, so the Zig CLI is compiled once per platform and both this job and the release use it.
    # Every platform the release ships a Zig binary for is in the matrix, so a shipped binary is one the
    # suites have run against.
    # Setup takes about 5 minutes and the smoke suites about 15.
    timeout-minutes: 75
    needs: [build-aws-sdk, build-zig-linux-x64, build-zig-macos-arm64, build-zig-macos-x64, build-zig-windows-x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: photosphere-cli-zig-linux-x64
            binary: psi
          # Windows, macOS and iOS are not needed yet, and these failed in Release Zig run 39123959376.
          # - os: macos-latest
          #   artifact: photosphere-cli-zig-macos-arm64
          #   binary: psi
          - os: windows-latest
            artifact: photosphere-cli-zig-windows-x64
            binary: psi.exe
          # - os: macos-15-intel
          #   artifact: photosphere-cli-zig-macos-x64
          #   binary: psi
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig
      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/zig/p' || '~/.cache/zig/p' }}
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install
      - name: Install media processing tools (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe
      - name: Install media processing tools (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-ffmpeg-windows
      - name: Install media processing tools (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/retry-install
        with:
          run: choco install imagemagick -y
          verify: magick|convert
      # Every run compiled the Zig CLI, every package and the AWS SDK for C from nothing, which took the
      # Windows unit test step past its timeout. Zig's cache is content addressed, so the one from an
      # earlier run holds most of what this run compiles. It is saved at the end of every job.
      - name: Show the disk space the Zig builds use (each package that builds the AWS SDK for C has its own zig-pkg and .zig-cache)
        if: always()
        shell: bash
        run: |
          df -h .
          du -sh packages/*/zig-pkg packages/*/.zig-cache apps/*/zig-pkg apps/*/.zig-cache 2>/dev/null || true
      # The smoke suites run the built binary rather than `bun run start`, at the path their common.sh reads
      # (../cli-zig/zig-out/bin/psi from apps/cli). The binary is the one the build job for this platform built.
      # The Zig CLI is built by the build-zig jobs, but this job still builds Zig itself, and the AWS SDK
      # for C it needs is compiled once per platform by the zig-unit-tests job and cached under the key
      # below. Restoring it is what keeps this job from compiling the AWS SDK from cold.
      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-

      - name: Download the Zig CLI built for this platform
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./zig-binary
      - name: Put the Zig CLI where the smoke suites look for it
        shell: bash
        run: |
          mkdir -p zig-out/bin
          cp zig-binary/${{ matrix.artifact }} zig-out/bin/${{ matrix.binary }}
          # The artifact is downloaded without the executable bit, and the smoke suites fail with exit 126
          # (found but not executable) without it.
          chmod +x zig-out/bin/${{ matrix.binary }}
          ls -la zig-out/bin
      - name: Run the Zig CLI smoke tests
        # 101 tests, and the Windows runner is the slowest: it reached test 100 in 14 minutes, so the
        # old 14-minute limit killed the step with every test passing.
        timeout-minutes: 30
        working-directory: ./apps/cli
        shell: bash
        run: ./smoke-tests-zig.sh --binary
      - name: Test the Zig version command
        working-directory: ./apps/cli
        shell: bash
        run: |
          echo "Testing version command after building..."
          ../../zig-out/bin/psi version
      - name: Run the Zig CLI encrypted smoke tests
        timeout-minutes: 12
        working-directory: ./apps/cli
        shell: bash
        run: ./smoke-tests-encrypted-zig.sh all
      - name: Run the Zig CLI write lock smoke tests
        timeout-minutes: 12
        working-directory: ./apps/cli
        shell: bash
        run: ./write-lock-smoke-test-zig.sh
      - name: Run the Zig CLI sync smoke tests
        timeout-minutes: 12
        working-directory: ./apps/cli
        shell: bash
        run: ./sync-smoke-test-zig.sh
      - name: Run the Zig CLI hash cache smoke tests
        timeout-minutes: 12
        working-directory: ./apps/cli
        shell: bash
        run: ./hash-cache-smoke-test-zig.sh
      # Linux only, like the TypeScript lan-share-smoke-test job it mirrors.
      - name: Run the Zig CLI LAN share smoke tests
        if: runner.os == 'Linux'
        timeout-minutes: 12
        working-directory: ./apps/cli
        shell: bash
        run: ./smoke-tests-lan-share-zig.sh
      # Saved on every run, so the newest entry is always one this branch just wrote. It no longer grows
      # without bound: the step after the restore starts a fresh cache once the restored one is too big.
  photosphere-desktop-smoke-tests:
    # The Photosphere App's smoke tests on the host operating system, on Windows and MacOS. Linux and Android run these
    # suites (test:ziggy and test:ziggy:and) under `bun run tev`, which is not a job of this workflow, so they are not
    # repeated here. Windows needs the WebView2 SDK and the WiX Toolset, which the setup step fetches, and MacOS opens a real
    # window on the runner's own display. The Zig build restores the AWS SDK for C that build-aws-sdk compiled, so it is
    # not compiled again here.
    timeout-minutes: 75
    needs: [build-aws-sdk]
    strategy:
      fail-fast: false
      matrix:
        # macOS and iOS are not needed yet, and these failed in Release Zig run 39123959376.
        os: [ubuntu-latest, windows-latest]
        # os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/zig/p' || '~/.cache/zig/p' }}
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The app's runtime libraries (as in package-photosphere), and xvfb, which lib/linux.sh runs the app under.
      - name: Install the runtime libraries, xvfb and media processing tools (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 libgdk-pixbuf-2.0-0 gstreamer1.0-plugins-good gstreamer1.0-libav xvfb imagemagick ffmpeg
          verify: xvfb-run magick|convert ffmpeg ffprobe

      # The scenarios build their database fixtures with the CLI from source, which needs ImageMagick and ffmpeg.
      - name: Install media processing tools (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-ffmpeg-windows

      - name: Install media processing tools (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/retry-install
        with:
          run: choco install imagemagick -y
          verify: magick|convert

      - name: Fetch the WebView2 SDK and the WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bun run --filter=ziggy setup

      # The same cache zig-cli-smoke-tests restores, written by build-aws-sdk, so the AWS SDK for C is not compiled from cold.
      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-

      # run-desktop.sh builds the page and the app's shell itself, through sync-windows.sh or build-macos.sh.
      - name: Run the Photosphere App smoke tests
        timeout-minutes: 60
        shell: bash
        run: bun run test:ziggy

  photosphere-android-smoke-tests:
    # The Photosphere App's smoke tests on an Android emulator. The emulator has no host LAN bridge, so PHOTOSPHERE_NO_LAN_BRIDGE
    # makes the scenarios that need one skip with a logged SKIP line.
    timeout-minutes: 90
    needs: [build-aws-sdk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The scenarios build their database fixtures with the CLI from source, which needs ImageMagick and ffmpeg.
      - name: Install media processing tools
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg
          verify: magick|convert ffmpeg ffprobe

      - name: Cache the Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: ${{ runner.os }}-android-ndk-25.1.8937393

      # Retried because the SDK manager downloads from Google and a download can arrive corrupt.
      - name: Set up the Android SDK and NDK
        uses: ./.github/actions/retry-install
        with:
          run: bun run --filter=ziggy setup:android

      # The same cache zig-cli-smoke-tests restores, written by build-aws-sdk, so the AWS SDK for C is not compiled from cold.
      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-aws-sdk-

      # Allow the hardware-accelerated emulator to use KVM on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator runner below downloads this system image once, with no retry, and a download can arrive corrupt:
      # an Android smoke job failed with "Error on ZipFile unknown archive" while it prepared the Google APIs Intel x86_64
      # Atom System Image, before any test ran. Installing it here, retried, leaves the runner an image that is already
      # installed. The licence step ends in "|| true" because `yes` is killed when sdkmanager stops reading, which
      # fails a pipeline under pipefail. sdkmanager is called by its full path because a plain step does not have it on PATH
      # ("sdkmanager: command not found", exit 127).
      - name: Install the Android system image
        uses: ./.github/actions/retry-install
        with:
          run: |
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-35;google_apis;x86_64'

      - name: Run the Photosphere App Android smoke tests
        timeout-minutes: 75
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PHOTOSPHERE_NO_LAN_BRIDGE: "1"
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # Emulator 36.6.11, the build the local emulator scripts pin (EMULATOR_BUILD in apps/android-frontend/scripts/emulator-config.sh,
          # which says why): the newest emulator never gives back the memory of an app it has stopped, and this suite starts the app
          # many times.
          emulator-build: 15507667
          # One line: the action runs each line of `script:` as its own shell, so only a single line's exit status reaches the job.
          script: bun run test:ziggy:and

