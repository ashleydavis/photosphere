# The tests on macOS x64, on every push and on demand, made to report as fast as possible. test-macos.yml says what runs.
name: Test macOS x64

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

# A newer push to the same branch supersedes a run still going, so only the latest commit's results are waited for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test-macos.yml
    with:
      runner: macos-15-intel
      platform: macos-x64
      target: x86_64-macos.11.0
      # The runner has 4 cores, and the scenarios spend most of their time waiting on the app rather than computing: four at once took
      # the 68 scenarios 549 seconds.
      app-parallel: "6"
