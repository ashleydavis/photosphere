name: Release Zig iOS

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.6"
  # Each platform has a workflow of its own, so a failure on one shows at a glance and holds up no other platform's release.
  # Its release tags are <RELEASE_PLATFORM>-v1.2.3, and its GitHub release is zig-<that tag>.
  RELEASE_PLATFORM: "ios"
  RELEASE_PLATFORM_NAME: "iOS"

on:
  # TODO: Turn the push and pull request triggers back on once every Zig release workflow passes. Until then each one is run manually.
  push:
    branches:
      - "*"
  #   tags:
  #     - 'ios-v*.*.*'

  # pull_request:
  #   branches:
  #     - main

  workflow_dispatch:
    inputs:
      release:
        description: "Release action. none = nightly build. update-latest = move the latest ios-v*.*.* tag to this commit and re-release it. new-patch = create the next patch tag (e.g. ios-v0.0.8 -> ios-v0.0.9) and release it."
        type: choice
        options:
          - none
          - update-latest
          - new-patch
        default: none

jobs:
  prepare-tag:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      is-release: ${{ steps.resolve.outputs.is-release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          RELEASE_INPUT="${{ inputs.release }}"
          PREFIX="${RELEASE_PLATFORM}-v"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "update-latest" ]; then
            TAG=$(git tag --list "${PREFIX}*.*.*" --sort=-version:refname | head -1)
            if [ -z "$TAG" ]; then
              echo "No existing ${PREFIX}*.*.* tag to update"
              exit 1
            fi
            git tag -f "$TAG"
            git push --force origin "$TAG"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "new-patch" ]; then
            LATEST=$(git tag --list "${PREFIX}*.*.*" --sort=-version:refname | head -1)
            if [ -z "$LATEST" ]; then
              LATEST="${PREFIX}0.0.0"
            fi
            MAJOR=$(echo "${LATEST#"$PREFIX"}" | cut -d. -f1)
            MINOR=$(echo "${LATEST#"$PREFIX"}" | cut -d. -f2)
            PATCH=$(echo "${LATEST#"$PREFIX"}" | cut -d. -f3)
            TAG="${PREFIX}${MAJOR}.${MINOR}.$((PATCH + 1))"
            git tag "$TAG"
            git push origin "$TAG"
            IS_RELEASE="true"
          else
            TAG=""
            IS_RELEASE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is-release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Resolved tag: '$TAG' (is-release: $IS_RELEASE)"

  # The third-party libraries, each built once by its own action and cached, so a library an earlier run has already built is
  # restored rather than compiled again. Each is built for the iOS simulator the smoke tests run on and for an iOS device, which the
  # package is built for. ImageMagick's and FFmpeg's generated files for iOS are not checked in, so their builds make them first.
  # Every job that runs the Zig build restores the libraries from that cache with the third-party-libraries action.
  build-aws-sdk:
    timeout-minutes: 60
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the AWS SDK for C for the iOS simulator
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0-simulator

      - name: Build the AWS SDK for C for an iOS device
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0

  build-zlib-ng:
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build zlib-ng for the iOS simulator
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0-simulator

      - name: Build zlib-ng for an iOS device
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0

  build-imagemagick:
    timeout-minutes: 60
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ImageMagick for the iOS simulator
        uses: ./.github/actions/build-imagemagick
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0-simulator
          config-name: aarch64-ios-simulator

      - name: Build ImageMagick for an iOS device
        uses: ./.github/actions/build-imagemagick
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0
          config-name: aarch64-ios

  build-ffmpeg:
    timeout-minutes: 60
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FFmpeg for the iOS simulator
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0-simulator
          config-name: aarch64-ios-simulator

      - name: Build FFmpeg for an iOS device
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0
          config-name: aarch64-ios

  app-smoke-tests:
    # The Photosphere App's smoke tests on an iOS simulator. run.sh picks the first available iPhone simulator and boots it,
    # builds the page and the Zig library, and builds and installs the app with xcodebuild. The runner's default Xcode is used,
    # because apple-common.sh only requires one that works and setup-ios.sh checks for 14.2 or newer.
    timeout-minutes: 90
    needs: [build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg]
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The scenarios build their database fixtures with the CLI from source, which needs ImageMagick and ffmpeg.
      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree rsync
          verify: magick|convert ffmpeg ffprobe

      - name: Check the iOS toolchain
        run: bun run --filter=ziggy setup:ios

      # The CLI that makes the scenarios' fixtures is built for the runner's macOS, and the app for the simulator.
      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: macos-arm64
          build-args: -Dtarget=aarch64-macos.11.0

      - name: Restore the third-party libraries for the iOS simulator
        uses: ./.github/actions/third-party-libraries
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0-simulator
          config-name: aarch64-ios-simulator

      - name: Run the Photosphere App iOS smoke tests
        timeout-minutes: 75
        run: bun run test:ziggy:ios

  package-release:
    # The Photosphere App packaged for iOS, unsigned, by the same package script a developer runs. The version comes from the
    # release tag: ios-v1.2.3 is 1.2.3 and a nightly is dev-nightly.<timestamp>. The archive is made by xcodebuild with code
    # signing off, and only its .ipa is attached to the release, because an .xcarchive is a folder. It is built and not run:
    # running it needs a simulator, which the smoke test job and the local test runs provide.
    timeout-minutes: 90
    needs: [prepare-tag, build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg]
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Check the iOS toolchain (iOS)
        run: bun run --filter=ziggy setup:ios

      - name: Restore the third-party libraries for an iOS device
        uses: ./.github/actions/third-party-libraries
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0
          config-name: aarch64-ios

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#"${RELEASE_PLATFORM}-v"}"
            VERSION="$(bash ./scripts/set-build-config.sh --tag "$VERSION" --commit "${{ github.sha }}")"
          else
            VERSION="$(bash ./scripts/set-build-config.sh --commit "${{ github.sha }}")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Package (iOS)
        shell: bash
        run: bun run --filter=ziggy package:ios -- --version "$VERSION"

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-app-ios
          path: apps/photosphere/out/ios/*.ipa
          if-no-files-found: error
          retention-days: 2

  create-release:
    timeout-minutes: 20
    needs: [prepare-tag, build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg, app-smoke-tests, package-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the Photosphere App packages
        uses: actions/download-artifact@v4
        with:
          pattern: photosphere-app-*
          path: ./artifacts/app
          merge-multiple: true

      - name: Generate release notes
        id: release-notes
        run: |
          # The CLI commits made since the last release tag, as bullets. The same script produces the
          # notes for the Android tester builds, so a release and a tester build never describe the
          # same commits differently. The tag being built is excluded so a tagged release measures
          # from the tag before it; for a nightly the tag is empty and nothing is excluded.
          RELEASE_NOTES=$(bash ./scripts/release-notes.sh \
            --prefix cli \
            --exclude-tag "${{ needs.prepare-tag.outputs.tag }}" \
            --tag-pattern "${RELEASE_PLATFORM}-v*.*.*" \
            --empty-message "- No CLI-related commits found")

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Generated release notes:"
          echo "$RELEASE_NOTES"

      - name: Delete existing nightly release
        if: needs.prepare-tag.outputs.is-release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "zig-${RELEASE_PLATFORM}-nightly" --yes --cleanup-tag || true
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-tag.outputs.is-release == 'true' && format('zig-{0}', needs.prepare-tag.outputs.tag) || format('zig-{0}-nightly', env.RELEASE_PLATFORM) }}
          # The zig- tag does not exist yet, so the release creates it. Without this it would be created on the default branch rather than on the commit that was built.
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare-tag.outputs.is-release == 'true' && format('Photosphere Zig {0} {1}', env.RELEASE_PLATFORM_NAME, needs.prepare-tag.outputs.tag) || format('Photosphere Zig {0} Nightly', env.RELEASE_PLATFORM_NAME) }}
          draft: false
          prerelease: ${{ needs.prepare-tag.outputs.is-release != 'true' }}
          files: |
            ./artifacts/app/*
          body: |
            ${{ needs.prepare-tag.outputs.is-release == 'true' && format('Photosphere Zig {0} release {1}', env.RELEASE_PLATFORM_NAME, needs.prepare-tag.outputs.tag) || format('Photosphere Zig {0} nightly build - {1}', env.RELEASE_PLATFORM_NAME, github.sha) }}

            ${{ needs.prepare-tag.outputs.is-release != 'true' && '⚠️ **This is a nightly build and may be unstable**' || '' }}
            ${{ needs.prepare-tag.outputs.is-release != 'true' && format('Built from commit: {0}', github.sha) || '' }}

            ## What's Changed
            ${{ steps.release-notes.outputs.RELEASE_NOTES }}

            ## Download
            - **iOS**: `.ipa` (unsigned)

            ## Bundled tools and licences
            The mobile apps bundle in-process builds of ImageMagick (ImageMagick licence, an Apache-2.0-style licence) and ffmpeg (LGPL-2.1+), along with ImageMagick's libjpeg, libpng, and zlib delegates. Full attribution and licences are in [THIRD-PARTY-NOTICES.md](https://github.com/ashleydavis/photosphere/blob/main/THIRD-PARTY-NOTICES.md).
