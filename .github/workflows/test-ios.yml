# The tests on iOS, on every push and on demand. They run every test Release iOS runs, minus packaging and publishing: each
# third-party library (the AWS SDK for C, zlib-ng, ImageMagick and FFmpeg) has its own job that builds and stores it, side by side,
# then app-build builds the app for the simulator over those libraries, app-smoke-tests runs it, zig-unit-tests runs the Zig unit
# tests and the TypeScript jobs compile and test the TypeScript, which their own jobs build.
name: Test iOS

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.6"

on:
  # Every push is tested. A release is made by its own workflow, when its tag is pushed or when it is started by hand.
  push:
    branches:
      - "**"

  workflow_dispatch:

jobs:

  # The third-party libraries, each built once by its own action and stored as an artifact, so a library an earlier run has already built is
  # restored rather than compiled again. Each is built for the iOS simulator the smoke tests run on and for an iOS device, which the
  # package is built for. ImageMagick's and FFmpeg's generated files for iOS are not checked in, so their builds make them first.
  # Every job that runs the Zig build restores the libraries from those artifacts with the third-party-libraries action.
  build-aws-sdk:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the AWS SDK for C
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0-simulator

      - name: Build the AWS SDK for C for the second architecture or ABI
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0

  build-zlib-ng:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build zlib-ng
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0-simulator

      - name: Build zlib-ng for the second architecture or ABI
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0

  build-imagemagick:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ImageMagick
        uses: ./.github/actions/build-imagemagick
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0-simulator
          config-name: aarch64-ios-simulator

      - name: Build ImageMagick for the second architecture or ABI
        uses: ./.github/actions/build-imagemagick
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0
          config-name: aarch64-ios

  build-ffmpeg:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FFmpeg
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0-simulator
          config-name: aarch64-ios-simulator

      - name: Build FFmpeg for the second architecture or ABI
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0
          config-name: aarch64-ios


  # Restores the third-party libraries the library jobs built and builds the Photosphere App for the iOS simulator, in Release,
  # by the same build script a developer runs, for the smoke tests.
  # The library jobs build each library for an iOS device for the iOS
  # simulator and for the runner's macOS, which the CLI that makes the smoke tests' fixtures builds for, and this job
  # restores them from their artifacts. ImageMagick's and FFmpeg's generated files for iOS
  # are not checked in, so their builds make them first. The simulator app, the Zig build cache and the libraries are saved under
  # photosphere-app-ios-<commit>-<run>, which app-smoke-tests restores.
  app-build:
    timeout-minutes: 150
    needs: [build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Check the iOS toolchain (iOS)
        run: bun run --filter=ziggy setup:ios

      - name: Restore the third-party libraries for the runner
        uses: ./.github/actions/third-party-libraries
        with:
          platform: macos-arm64
          build-args: -Dtarget=aarch64-macos.11.0

      - name: Restore the third-party libraries for the iOS simulator
        uses: ./.github/actions/third-party-libraries
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0-simulator
          config-name: aarch64-ios-simulator

      - name: Restore the third-party libraries for an iOS device
        uses: ./.github/actions/third-party-libraries
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0
          config-name: aarch64-ios

      - name: Set config
        shell: bash
        run: |
          VERSION="$(bash ./scripts/set-build-config.sh --commit "${{ github.sha }}")"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # The app build's Zig build cache, restored from the latest run that saved one for this platform, so the build
      # compiles only what changed instead of the whole app. Saved again after the build, as the CLI build does.
      - name: Restore the app build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-app-build-ios-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-app-build-ios-

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # The app is built into out/app, laid out as apps/photosphere-smoke-tests/run.md describes, which is where the smoke tests take
      # it from. Only the app is saved, not the rest of Xcode's derived data.
      - name: Build the app for the iOS simulator
        shell: bash
        run: bun run --filter=ziggy build:ios -- --sdk simulator --configuration Release --native-dir "$PWD/out/app/native" --build-dir "$PWD/out/app/xcode"

      - name: Save the app build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-app-build-ios-${{ github.sha }}

      - name: Save the Photosphere App build
        uses: actions/cache/save@v4
        with:
          path: |
            out/app/xcode/Build/Products/Release-iphonesimulator/Photosphere.app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-ios-${{ github.sha }}-${{ github.run_id }}

  app-smoke-tests:
    # The Photosphere App's smoke tests on an iOS simulator, on the simulator build app-build made, which
    # PHOTOSPHERE_SMOKE_BUILD names. run.sh picks the first available iPhone simulator and boots it, and installs the app on it.
    # The runner's default Xcode is used, because apple-common.sh only requires one that works and setup-ios.sh checks for 14.2
    # or newer. The CLI that makes the scenarios' fixtures is built by the smoke runner over the libraries app-build saved.
    timeout-minutes: 90
    needs: [app-build]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The scenarios build their database fixtures with the CLI from source, which needs ImageMagick and ffmpeg.
      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree rsync
          verify: magick|convert ffmpeg ffprobe

      - name: Check the iOS toolchain
        run: bun run --filter=ziggy setup:ios

      # The CLI that makes the scenarios' fixtures is built for the runner's macOS. app-build saved its libraries with the app.
      - name: Restore the Photosphere App build
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app/xcode/Build/Products/Release-iphonesimulator/Photosphere.app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-ios-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Run the Photosphere App iOS smoke tests
        timeout-minutes: 75
        env:
          PHOTOSPHERE_SMOKE_BUILD: ${{ github.workspace }}/out/app
        run: bun run test:ziggy:ios

      # Scenarios 30 (the app never became ready, its log ending at "Main window created") and 58 (syncing was never held back for
      # the prefetch, which logged nothing) failed here with nothing kept to say why. A failed scenario keeps its directory, which
      # holds the app's log and the core's own log, and macOS writes a crash report for a process that crashed, the simulator's
      # apps included.
      - name: Collect the logs of failed scenarios and any crash reports
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-smoke-logs/crash-reports"
          if [ -d "${TMPDIR%/}/photosphere-tests" ]; then
              cp -R "${TMPDIR%/}/photosphere-tests" "$RUNNER_TEMP/app-smoke-logs/"
          fi
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
              cp -R "$HOME/Library/Logs/DiagnosticReports/." "$RUNNER_TEMP/app-smoke-logs/crash-reports/"
          fi
          ls -R "$RUNNER_TEMP/app-smoke-logs/crash-reports"

      - name: Upload the logs of failed scenarios and any crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs-ios
          path: ${{ runner.temp }}/app-smoke-logs
          retention-days: 5

  # Compiles the TypeScript, which is the only check of its types: the unit tests run it without checking them.
  typescript-compile:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # bun run compile records a what-changed baseline when it succeeds.
      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Compile TypeScript
        timeout-minutes: 12
        run: bun run compile

  # The TypeScript unit tests.
  typescript-unit-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run unit tests
        timeout-minutes: 12
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

  # The unit tests of the Zig CLI and of every Zig package, on this workflow's runner, over the libraries the library jobs built for it
  # and the Zig build cache app-build saved.
  zig-unit-tests:
    timeout-minutes: 50
    needs: [build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg, app-build]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Restore the packages Zig fetches, or fetch all of them when the cache has none
        uses: ./.github/actions/zig-packages

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools (macOS)
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      # The libraries for the runner, which the tests build for, restored from their artifacts.
      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: macos-arm64
          # The same build-args as the library jobs, so the key matches theirs: with none the key differed, nothing was
          # restored and the libraries were built from source here, 13 to 15 minutes a run. The library directory is named by
          # architecture and OS only, so the tests find these 11.0-target libraries where they look for the native ones.
          build-args: -Dtarget=aarch64-macos.11.0

      # Zig skips any compile step whose inputs are unchanged and already in .zig-cache. Without this the test binaries and psi are
      # compiled from nothing every run, which is most of this job's time. The key changes with any Zig source, and the newest
      # earlier cache is restored when there is no exact match, so only the binaries a change touches are compiled again.
      # The next step lays app-build's cache over it.
      - name: Cache Zig's build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      # The build app-build saved, with its Zig build cache and libraries, laid over the test build's own cache, so Zig reuses any
      # compile step the two builds have in common. The paths are the ones app-build saved, which a restore has to name exactly.
      - name: Restore the app build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app/xcode/Build/Products/Release-iphonesimulator/Photosphere.app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-ios-${{ github.sha }}-${{ github.run_id }}

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # The getImageDetails format test reads images from test/formats, which are made on the machine rather than committed.
      - name: Make the format test images
        shell: bash
        run: bash scripts/make-format-test-images.sh

      # Built for any CPU of the architecture, so the compile steps match the restored build caches whatever CPU the runner has.
      - name: Run the Zig unit tests
        timeout-minutes: 40
        shell: bash
        run: zig build test -Dcpu=baseline --summary all --test-timeout 20m

