# The tests on iOS, on every push and on demand, made to report as fast as possible. build builds the Photosphere App for the iOS
# simulator and the Zig CLI for the runner's macOS, which makes the scenarios' fixtures, and uploads both. The app smoke tests are split
# across runners, each running one shard of the scenarios on two simulators of its own. The shards depend on build rather than waiting for its
# upload, because a shard that waits holds one of the account's five macOS runners, which the macOS test workflows share, and the build
# may be queued for one. The Zig unit tests are not run here: on this runner they are the same command as Test macOS arm64 runs.
# Nothing is packaged: the release workflow does that.
name: Test iOS

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  # brew install updates Homebrew itself first, and cleans up after, unless told not to; the runner's Homebrew is recent enough.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

# A newer push to the same branch supersedes a run still going, so only the latest commit's results are waited for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig and jq (versions from mise.toml)
        uses: ./.github/actions/setup-zig

      - name: Check the iOS toolchain
        run: bun run --filter=ziggy setup:ios

      - name: Restore the third-party libraries for the runner
        uses: ./.github/actions/third-party-libraries
        with:
          platform: macos-arm64
          build-args: -Dtarget=aarch64-macos.11.0

      - name: Restore the third-party libraries for the iOS simulator
        uses: ./.github/actions/third-party-libraries
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0-simulator
          config-name: aarch64-ios-simulator

      # The finished app and CLI, keyed on everything they are built from, so a commit that changes only the tests pays no build. An
      # exact match only, so nothing is restored for a commit whose Zig code, page or libraries differ.
      # Worked out once here and used to restore and to save alike: computing it in both places gave two keys, because hashFiles is
      # not stable across a build.
      - name: Work out the built-app cache key
        id: built-key
        shell: bash
        run: echo "key=${{ runner.os }}-${{ runner.arch }}-test-built-ios-${{ hashFiles('mise.toml', 'packages-zig/**/src/**', 'packages-zig/**/build.zig', 'packages-zig/*.zig', 'apps/cli-zig/src/**', 'apps/cli-zig/build.zig', 'build.zig', 'build.zig.zon', 'third-party/*/build.zig.zon', 'apps/photosphere-frontend/src/**', 'packages/**/src/**', 'apps/photosphere/native/ios/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the built app and CLI
        id: built
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app
            out/psi
          key: ${{ steps.built-key.outputs.key }}

      - name: Restore the build's Zig build cache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-app-build-ios-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-app-build-ios-

      # ReleaseSafe, because in Debug Zig's standard library aborts on an EISCONN from connect on Apple platforms ("programmer bug
      # caused syscall error: ISCONN"), where ReleaseSafe returns an error the code handles. Side by side, because each spends most
      # of its time compiling one Zig module, which takes one core, and they use different library directories.
      - name: Build the app for the iOS simulator and the Zig CLI
        if: steps.built.outputs.cache-hit != 'true'
        shell: bash
        run: |
          /usr/bin/time -p bun run --filter=ziggy build:ios -- --sdk simulator --configuration Release --native-dir "$PWD/out/app/native" --build-dir "$PWD/out/app/xcode" > "$RUNNER_TEMP/app-build.log" 2>&1 &
          app_pid=$!
          /usr/bin/time -p zig build -Dcpu=baseline --prefix out/psi > "$RUNNER_TEMP/psi-build.log" 2>&1 &
          psi_pid=$!
          app_status=0
          wait "$app_pid" || app_status=$?
          psi_status=0
          wait "$psi_pid" || psi_status=$?
          echo "::group::App build"
          cat "$RUNNER_TEMP/app-build.log"
          echo "::endgroup::"
          echo "::group::Zig CLI build"
          cat "$RUNNER_TEMP/psi-build.log"
          echo "::endgroup::"
          if [ "$app_status" -ne 0 ] || [ "$psi_status" -ne 0 ]; then
              echo "::error::The app build exited $app_status and the Zig CLI build $psi_status."
              exit 1
          fi

      - name: Save the built app and CLI
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/app
            out/psi
          key: ${{ steps.built-key.outputs.key }}

      - name: Save the build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-app-build-ios-${{ github.sha }}

      # A tar, which keeps the app bundle's symlinks and the executable bits an artifact would lose.
      - name: Pack the build
        shell: bash
        run: tar -cf "$RUNNER_TEMP/build.tar" out/app/xcode/Build/Products/Release-iphonesimulator/Photosphere.app out/psi

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: test-build-ios
          path: ${{ runner.temp }}/build.tar
          retention-days: 1
          compression-level: 1

  # One shard of the app smoke tests per runner, each on the runner's first available iPhone simulator.
  app-smoke-tests:
    timeout-minutes: 40
    needs: [build]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Two simulators a runner, and four shards: eight scenarios at once, and five jobs with the build, which is exactly the account's
      # quota of macOS runners so nothing in this workflow queues behind anything else in it.
      #
      # Three simulators a runner was tried and is worse: on a 3-core runner the boot of three took 8.8 minutes and simctl install then
      # hung for 12, so no scenario started on any shard in 20 minutes. Six shards of two wanted seven jobs, and three of them started
      # six to fifteen minutes in, which was most of what put this workflow past 20 minutes.
      #
      # No cache of the simulators' data: it was tried to skip the one-time data migration a simulator runs at a new Xcode version, but
      # restoring several gigabytes took longer than the migration it saved, four minutes before any scenario on every shard.
      - name: Start booting two simulators
        shell: bash
        run: |
          udids="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | .[0:2] | .[].udid')"
          count="$(printf '%s\n' "$udids" | grep -c .)"
          if [ "$count" -lt 2 ]; then
              echo "There are $count available iPhone simulators, and each shard needs two." >&2
              exit 1
          fi
          for udid in $udids; do
              echo "Booting $udid"
              xcrun simctl boot "$udid"
          done
          echo "PHOTOSPHERE_IOS_SIMULATORS=$(printf '%s ' $udids)" >> "$GITHUB_ENV"
          echo "PHOTOSPHERE_IOS_UDIDS_WAITING=$(printf '%s ' $udids)" >> "$GITHUB_ENV"
          # Not waited for here: booting runs beside the checkout, the setup and the install below, and is waited for just before the
          # scenarios start. Waiting here made the boot and the install serial: on a slow runner those two steps alone took 11 minutes.

      - name: Checkout code
        uses: actions/checkout@v4

      # No Node.js and no Zig packages: this job installs the app on a simulator and runs the scenarios, and it never runs
      # zig build, because the psi it uses is the one the build job uploaded. Both cost it minutes.
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig and jq (versions from mise.toml)
        uses: ./.github/actions/setup-zig-tools

      # The scenarios build their database fixtures with the CLI, which needs ImageMagick and ffmpeg.
      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree rsync
          verify: magick|convert ffmpeg ffprobe

      # No toolchain check: setup:ios runs xcodebuild -version and looks for simctl, and this job only installs the app on a
      # simulator. The build job, which runs Xcode, checks it. It cost 1.4 minutes a shard.

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: test-build-ios
          path: ${{ runner.temp }}

      - name: Unpack the build
        shell: bash
        run: tar -xf "$RUNNER_TEMP/build.tar"

      # The install of this app on a simulator that has never had it took most of a shard's scenarios in the first run: the first
      # scenario was still in it when the step's 12 minutes ran out. Installed here, once per simulator, each scenario's own install
      # finds what it expects and the cost is paid once, beside the setup, instead of inside the first scenario's time.
      #
      # The two installs run side by side because each is minutes of copying and they do not touch each other's simulator: one at a
      # time this step was 295 seconds on a runner whose two simulators are independent.
      - name: Install the app on each simulator
        shell: bash
        run: |
          set -uo pipefail
          app="$PWD/out/app/xcode/Build/Products/Release-iphonesimulator/Photosphere.app"
          pids=""
          udids=""
          for udid in $PHOTOSPHERE_IOS_SIMULATORS; do
              xcrun simctl install "$udid" "$app" > "$RUNNER_TEMP/install-$udid.log" 2>&1 &
              pids="$pids $!"
              udids="$udids $udid"
          done
          set -- $udids
          failed=0
          for pid in $pids; do
              udid="$1"
              shift
              if wait "$pid"; then
                  echo "Installed the app on $udid"
              else
                  echo "::error::Installing the app on $udid failed."
                  cat "$RUNNER_TEMP/install-$udid.log" >&2
                  failed=1
              fi
          done
          exit "$failed"

      # The boot started above has had the whole of the setup to itself, and has to be finished before any scenario starts: a
      # scenario that begins on a simulator that is still starting waits minutes for its app.
      - name: Wait for the simulators to finish booting
        shell: bash
        run: |
          for udid in $PHOTOSPHERE_IOS_UDIDS_WAITING; do
              echo "Waiting for $udid to finish booting"
              xcrun simctl bootstatus "$udid" -b
          done

      # The first launch of the app on a simulator can block for ten minutes while the simulator finishes its own first-run work.
      # Inside a scenario that block ran into the scenario's 600 second limit and cost a whole shard: 604 seconds twice, and the app
      # appeared a second after the second one was killed. Launched here first, and capped, the wait happens once per simulator
      # before any scenario, and a simulator that will not launch says so here rather than failing a scenario it never ran.
      - name: Launch the app once on each simulator, so the first launch is not a scenario's
        shell: bash
        run: |
          for udid in $PHOTOSPHERE_IOS_SIMULATORS; do
              echo "Launching the app once on $udid"
              xcrun simctl launch "$udid" au.com.codecapers.photosphere.ziggy > /dev/null 2>&1 &
              launch_pid=$!
              waited=0
              while kill -0 "$launch_pid" 2>/dev/null; do
                  if [ "$waited" -ge 240 ]; then
                      echo "::warning::The first launch on $udid took longer than 240s and was abandoned."
                      kill "$launch_pid" 2>/dev/null || true
                      break
                  fi
                  sleep 1
                  waited=$((waited + 1))
              done
              xcrun simctl terminate "$udid" au.com.codecapers.photosphere.ziggy > /dev/null 2>&1 || true
              echo "The first launch on $udid took ${waited}s"
          done

      - name: Run shard ${{ matrix.shard }} of the Photosphere App iOS smoke tests
        timeout-minutes: 12
        shell: bash
        env:
          # Two at once, matching the two simulators this job boots.
          PHOTOSPHERE_TEST_PARALLEL: "2"
          PHOTOSPHERE_SMOKE_SHARD: ${{ matrix.shard }}/4
        run: PHOTOSPHERE_SMOKE_BUILD="$PWD/out/app" PHOTOSPHERE_SMOKE_PSI="$PWD/out/psi/bin/psi" bun run test:ziggy:ios

      - name: Collect the logs of failed scenarios and any crash reports
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-smoke-logs/crash-reports"
          if [ -d "${TMPDIR%/}/photosphere-tests" ]; then
              cp -R "${TMPDIR%/}/photosphere-tests" "$RUNNER_TEMP/app-smoke-logs/"
          fi
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
              cp -R "$HOME/Library/Logs/DiagnosticReports/." "$RUNNER_TEMP/app-smoke-logs/crash-reports/"
          fi

      - name: Upload the logs of failed scenarios and any crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs-ios-${{ matrix.shard }}
          path: ${{ runner.temp }}/app-smoke-logs
          retention-days: 5
