# The tests on iOS, on every push and on demand, made to report as fast as possible. build builds the Photosphere App for the iOS
# simulator and the Zig CLI for the runner's macOS, which makes the scenarios' fixtures, and uploads both. The app smoke tests are split
# across runners, each running one shard of the scenarios on two simulators of its own. The shards depend on build rather than waiting for its
# upload, because a shard that waits holds one of the account's five macOS runners, which the macOS test workflows share, and the build
# may be queued for one. The Zig unit tests are not run here: on this runner they are the same command as Test macOS arm64 runs.
# Nothing is packaged: the release workflow does that.
name: Test iOS

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  # brew install updates Homebrew itself first, and cleans up after, unless told not to; the runner's Homebrew is recent enough.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

# A newer push to the same branch supersedes a run still going, so only the latest commit's results are waited for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Check the iOS toolchain
        run: bun run --filter=ziggy setup:ios

      - name: Restore the third-party libraries for the runner
        uses: ./.github/actions/third-party-libraries
        with:
          platform: macos-arm64
          build-args: -Dtarget=aarch64-macos.11.0

      - name: Restore the third-party libraries for the iOS simulator
        uses: ./.github/actions/third-party-libraries
        with:
          platform: ios
          build-args: -Dtarget=aarch64-ios.14.0-simulator
          config-name: aarch64-ios-simulator

      # The finished app and CLI, keyed on everything they are built from, so a commit that changes only the tests pays no build. An
      # exact match only, so nothing is restored for a commit whose Zig code, page or libraries differ.
      - name: Restore the built app and CLI
        id: built
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app
            out/psi
          key: ${{ runner.os }}-${{ runner.arch }}-test-built-ios-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon', 'apps/photosphere-frontend/src/**', 'packages/**/src/**', 'apps/photosphere/native/ios/**', 'apps/photosphere/scripts/**') }}

      - name: Restore the build's Zig build cache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-app-build-ios-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-app-build-ios-

      # ReleaseSafe, because in Debug Zig's standard library aborts on an EISCONN from connect on Apple platforms ("programmer bug
      # caused syscall error: ISCONN"), where ReleaseSafe returns an error the code handles. Side by side, because each spends most
      # of its time compiling one Zig module, which takes one core, and they use different library directories.
      - name: Build the app for the iOS simulator and the Zig CLI
        if: steps.built.outputs.cache-hit != 'true'
        shell: bash
        run: |
          /usr/bin/time -p bun run --filter=ziggy build:ios -- --sdk simulator --configuration Release --native-dir "$PWD/out/app/native" --build-dir "$PWD/out/app/xcode" > "$RUNNER_TEMP/app-build.log" 2>&1 &
          app_pid=$!
          /usr/bin/time -p zig build -Dcpu=baseline --prefix out/psi > "$RUNNER_TEMP/psi-build.log" 2>&1 &
          psi_pid=$!
          app_status=0
          wait "$app_pid" || app_status=$?
          psi_status=0
          wait "$psi_pid" || psi_status=$?
          echo "::group::App build"
          cat "$RUNNER_TEMP/app-build.log"
          echo "::endgroup::"
          echo "::group::Zig CLI build"
          cat "$RUNNER_TEMP/psi-build.log"
          echo "::endgroup::"
          if [ "$app_status" -ne 0 ] || [ "$psi_status" -ne 0 ]; then
              echo "::error::The app build exited $app_status and the Zig CLI build $psi_status."
              exit 1
          fi

      - name: Save the built app and CLI
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/app
            out/psi
          key: ${{ runner.os }}-${{ runner.arch }}-test-built-ios-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon', 'apps/photosphere-frontend/src/**', 'packages/**/src/**', 'apps/photosphere/native/ios/**', 'apps/photosphere/scripts/**') }}

      - name: Save the build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-app-build-ios-${{ github.sha }}

      # A tar, which keeps the app bundle's symlinks and the executable bits an artifact would lose.
      - name: Pack the build
        shell: bash
        run: tar -cf "$RUNNER_TEMP/build.tar" out/app/xcode/Build/Products/Release-iphonesimulator/Photosphere.app out/psi

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: test-build-ios
          path: ${{ runner.temp }}/build.tar
          retention-days: 1
          compression-level: 1

  # One shard of the app smoke tests per runner, each on the runner's first available iPhone simulator.
  app-smoke-tests:
    timeout-minutes: 40
    needs: [build]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # Two simulators a runner, so each runner runs two scenarios at once and the shards take two of the five macOS runners rather
      # than four. PHOTOSPHERE_IOS_SIMULATORS hands them to the scenarios.
      - name: Start booting two simulators
        shell: bash
        run: |
          udids="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | .[0:2] | .[].udid')"
          count="$(printf '%s\n' "$udids" | grep -c .)"
          if [ "$count" -lt 2 ]; then
              echo "There are $count available iPhone simulators, and the shards need two." >&2
              exit 1
          fi
          for udid in $udids; do
              echo "Booting $udid"
              xcrun simctl boot "$udid"
          done
          echo "PHOTOSPHERE_IOS_SIMULATORS=$(printf '%s ' $udids)" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # The scenarios build their database fixtures with the CLI, which needs ImageMagick and ffmpeg.
      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree rsync
          verify: magick|convert ffmpeg ffprobe

      - name: Check the iOS toolchain
        run: bun run --filter=ziggy setup:ios

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: test-build-ios
          path: ${{ runner.temp }}

      - name: Unpack the build
        shell: bash
        run: tar -xf "$RUNNER_TEMP/build.tar"

      - name: Run shard ${{ matrix.shard }} of the Photosphere App iOS smoke tests
        timeout-minutes: 35
        shell: bash
        env:
          PHOTOSPHERE_SMOKE_SHARD: ${{ matrix.shard }}/2
        run: PHOTOSPHERE_SMOKE_BUILD="$PWD/out/app" PHOTOSPHERE_SMOKE_PSI="$PWD/out/psi/bin/psi" bun run test:ziggy:ios

      - name: Collect the logs of failed scenarios and any crash reports
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-smoke-logs/crash-reports"
          if [ -d "${TMPDIR%/}/photosphere-tests" ]; then
              cp -R "${TMPDIR%/}/photosphere-tests" "$RUNNER_TEMP/app-smoke-logs/"
          fi
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
              cp -R "$HOME/Library/Logs/DiagnosticReports/." "$RUNNER_TEMP/app-smoke-logs/crash-reports/"
          fi

      - name: Upload the logs of failed scenarios and any crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs-ios-${{ matrix.shard }}
          path: ${{ runner.temp }}/app-smoke-logs
          retention-days: 5
