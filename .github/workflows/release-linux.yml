# The Photosphere App and the Zig CLI for Linux, each built once and then tested, packaged and released. prepare-tag resolves the
# release tag, and each third-party library (the AWS SDK for C, zlib-ng, ImageMagick and FFmpeg) has its own job that builds and
# caches it, all side by side. Then app-build builds the app and cli-build builds the CLI, side by side, over those libraries, and
# each saves what it built in the cache under a key of its own for this run. The later jobs restore that instead of building:
# app-smoke-tests runs the app build, package packages the app over the restored Zig build cache and cli-smoke-tests runs the CLI.
# zig-unit-tests runs the Zig unit tests on Linux over the Linux libraries and the TypeScript jobs compile and test the TypeScript. create-release, once every other job has passed, publishes the
# package and the CLI.
name: Release Linux

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  WHAT_CHANGED_VERSION: "v0.0.6"
  # Each platform has a workflow of its own, so a failure on one shows at a glance and holds up no other platform's release.
  # Its release tags are <RELEASE_PLATFORM>-v1.2.3, and its GitHub release is zig-<that tag>.
  RELEASE_PLATFORM: "linux"
  RELEASE_PLATFORM_NAME: "Linux"

on:
  # TODO: Turn the push and pull request triggers back on once every Zig release workflow passes. Until then each one is run manually.
  push:
    branches:
      - "*"
  #   tags:
  #     - 'linux-v*.*.*'

  # pull_request:
  #   branches:
  #     - main

  workflow_dispatch:
    inputs:
      release:
        description: "Release action. none = nightly build. update-latest = move the latest linux-v*.*.* tag to this commit and re-release it. new-patch = create the next patch tag (e.g. linux-v0.0.8 -> linux-v0.0.9) and release it."
        type: choice
        options:
          - none
          - update-latest
          - new-patch
        default: none

jobs:
  # Resolves the release tag once, before anything is built, because it can create and push a tag. Its outputs, the tag and
  # whether this run is a release, are read by app-build, cli-build, package and create-release, so the two builds run side by side.
  prepare-tag:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      is-release: ${{ steps.resolve.outputs.is-release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          RELEASE_INPUT="${{ inputs.release }}"
          PREFIX="${RELEASE_PLATFORM}-v"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "update-latest" ]; then
            TAG=$(git tag --list "${PREFIX}*.*.*" --sort=-version:refname | head -1)
            if [ -z "$TAG" ]; then
              echo "No existing ${PREFIX}*.*.* tag to update"
              exit 1
            fi
            git tag -f "$TAG"
            git push --force origin "$TAG"
            IS_RELEASE="true"
          elif [ "$RELEASE_INPUT" = "new-patch" ]; then
            LATEST=$(git tag --list "${PREFIX}*.*.*" --sort=-version:refname | head -1)
            if [ -z "$LATEST" ]; then
              LATEST="${PREFIX}0.0.0"
            fi
            MAJOR=$(echo "${LATEST#"$PREFIX"}" | cut -d. -f1)
            MINOR=$(echo "${LATEST#"$PREFIX"}" | cut -d. -f2)
            PATCH=$(echo "${LATEST#"$PREFIX"}" | cut -d. -f3)
            TAG="${PREFIX}${MAJOR}.${MINOR}.$((PATCH + 1))"
            git tag "$TAG"
            git push origin "$TAG"
            IS_RELEASE="true"
          else
            TAG=""
            IS_RELEASE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is-release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Resolved tag: '$TAG' (is-release: $IS_RELEASE)"

  # The third-party libraries, each built once by its own action and cached under the same keys as the Zig CI workflow, so a
  # library either workflow has already built is restored rather than compiled again. Every job that runs the Zig build
  # restores them from that cache with the third-party-libraries action.
  build-aws-sdk:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the AWS SDK for C
        uses: ./.github/actions/build-aws-sdk
        with:
          platform: linux-x64

  build-zlib-ng:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build zlib-ng
        uses: ./.github/actions/build-zlib-ng
        with:
          platform: linux-x64

  build-imagemagick:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ImageMagick
        uses: ./.github/actions/build-imagemagick
        with:
          platform: linux-x64

  build-ffmpeg:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FFmpeg
        uses: ./.github/actions/build-ffmpeg
        with:
          platform: linux-x64

  # Restores the third-party libraries the library jobs built and builds the Photosphere App for Linux by the same build script a
  # developer runs. The version comes from the release tag: linux-v1.2.3 is 1.2.3 and a nightly is dev-nightly.<timestamp>. Each
  # library job caches its library, so this job restores it. The build, the Zig build cache and the
  # libraries are saved under photosphere-app-linux-<commit>-<run>, which app-smoke-tests and package restore.
  app-build:
    timeout-minutes: 120
    needs: [prepare-tag, build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The Linux native app links the runtime libraries by file name, so no development packages are needed. WebKitGTK plays
      # video through GStreamer, so the packaged app depends on those plugins.
      - name: Install the build and packaging tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 libgdk-pixbuf-2.0-0 gstreamer1.0-plugins-good gstreamer1.0-libav zip
          verify: zip

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#"${RELEASE_PLATFORM}-v"}"
            VERSION="$(bash ./scripts/set-build-config.sh --tag "$VERSION" --commit "${{ github.sha }}")"
          else
            VERSION="$(bash ./scripts/set-build-config.sh --commit "${{ github.sha }}")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # The app is built into out/app, laid out as apps/photosphere-smoke-tests/run.md describes, which is where the smoke tests take
      # it from.
      - name: Build
        shell: bash
        # The release build, minified and stripped, so the smoke tests run what ships and the package job packages this build
        # rather than compiling the app again.
        run: bun run --filter=ziggy build:linux -- --prefix "$PWD/out/app" --minify --strip

      - name: Save the Photosphere App build
        uses: actions/cache/save@v4
        with:
          path: |
            out/app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-linux-${{ github.sha }}-${{ github.run_id }}

  cli-build:
    # Restores the third-party libraries the library jobs built and builds the Zig CLI for Linux x64 on a runner of that platform. Nothing here
    # cross-compiles, so a build that works is a build that runs on the platform it names. It needs app-build only for the
    # release tag the CLI's version is stamped from.
    #
    # This is the only job that builds the Zig CLI: the binary, the Zig build cache and the libraries are saved under
    # photosphere-cli-linux-<commit>-<run>, which cli-smoke-tests and create-release restore, so the binary is built once and used
    # by both.
    timeout-minutes: 60
    needs: [prepare-tag, build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Restore the Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-build-

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # `zig build` keeps one HTTP client for its whole run. It fetches the eager packages, compiles and runs
      # the build script, then fetches the lazy packages the script asked for, reusing the keep-alive
      # connections it pooled during the first fetch. By then the server has closed them, and Zig 0.16's
      # client takes a pooled connection without checking it is still open and does not retry, so a lazy
      # download fails with "invalid HTTP response: HttpConnectionClosing" whenever the package cache missed.
      # --fetch=all fetches every package, lazy ones included, in one pass and exits before the build script
      # runs, so no download waits behind it.
      - name: Fetch every package Zig needs, lazy ones included, in one pass
        working-directory: .
        run: zig build --fetch=all

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      # Stamps the release's version and commit into the CLI's config before it is compiled, the same way app-build does for
      # the app. Without it the released CLI says it is version "dev".
      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#"${RELEASE_PLATFORM}-v"}"
            bash ./scripts/set-build-config.sh --tag "$VERSION" --commit "${{ github.sha }}"
          else
            bash ./scripts/set-build-config.sh --commit "${{ github.sha }}"
          fi

      - name: Build the Zig CLI natively for Linux x64
        working-directory: .
        run: zig build -Dcpu=baseline --prefix apps/cli-zig/bin/x64/linux --prefix-exe-dir .

      - name: Check the binary was produced
        working-directory: ./apps/cli-zig
        run: |
          ls -la bin/x64/linux/psi
          file bin/x64/linux/psi

      # The binary is renamed to say which CLI it is, because the TypeScript CLI is also called psi and
      # unpacking both releases into one directory would otherwise overwrite one with the other.
      - name: Collect the Zig CLI binary
        shell: bash
        run: |
          mkdir -p out
          chmod +x apps/cli-zig/bin/x64/linux/psi
          cp apps/cli-zig/bin/x64/linux/psi out/photosphere-cli-zig-linux-x64
          ls -la out

      - name: Save the Zig CLI build
        uses: actions/cache/save@v4
        with:
          path: |
            out
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-cli-linux-${{ github.sha }}-${{ github.run_id }}

      - name: Save the Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}

  cli-smoke-tests:
    # The Zig CLI smoke suites, because the byte-identical output (gzip OS byte, paths, file times) differs
    # between platforms. The unit tests are in the Zig CI workflow, so a failure in one is not
    # reported as a failure of the other.
    # The binary is not built here: cli-build builds it and this job restores it from the cache, so the Zig CLI
    # is compiled once and both this job and the release use it.
    # Setup takes about 5 minutes and the smoke suites about 15.
    timeout-minutes: 75
    needs: [cli-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig
      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install
      - name: Install media processing tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe
      - name: Show the disk space the Zig builds use (each package that builds the AWS SDK for C has its own zig-pkg and .zig-cache)
        if: always()
        shell: bash
        run: |
          df -h .
          du -sh packages/*/zig-pkg packages/*/.zig-cache apps/*/zig-pkg apps/*/.zig-cache 2>/dev/null || true
      # The smoke suites run the built binary rather than `bun run start`, at the path their common.sh reads. The suites also
      # run the Zig build of the CLI, which links the libraries cli-build saved with the binary, over the Zig build cache saved
      # with them.
      - name: Restore the Zig CLI build
        uses: actions/cache/restore@v4
        with:
          path: |
            out
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-cli-linux-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Put the Zig CLI where the smoke suites look for it
        shell: bash
        run: |
          mkdir -p zig-out/bin
          cp out/photosphere-cli-zig-linux-x64 zig-out/bin/psi
          # The smoke suites fail with exit 126 (found but not executable) without the executable bit.
          chmod +x zig-out/bin/psi
          ls -la zig-out/bin
      - name: Run the Zig CLI smoke tests
        timeout-minutes: 30
        working-directory: ./apps/cli
        shell: bash
        # The suites run the psi cli-build built, put in place above, rather than building another.
        run: PHOTOSPHERE_SMOKE_PSI="$PWD/../../zig-out/bin/psi" ./smoke-tests-zig.sh --binary
      - name: Test the Zig version command
        working-directory: ./apps/cli
        shell: bash
        run: |
          echo "Testing version command after building..."
          ../../zig-out/bin/psi version

  app-smoke-tests:
    # The Photosphere App's smoke tests on Linux, run under xvfb, on the app app-build built, which PHOTOSPHERE_SMOKE_BUILD names.
    # The CLI that makes the scenarios' fixtures is the one cli-build built.
    timeout-minutes: 75
    needs: [app-build, cli-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # The app's runtime libraries (as in app-build), and xvfb, which lib/linux.sh runs the app under.
      # The scenarios build their database fixtures with the CLI from source, which needs ImageMagick and ffmpeg.
      - name: Install the runtime libraries, xvfb and media processing tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 libgdk-pixbuf-2.0-0 gstreamer1.0-plugins-good gstreamer1.0-libav xvfb imagemagick ffmpeg
          verify: xvfb-run magick|convert ffmpeg ffprobe

      - name: Restore the Photosphere App build
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-linux-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      # The psi the scenarios run as the other side of a LAN share is the one cli-build built, so the smoke runner does not
      # build it again. The paths are the ones cli-build saves, since the cache only matches a restore that lists the same.
      - name: Restore the Zig CLI build
        uses: actions/cache/restore@v4
        with:
          path: |
            out
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-cli-linux-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Run the Photosphere App smoke tests
        timeout-minutes: 60
        shell: bash
        run: |
          # cli-smoke-tests runs this same restored psi only after giving it the executable bit (exit 126 without it), so this does too.
          chmod +x out/photosphere-cli-zig-linux-x64
          PHOTOSPHERE_SMOKE_BUILD="$PWD/out/app" PHOTOSPHERE_SMOKE_PSI="$PWD/out/photosphere-cli-zig-linux-x64" bun run test:ziggy

  # Compiles the TypeScript, which is the only check of its types: the unit tests run it without checking them.
  typescript-compile:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      # bun run compile records a what-changed baseline when it succeeds.
      - name: Install what-changed
        uses: ./.github/actions/install-what-changed

      - name: Compile TypeScript
        timeout-minutes: 12
        run: bun run compile

  # The TypeScript unit tests.
  typescript-unit-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Run unit tests
        timeout-minutes: 12
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh

  # The unit tests of the Zig CLI and of every Zig package.
  zig-unit-tests:
    timeout-minutes: 50
    needs: [build-aws-sdk, build-zlib-ng, build-imagemagick, build-ffmpeg, cli-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Install media processing tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      # The libraries the build jobs built, restored from the cache for the Zig build to link.
      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: linux-x64

      # Zig skips any compile step whose inputs are unchanged and already in .zig-cache. Without this the test binaries and psi are
      # compiled from nothing every run, which is most of this job's time. The key changes with any Zig source, and the newest
      # earlier cache is restored when there is no exact match, so only the binaries a change touches are compiled again.
      # The next step lays the Linux CLI build's cache over it.
      - name: Cache Zig's build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', '**/*.zig', '**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      # The Zig build cache the Linux CLI build of this commit saved, laid over the test build's own, so Zig reuses any compile step
      # the two builds have in common. Nothing is restored when no Linux CLI build of this commit has saved one.
      - name: Restore the Linux CLI build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-build-${{ github.sha }}

      - name: Start a fresh Zig build cache when the restored one has grown too big
        shell: bash
        run: |
          if [ -d .zig-cache ]; then
              megabytes="$(du -sm .zig-cache | cut -f1)"
              echo "Restored Zig build cache: ${megabytes} MB"
              if [ "$megabytes" -ge 5120 ]; then
                  mv .zig-cache "$RUNNER_TEMP/stale-zig-cache"
                  echo "Moved it aside to start a fresh one"
              fi
          fi

      # Built for any x86-64 CPU. Built for the runner's own, which differs from run to run, every compile step missed the build cache
      # restored above, so each run compiled everything again.
      - name: Run the Zig unit tests
        timeout-minutes: 40
        shell: bash
        run: zig build test -Dcpu=baseline --summary all --test-timeout 20m

  # Packages the Photosphere App for Linux, unsigned, by the same package script a developer runs, over the Zig build cache and the
  # libraries app-build saved, so the Zig build starts warm. It stamps the version the way app-build does. The package is saved
  # under photosphere-package-linux-<commit>-<run>, which create-release restores. It runs beside the smoke tests.
  package:
    timeout-minutes: 120
    needs: [prepare-tag, app-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Cache the packages Zig fetches (the AWS SDK for C archives in Zig's global cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig/p
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The Linux native app links the runtime libraries by file name, so no development packages are needed. WebKitGTK plays
      # video through GStreamer, so the packaged app depends on those plugins.
      - name: Install the build and packaging tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 libgdk-pixbuf-2.0-0 gstreamer1.0-plugins-good gstreamer1.0-libav zip
          verify: zip

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Restore the Photosphere App build
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-app-linux-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Set config
        shell: bash
        run: |
          if [ "${{ needs.prepare-tag.outputs.is-release }}" = "true" ]; then
            VERSION="${{ needs.prepare-tag.outputs.tag }}"
            VERSION="${VERSION#"${RELEASE_PLATFORM}-v"}"
            VERSION="$(bash ./scripts/set-build-config.sh --tag "$VERSION" --commit "${{ github.sha }}")"
          else
            VERSION="$(bash ./scripts/set-build-config.sh --commit "${{ github.sha }}")"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Package
        shell: bash
        run: bun run --filter=ziggy package:linux -- --binary "$PWD/out/app" --version "$VERSION" --output-dir "$PWD/out/package"

      - name: Save the Photosphere App package
        uses: actions/cache/save@v4
        with:
          path: out/package
          key: photosphere-package-linux-${{ github.sha }}-${{ github.run_id }}

  # Publishes the package the package job made and the CLI cli-build built, restored from the cache under their keys, once every
  # other job has passed. A restore matches only a save of the same paths, so each restores the whole save.
  create-release:
    timeout-minutes: 20
    needs: [prepare-tag, app-build, cli-build, cli-smoke-tests, app-smoke-tests, package, typescript-compile, typescript-unit-tests, zig-unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the Photosphere App package
        uses: actions/cache/restore@v4
        with:
          path: out/package
          key: photosphere-package-linux-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Restore the Zig CLI build
        uses: actions/cache/restore@v4
        with:
          path: |
            out
            .zig-cache
            third-party/aws/zig-out
            third-party/zlib-ng/zig-out
            third-party/imagemagick/zig-out
            third-party/ffmpeg/zig-out
          key: photosphere-cli-linux-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Put the Photosphere App packages and the Zig CLI where the release steps read them
        shell: bash
        run: |
          mkdir -p ./artifacts/app ./artifacts/zig
          cp out/package/*.zip out/package/*.deb ./artifacts/app/
          cp out/photosphere-cli-zig-linux-x64 ./artifacts/zig/
          ls -la ./artifacts/app ./artifacts/zig

      - name: Create compressed archives
        run: |
          # The Zig CLI, with the binary named after the platform it is for.
          cd ./artifacts/zig
          # A name that is missing or misspelled fails the step with this message rather than with chmod's,
          # which says nothing about what is wrong.
          if [ ! -f photosphere-cli-zig-linux-x64 ]; then
              echo "::error::The Zig build job did not produce photosphere-cli-zig-linux-x64. Uploaded: $(ls)"
              exit 1
          fi
          chmod +x photosphere-cli-zig-linux-x64
          tar -czf ../photosphere-cli-zig-linux-x64.tar.gz photosphere-cli-zig-linux-x64
          cd ../..

      - name: Generate release notes
        id: release-notes
        run: |
          # The CLI commits made since the last release tag, as bullets. The same script produces the
          # notes for the Android tester builds, so a release and a tester build never describe the
          # same commits differently. The tag being built is excluded so a tagged release measures
          # from the tag before it; for a nightly the tag is empty and nothing is excluded.
          RELEASE_NOTES=$(bash ./scripts/release-notes.sh \
            --prefix cli \
            --exclude-tag "${{ needs.prepare-tag.outputs.tag }}" \
            --tag-pattern "${RELEASE_PLATFORM}-v*.*.*" \
            --empty-message "- No CLI-related commits found")

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Generated release notes:"
          echo "$RELEASE_NOTES"

      - name: Delete existing nightly release
        if: needs.prepare-tag.outputs.is-release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${RELEASE_PLATFORM}-nightly" --yes --cleanup-tag || true
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-tag.outputs.is-release == 'true' && needs.prepare-tag.outputs.tag || format('{0}-nightly', env.RELEASE_PLATFORM) }}
          # The zig- tag does not exist yet, so the release creates it. Without this it would be created on the default branch rather than on the commit that was built.
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare-tag.outputs.is-release == 'true' && format('Photosphere {0} {1}', env.RELEASE_PLATFORM_NAME, needs.prepare-tag.outputs.tag) || format('Photosphere {0} Nightly', env.RELEASE_PLATFORM_NAME) }}
          draft: false
          prerelease: ${{ needs.prepare-tag.outputs.is-release != 'true' }}
          files: |
            ./artifacts/photosphere-cli-zig-linux-x64.tar.gz
            ./artifacts/app/*
          body: |
            ${{ needs.prepare-tag.outputs.is-release == 'true' && format('Photosphere {0} release {1}', env.RELEASE_PLATFORM_NAME, needs.prepare-tag.outputs.tag) || format('Photosphere {0} nightly build - {1}', env.RELEASE_PLATFORM_NAME, github.sha) }}

            ${{ needs.prepare-tag.outputs.is-release != 'true' && '⚠️ **This is a nightly build and may be unstable**' || '' }}
            ${{ needs.prepare-tag.outputs.is-release != 'true' && format('Built from commit: {0}', github.sha) || '' }}

            ## What's Changed
            ${{ steps.release-notes.outputs.RELEASE_NOTES }}

            ## CLI Download
            - **Linux**: `photosphere-cli-zig-linux-x64.tar.gz`

            ## CLI Installation
            1. Download the file
            2. Extract the archive
            3. Make the binary executable: `chmod +x photosphere-cli-zig-linux-x64`
            4. Move to your PATH or run directly

            ## Desktop Download
            - **Linux**: `.deb` package or `.zip`

            ## Bundled tools and licences
            ImageMagick (ImageMagick licence, an Apache-2.0-style licence) and FFmpeg (LGPL-2.1+) are built into the desktop and CLI builds, so neither has to be installed on the host system. Full attribution and licences are in [THIRD-PARTY-NOTICES.md](https://github.com/ashleydavis/photosphere/blob/main/THIRD-PARTY-NOTICES.md).
