# The tests on macOS, called by Test macOS arm64 and Test macOS x64 with the runner and the architecture. Every job here takes one of
# the account's five macOS runners, which Test iOS shares, so each platform has two jobs, both start at once and neither waits on the
# other. app builds the Photosphere App and the Zig CLI and runs every app smoke scenario on that runner. cli runs the Zig unit tests
# and builds the Zig CLI, then runs the CLI smoke tests. Each job builds its CLI from a second checkout, beside its other compile: both
# builds check and write the third-party library directories of the checkout they run in, and in one checkout side by side one found
# its directory gone part way ("FileNotFound" in findThirdPartyLibraries).
#
# Every test the release workflow runs is run, on builds made to compile fast rather than to ship: unstamped, so a push that changes no
# Zig code finds every compile step in the cache. They are ReleaseSafe and not Debug because in Debug Zig's standard library aborts on
# an EISCONN from connect on macOS ("programmer bug caused syscall error: ISCONN").

name: Test macOS

on:
  workflow_call:
    inputs:
      runner:
        description: The runner label, such as macos-latest.
        type: string
        required: true
      platform:
        description: The platform the third-party libraries are stored under, macos-arm64 or macos-x64.
        type: string
        required: true
      target:
        description: The Zig target the third-party libraries are built for, such as aarch64-macos.11.0.
        type: string
        required: true
      app-parallel:
        description: How many app smoke scenarios run at once on the runner.
        type: string
        required: true

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  # brew install updates Homebrew itself first, and cleans up after, unless told not to; the runner's Homebrew is recent enough.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  app:
    timeout-minutes: 60
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout code again, for the Zig CLI build
        uses: actions/checkout@v4
        with:
          path: psi-src

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # The scenarios build their database fixtures with the CLI, which needs ImageMagick and ffmpeg.
      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: ${{ inputs.platform }}
          build-args: -Dtarget=${{ inputs.target }}

      - name: Copy the third-party libraries into the second checkout
        shell: bash
        run: |
          for library in aws zlib-ng imagemagick ffmpeg; do
              cp -R "third-party/$library/zig-out" "psi-src/third-party/$library/"
          done

      # The key of the finished app and CLI, computed once here and used for the restore and the save alike: computing it in both
      # places gave two different keys, because hashFiles is not stable across a build. The archive alignment and Xcode never cache,
      # so a commit that changes only the tests still paid the whole build; with this it pays nothing. An exact match only, so nothing
      # is restored for a commit whose Zig code, page or libraries differ.
      - name: Work out the built-app cache key
        id: built-key
        shell: bash
        run: echo "key=${{ runner.os }}-${{ runner.arch }}-test-built-${{ inputs.platform }}-${{ hashFiles('mise.toml', 'packages-zig/**/src/**', 'packages-zig/**/build.zig', 'packages-zig/*.zig', 'apps/cli-zig/src/**', 'apps/cli-zig/build.zig', 'build.zig', 'build.zig.zon', 'third-party/*/build.zig.zon', 'apps/photosphere-frontend/src/**', 'packages/**/src/**', 'apps/photosphere/native/macos/**', 'apps/photosphere/scripts/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the built app and CLI
        id: built
        uses: actions/cache/restore@v4
        with:
          path: |
            out/app
            out/psi
          key: ${{ steps.built-key.outputs.key }}

      - name: Restore the app build's Zig build cache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-app-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-app-build-

      - name: Restore the Zig CLI build's Zig build cache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: psi-src/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-psi-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-psi-build-

      # Side by side, because each spends most of its time compiling one Zig module, which takes one core.
      - name: Build the app and the Zig CLI
        if: steps.built.outputs.cache-hit != 'true'
        shell: bash
        run: |
          /usr/bin/time -p bun run --filter=ziggy build:macos -- --configuration Release --native-dir "$PWD/out/app/native" --build-dir "$PWD/out/app/xcode" > "$RUNNER_TEMP/app-build.log" 2>&1 &
          app_pid=$!
          (cd psi-src && /usr/bin/time -p zig build -Dcpu=baseline --prefix "$GITHUB_WORKSPACE/out/psi") > "$RUNNER_TEMP/psi-build.log" 2>&1 &
          psi_pid=$!
          app_status=0
          wait "$app_pid" || app_status=$?
          psi_status=0
          wait "$psi_pid" || psi_status=$?
          echo "::group::App build"
          cat "$RUNNER_TEMP/app-build.log"
          echo "::endgroup::"
          echo "::group::Zig CLI build"
          cat "$RUNNER_TEMP/psi-build.log"
          echo "::endgroup::"
          if [ "$app_status" -ne 0 ] || [ "$psi_status" -ne 0 ]; then
              echo "::error::The app build exited $app_status and the Zig CLI build $psi_status."
              exit 1
          fi

      - name: Save the built app and CLI
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/app
            out/psi
          key: ${{ steps.built-key.outputs.key }}

      - name: Save the app build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-app-build-${{ github.sha }}

      - name: Save the Zig CLI build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: psi-src/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-psi-build-${{ github.sha }}

      # Shard 1 of 1 is every scenario, and like any shard it records no what-changed baseline, which this runner has no use for.
      - name: Run the Photosphere App smoke tests
        timeout-minutes: 30
        shell: bash
        env:
          PHOTOSPHERE_TEST_PARALLEL: ${{ inputs.app-parallel }}
          PHOTOSPHERE_SMOKE_SHARD: 1/1
        run: PHOTOSPHERE_SMOKE_BUILD="$PWD/out/app" PHOTOSPHERE_SMOKE_PSI="$PWD/out/psi/bin/psi" bun run test:ziggy

      - name: Collect the logs of failed scenarios and any crash reports
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-smoke-logs/crash-reports"
          if [ -d "${TMPDIR%/}/photosphere-tests" ]; then
              cp -R "${TMPDIR%/}/photosphere-tests" "$RUNNER_TEMP/app-smoke-logs/"
          fi
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
              cp -R "$HOME/Library/Logs/DiagnosticReports/." "$RUNNER_TEMP/app-smoke-logs/crash-reports/"
          fi

      - name: Upload the logs of failed scenarios and any crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs-${{ inputs.platform }}
          path: ${{ runner.temp }}/app-smoke-logs
          retention-days: 5

  cli:
    timeout-minutes: 60
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout code again, for the Zig CLI build
        uses: actions/checkout@v4
        with:
          path: psi-src

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: ${{ inputs.platform }}
          build-args: -Dtarget=${{ inputs.target }}

      - name: Copy the third-party libraries into the second checkout
        shell: bash
        run: |
          for library in aws zlib-ng imagemagick ffmpeg; do
              cp -R "third-party/$library/zig-out" "psi-src/third-party/$library/"
          done

      # One cache for the unit tests and scenario 75's `zig build test-integration`, which share most compile steps.
      - name: Cache Zig's build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', 'packages-zig/**/src/**', 'packages-zig/**/build.zig', 'packages-zig/*.zig', 'apps/cli-zig/src/**', 'apps/cli-zig/build.zig', 'build.zig', 'build.zig.zon', 'third-party/*/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      # The CLI the app job's build saved, when the Zig code it is made from is unchanged, so this job does not compile it again. The
      # key is worked out once here, as the app job does, and used to restore and to save alike.
      - name: Work out the built-app cache key
        id: built-key
        shell: bash
        run: echo "key=${{ runner.os }}-${{ runner.arch }}-test-built-${{ inputs.platform }}-${{ hashFiles('mise.toml', 'packages-zig/**/src/**', 'packages-zig/**/build.zig', 'packages-zig/*.zig', 'apps/cli-zig/src/**', 'apps/cli-zig/build.zig', 'build.zig', 'build.zig.zon', 'third-party/*/build.zig.zon', 'apps/photosphere-frontend/src/**', 'packages/**/src/**', 'apps/photosphere/native/macos/**', 'apps/photosphere/scripts/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the built app and CLI
        id: built
        uses: actions/cache/restore@v4
        with:
          path: out/psi
          key: ${{ steps.built-key.outputs.key }}

      - name: Restore the Zig CLI build's Zig build cache
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: psi-src/.zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-psi-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-psi-build-

      # The getImageDetails format test reads images from test/formats, which are made on the machine rather than committed.
      - name: Make the format test images
        shell: bash
        run: bash scripts/make-format-test-images.sh

      # Side by side, because each spends most of its time compiling one Zig module, which takes one core. The CLI smoke tests run
      # whether or not the unit tests passed, so one push reports both.
      - name: Run the Zig unit tests and build the Zig CLI
        shell: bash
        run: |
          /usr/bin/time -p zig build test -Dcpu=baseline --summary all --test-timeout 20m > "$RUNNER_TEMP/unit-tests.log" 2>&1 &
          test_pid=$!
          psi_status=0
          if [ "${{ steps.built.outputs.cache-hit }}" = "true" ]; then
              psi_pid=""
          else
              (cd psi-src && /usr/bin/time -p zig build -Dcpu=baseline --prefix "$GITHUB_WORKSPACE/out/psi") > "$RUNNER_TEMP/psi-build.log" 2>&1 &
              psi_pid=$!
          fi
          test_status=0
          wait "$test_pid" || test_status=$?
          if [ -n "$psi_pid" ]; then
              wait "$psi_pid" || psi_status=$?
          fi
          echo "::group::Zig unit tests"
          cat "$RUNNER_TEMP/unit-tests.log"
          echo "::endgroup::"
          if [ -n "$psi_pid" ]; then
              echo "::group::Zig CLI build"
              cat "$RUNNER_TEMP/psi-build.log"
              echo "::endgroup::"
          fi
          echo "UNIT_TEST_STATUS=$test_status" >> "$GITHUB_ENV"
          if [ "$psi_status" -ne 0 ]; then
              echo "::error::The Zig CLI build exited $psi_status."
              exit 1
          fi

      - name: Run the Zig CLI smoke tests
        timeout-minutes: 30
        working-directory: ./apps/cli-zig
        shell: bash
        run: PHOTOSPHERE_SMOKE_PSI="$PWD/../../out/psi/bin/psi" ./smoke-tests-zig.sh

      - name: Test the Zig version command
        shell: bash
        run: out/psi/bin/psi version

      - name: Report the Zig unit tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "${UNIT_TEST_STATUS:-missing}" != "0" ]; then
              echo "::error::The Zig unit tests exited ${UNIT_TEST_STATUS:-without running}. Their output is in the step above."
              exit 1
          fi

      - name: Collect the logs of failed CLI smoke tests
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-smoke-logs"
          if [ -d "${TMPDIR%/}/photosphere-tests" ]; then
              cp -R "${TMPDIR%/}/photosphere-tests" "$RUNNER_TEMP/cli-smoke-logs/"
          fi

      - name: Upload the logs of failed CLI smoke tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-logs-${{ inputs.platform }}
          path: ${{ runner.temp }}/cli-smoke-logs
          retention-days: 5
