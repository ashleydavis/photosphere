# The tests on macOS, called by Test macOS arm64 and Test macOS x64 with the runner and the architecture. Every job here takes one of
# the account's five macOS runners, which Test iOS shares, so each platform has two jobs and both start at once. cli builds the Zig CLI
# and uploads it, then runs the Zig unit tests and the CLI smoke tests. app builds the Photosphere App, takes the CLI cli uploaded, which
# is ready by then, and runs every app smoke scenario on that runner. Both build in ReleaseSafe: in Debug, Zig's standard library aborts
# on an EISCONN from connect on macOS ("programmer bug caused syscall error: ISCONN"), where ReleaseSafe returns an error the code
# handles. Nothing stamps a version into the build, as nothing does in a test run on a developer's machine, so a push that changes no
# Zig code finds every compile step in the Zig build cache.

name: Test macOS

on:
  workflow_call:
    inputs:
      runner:
        description: The runner label, such as macos-latest.
        type: string
        required: true
      platform:
        description: The platform the third-party libraries are stored under, macos-arm64 or macos-x64.
        type: string
        required: true
      target:
        description: The Zig target the third-party libraries are built for, such as aarch64-macos.11.0.
        type: string
        required: true
      app-parallel:
        description: How many app smoke scenarios run at once on the runner.
        type: string
        required: true

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

jobs:
  app:
    timeout-minutes: 60
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # The scenarios build their database fixtures with the CLI, which needs ImageMagick and ffmpeg.
      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: ${{ inputs.platform }}
          build-args: -Dtarget=${{ inputs.target }}

      - name: Restore the app build's Zig build cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-app-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-app-build-

      - name: Build the app
        shell: bash
        run: bun run --filter=ziggy build:macos -- --configuration Release --native-dir "$PWD/out/app/native" --build-dir "$PWD/out/app/xcode"

      - name: Save the app build's Zig build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-app-build-${{ github.sha }}

      # cli uploads the CLI before its tests, and builds less than this job does, so it is nearly always there already. A cli job that
      # has ended without uploading it ends the wait at once.
      - name: Wait for the Zig CLI the cli job builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
              if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].name' | grep -qx "test-psi-${{ inputs.platform }}"; then
                  exit 0
              fi
              ended="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select((.name | endswith("cli")) and .status == "completed") | .conclusion')"
              if [ -n "$ended" ]; then
                  echo "::error::The cli job ended ($ended) without uploading the Zig CLI."
                  exit 1
              fi
              sleep 5
          done
          echo "::error::The cli job did not upload the Zig CLI within 10 minutes."
          exit 1

      - name: Download the Zig CLI
        uses: actions/download-artifact@v4
        with:
          name: test-psi-${{ inputs.platform }}
          path: ${{ runner.temp }}

      - name: Unpack the Zig CLI
        shell: bash
        run: tar -xf "$RUNNER_TEMP/psi.tar"

      # Shard 1 of 1 is every scenario, and like any shard it records no what-changed baseline, which this runner has no use for.
      - name: Run the Photosphere App smoke tests
        timeout-minutes: 30
        shell: bash
        env:
          PHOTOSPHERE_TEST_PARALLEL: ${{ inputs.app-parallel }}
          PHOTOSPHERE_SMOKE_SHARD: 1/1
        run: PHOTOSPHERE_SMOKE_BUILD="$PWD/out/app" PHOTOSPHERE_SMOKE_PSI="$PWD/out/psi/bin/psi" bun run test:ziggy

      - name: Collect the logs of failed scenarios and any crash reports
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app-smoke-logs/crash-reports"
          if [ -d "${TMPDIR%/}/photosphere-tests" ]; then
              cp -R "${TMPDIR%/}/photosphere-tests" "$RUNNER_TEMP/app-smoke-logs/"
          fi
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
              cp -R "$HOME/Library/Logs/DiagnosticReports/." "$RUNNER_TEMP/app-smoke-logs/crash-reports/"
          fi

      - name: Upload the logs of failed scenarios and any crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-logs-${{ inputs.platform }}
          path: ${{ runner.temp }}/app-smoke-logs
          retention-days: 5

  cli:
    timeout-minutes: 60
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/test-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore the third-party libraries
        uses: ./.github/actions/third-party-libraries
        with:
          platform: ${{ inputs.platform }}
          build-args: -Dtarget=${{ inputs.target }}

      # One cache for the CLI build, the unit tests and scenario 75's `zig build test-integration`, which share most compile steps.
      - name: Cache Zig's build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-${{ hashFiles('mise.toml', '**/*.zig', 'build.zig.zon', 'third-party/*/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-test-build-baseline-

      - name: Build the Zig CLI
        shell: bash
        run: zig build -Dcpu=baseline --prefix out/psi

      # A tar, which keeps the executable bit an artifact would lose.
      - name: Pack the Zig CLI
        shell: bash
        run: tar -cf "$RUNNER_TEMP/psi.tar" out/psi

      - name: Upload the Zig CLI for the app job
        uses: actions/upload-artifact@v4
        with:
          name: test-psi-${{ inputs.platform }}
          path: ${{ runner.temp }}/psi.tar
          retention-days: 1
          compression-level: 1

      - name: Install media processing tools
        uses: ./.github/actions/retry-install
        with:
          run: brew install imagemagick ffmpeg tree
          verify: magick|convert ffmpeg ffprobe

      # The getImageDetails format test reads images from test/formats, which are made on the machine rather than committed.
      - name: Make the format test images
        shell: bash
        run: bash scripts/make-format-test-images.sh

      - name: Run the Zig unit tests
        timeout-minutes: 30
        shell: bash
        run: zig build test -Dcpu=baseline --summary all --test-timeout 20m

      # Run whether or not the unit tests passed, so one push reports both.
      - name: Run the Zig CLI smoke tests
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        working-directory: ./apps/cli-zig
        shell: bash
        run: PHOTOSPHERE_SMOKE_PSI="$PWD/../../out/psi/bin/psi" ./smoke-tests-zig.sh

      - name: Collect the logs of failed CLI smoke tests
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-smoke-logs"
          if [ -d "${TMPDIR%/}/photosphere-tests" ]; then
              cp -R "${TMPDIR%/}/photosphere-tests" "$RUNNER_TEMP/cli-smoke-logs/"
          fi

      - name: Upload the logs of failed CLI smoke tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-logs-${{ inputs.platform }}
          path: ${{ runner.temp }}/cli-smoke-logs
          retention-days: 5
