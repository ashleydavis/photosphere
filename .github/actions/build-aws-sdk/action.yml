name: Build the AWS SDK for C
description: >
  Builds the AWS SDK for C and aws-lc with their own build in third-party/aws, into
  third-party/aws/zig-out where Photosphere's Zig build looks for it. The result is cached, and the build is
  skipped when nothing it is built from has changed, so a job that needs the library runs this too and
  restores it. The job has to check the repository out first.

inputs:
  platform:
    description: >
      The platform the library is built for, which goes into its cache key (for example linux-x64).
    required: true

  build-args:
    description: >
      Extra arguments passed to zig build, such as -Dtarget=aarch64-ios. Left empty,
      the library is built for the runner's architecture and operating system.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Installed even when the build is cached, so the job's later steps can run zig.
    - name: Setup Zig (version from mise.toml)
      uses: jdx/mise-action@v2
      with:
        install_args: zig

    # The key covers everything the library is built from: the Zig version in mise.toml, the source in third-party/aws,
    # the platform and the build arguments. Any change to one of them builds it again.
    - name: Restore the AWS SDK for C and aws-lc from the cache
      id: cache
      uses: actions/cache@v4
      with:
        path: third-party/aws/zig-out
        key: aws-sdk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.platform }}-baseline-${{ inputs.build-args }}-${{ hashFiles('mise.toml', 'third-party/aws/**') }}

    - name: Build the AWS SDK for C and aws-lc
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: third-party/aws
      # Built for any CPU of the architecture, not the CPU of the runner that builds it, because the library is cached and run on
      # other runners. A build for the builder's own CPU crashed zig-unit-tests with "Illegal instruction" in zlib. Word splitting
      # of build-args is intended: it is a space-separated list of arguments.
      run: zig build -Dcpu=baseline ${{ inputs.build-args }}
