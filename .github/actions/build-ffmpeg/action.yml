name: Build FFmpeg
description: >
  Builds FFmpeg with its own build in third-party/ffmpeg, into
  third-party/ffmpeg/zig-out where Photosphere's Zig build looks for it. The result is cached, and the build is
  skipped when nothing it is built from has changed, so a job that needs the library runs this too and
  restores it. The job has to check the repository out first.

inputs:
  platform:
    description: >
      The platform the library is built for, which goes into its cache key (for example linux-x64).
    required: true

  build-args:
    description: >
      Extra arguments passed to zig build, such as -Dtarget=aarch64-ios. Left empty,
      the library is built for the runner's architecture and operating system.
    required: false
    default: ""

  config-name:
    description: >
      A directory of third-party/ffmpeg/config to make with generate-config.sh before the build when it is missing, for a target
      whose generated files are not checked in (iOS, whose come from the SDK of the Mac doing the build). Left empty, none is made.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Installed even when the build is cached, so the job's later steps can run zig.
    - name: Setup Zig (version from mise.toml)
      uses: jdx/mise-action@v2
      with:
        install_args: zig

    # The key covers everything the library is built from: the Zig version in mise.toml, the source in third-party/ffmpeg and third-party/zlib-ng (which it builds against),
    # the platform and the build arguments. Any change to one of them builds it again. What a build writes (zig-out, zig-pkg,
    # .zig-cache) is left out of the hash: a job that has already restored or built one library would otherwise see a different hash
    # for the next library that is built over it, and miss the cache.
    - name: Restore FFmpeg from the cache
      id: cache
      uses: actions/cache@v4
      with:
        path: third-party/ffmpeg/zig-out
        key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ inputs.platform }}-baseline-${{ inputs.build-args }}-${{ hashFiles('mise.toml', 'third-party/ffmpeg/**', '!third-party/ffmpeg/zig-out/**', '!third-party/ffmpeg/zig-pkg/**', '!third-party/ffmpeg/.zig-cache/**', 'third-party/zlib-ng/**', '!third-party/zlib-ng/zig-out/**', '!third-party/zlib-ng/zig-pkg/**', '!third-party/zlib-ng/.zig-cache/**') }}

    # After the cache key is worked out, so the files it makes do not change the key a job that only restores the library works out.
    - name: Make FFmpeg's generated files for the target
      if: steps.cache.outputs.cache-hit != 'true' && inputs.config-name != ''
      shell: bash
      run: |
        if [ ! -d "third-party/ffmpeg/config/${{ inputs.config-name }}" ]; then
            bash "third-party/ffmpeg/generate-config.sh" "${{ inputs.config-name }}"
        fi

    - name: Build FFmpeg
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: third-party/ffmpeg
      # Built for any CPU of the architecture, not the CPU of the runner that builds it, because the library is cached and run on
      # other runners. A build for the builder's own CPU crashed zig-unit-tests with "Illegal instruction" in zlib. Word splitting
      # of build-args is intended: it is a space-separated list of arguments.
      run: zig build -Dcpu=baseline ${{ inputs.build-args }}
