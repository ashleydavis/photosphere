name: Take a handoff from an earlier job
description: >
  Restores what an earlier job of the same workflow run handed off with the handoff-upload action, at the same paths in the
  workspace, with executable bits and symbolic links as they were. The job has to need the job that uploaded it, so the
  upload has finished. Fails when the handoff is missing.

inputs:
  name:
    description: The name handoff-upload was given (for example app-linux).
    required: true

runs:
  using: composite
  steps:
    - name: Download the handoff
      uses: actions/download-artifact@v4
      with:
        name: handoff-${{ inputs.name }}
        path: ${{ runner.temp }}/handoff-${{ inputs.name }}

    - name: Unpack the handoff into the workspace
      shell: bash
      env:
        HANDOFF_NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail

        archive="$RUNNER_TEMP/handoff-$HANDOFF_NAME/handoff.tar.gz"

        # Read from standard input, because GNU tar on the Windows runners takes the drive letter of a path given to -f for a
        # remote host name.
        tar -xzf - < "$archive"

        # The archive is not needed once unpacked, and the larger ones hold a whole Zig build cache.
        rm "$archive"
