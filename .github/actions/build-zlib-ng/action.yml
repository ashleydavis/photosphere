name: Build zlib-ng
description: >
  Builds zlib-ng with its own build in third-party/zlib-ng, into
  third-party/zlib-ng/zig-out where Photosphere's Zig build looks for it. The result is stored as an artifact, and the build is
  skipped when nothing it is built from has changed, so a job that needs the library runs this too and
  restores it. The job has to check the repository out first.

inputs:
  platform:
    description: >
      The platform the library is built for, which goes into its key (for example linux-x64).
    required: true

  build-args:
    description: >
      Extra arguments passed to zig build, such as -Dtarget=aarch64-ios. Left empty,
      the library is built for the runner's architecture and operating system.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Installed even when the build is stored, so the job's later steps can run zig. Not again when an earlier step put it on the
    # PATH: a second mise-action in a job looks through the workspace for its cache key, and on Windows it failed with EPERM on a
    # file of the zig-pkg the previous library build had fetched.
    - name: Find Zig
      id: zig
      shell: bash
      run: |
        if command -v zig > /dev/null; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
        else
            echo "found=no" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Zig (version from mise.toml)
      if: steps.zig.outputs.found != 'yes'
      uses: jdx/mise-action@v2
      with:
        install_args: zig

    # The key covers everything the library is built from: the Zig version in mise.toml, the source in third-party/zlib-ng,
    # the platform and the build arguments. Any change to one of them builds it again. What a build writes (zig-out, zig-pkg,
    # .zig-cache) is left out of the hash: a job that has already restored or built one library would otherwise see a different hash
    # for the next library that is built over it, and miss the artifact.
    - name: Look for zlib-ng's artifact
      id: artifact
      shell: bash
      run: bash .github/actions/third-party-libraries/find-library-artifact.sh zlib-ng-${{ inputs.platform }} "$KEY"
      env:
        GH_TOKEN: ${{ github.token }}
        KEY: zlib-ng-${{ runner.os }}-${{ runner.arch }}-${{ inputs.platform }}-baseline-${{ inputs.build-args }}-${{ hashFiles('mise.toml', 'third-party/zlib-ng/**', '!third-party/zlib-ng/zig-out/**', '!third-party/zlib-ng/zig-pkg/**', '!third-party/zlib-ng/.zig-cache/**') }}

    - name: Download zlib-ng
      if: steps.artifact.outputs.run-id != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.name }}
        run-id: ${{ steps.artifact.outputs.run-id }}
        github-token: ${{ github.token }}
        path: third-party/zlib-ng/zig-out

    - name: Build zlib-ng
      if: steps.artifact.outputs.run-id == ''
      shell: bash
      working-directory: third-party/zlib-ng
      # Built for any CPU of the architecture, not the CPU of the runner that builds it, because the library is stored and run on
      # other runners. A build for the builder's own CPU crashed zig-unit-tests with "Illegal instruction" in zlib. Word splitting
      # of build-args is intended: it is a space-separated list of arguments.
      run: zig build -Dcpu=baseline ${{ inputs.build-args }}

    - name: Upload zlib-ng
      if: steps.artifact.outputs.run-id == ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: third-party/zlib-ng/zig-out
        retention-days: 90
        overwrite: true
        if-no-files-found: error
