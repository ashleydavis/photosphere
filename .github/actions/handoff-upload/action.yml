name: Hand off to a later job
description: >
  Hands a job's output to later jobs of the same workflow run, as a GitHub artifact that the handoff-download action
  restores. The paths are packed into one gzipped tar archive first, so the executable bits, symbolic links and file names
  that an artifact on its own would lose or refuse all arrive exactly as they were. This replaced a save to the GitHub
  Actions cache under a key holding the run id: the repository's caches pass GitHub's 10 GB limit when several pull requests
  run at once, GitHub then evicts the least recently used entries, and a later job of the same run failed its restore of a
  key an earlier job had saved (Release macOS x64 run 42325362414, Release iOS run 42421688787). Artifacts are not evicted.

inputs:
  name:
    description: >
      The handoff's name, unique within the workflow run and naming the platform (for example app-linux). The artifact is
      called handoff-<name>, and handoff-download takes the same name.
    required: true

  paths:
    description: >
      The files and directories to hand off, one per line, relative to the workspace. A line may be a glob, which must
      match at least one path. A path that does not exist fails the step.
    required: true

runs:
  using: composite
  steps:
    - name: Pack the handoff into a tar archive
      shell: bash
      env:
        HANDOFF_NAME: ${{ inputs.name }}
        HANDOFF_PATHS: ${{ inputs.paths }}
        # Keeps the macOS tar from adding AppleDouble ._ files for extended attributes, which the Linux release job would
        # otherwise extract beside the real ones.
        COPYFILE_DISABLE: "1"
      run: |
        set -euo pipefail

        # An unmatched glob is an error rather than a literal path, so a missing output fails here and names itself.
        shopt -s failglob

        members=()
        while IFS= read -r pattern; do
            if [ -z "$pattern" ]; then
                continue
            fi
            # Unquoted on purpose: the line is expanded as a glob.
            for match in $pattern; do
                members+=("$match")
            done
        done <<< "$HANDOFF_PATHS"

        if [ "${#members[@]}" -eq 0 ]; then
            echo "::error::The handoff $HANDOFF_NAME was given no paths"
            exit 1
        fi

        archive_dir="$RUNNER_TEMP/handoff-$HANDOFF_NAME"
        mkdir -p "$archive_dir"

        # The archive is written to standard output and redirected, because GNU tar on the Windows runners takes the drive
        # letter of a path given to -f for a remote host name.
        tar -czf - "${members[@]}" > "$archive_dir/handoff.tar.gz"
        ls -la "$archive_dir"

    - name: Upload the handoff
      uses: actions/upload-artifact@v4
      with:
        name: handoff-${{ inputs.name }}
        path: ${{ runner.temp }}/handoff-${{ inputs.name }}/handoff.tar.gz
        if-no-files-found: error
        # Only the later jobs of this run read it.
        retention-days: 1
        # The archive is already gzipped.
        compression-level: 0
        # Re-running every job of a run uploads it again, under a name the earlier attempt already used.
        overwrite: true
